  title: "Preflight preparation procedures"
  items:
    - { say: "Master lights, test (panel scan, all 2 bulps), checked." }
    - { say: "Ap disconnect lights, test 1 (captain), checked." }
    - { say: "Ap disconnect lights, test 2 (captain), checked." }
    - { say: "Ap disconnect lights, test 1 (first officer), checked." }
    - { say: "Ap disconnect lights, test 2 (first officer), checked." }
    - { say: "Master lights, bright, set." }
    - { say: "Pilot oxygen mask, normal test (push), checked." }
    - { say: "Pilot oxygen mask, emergency test (hold), checked." }
    - { say: "Main panel, backgr., afds lightning, bright, as needed." }
    - { say: "Nose wheel steering, guard closed, checked." }
    - { say: "Clock, utc time, checked." }
    - { say: "Main panel du, norm, checked." }
    - { say: "Lower du, norm, checked." }
    - { say: "Weather radar, off, checked.", check: weather_radar, is: off }
    - { say: "Airport button, on (captain), set." }
    - { say: "Terrain radar, on (captain), set." }
    - { say: "Barometric reference selector, in/hpa, set." }
    - { say: "Barometric value, local qnh, set." }
    - { say: "Minimums reference selector, baro, set." }
    - { say: "Minimums, airport elevation + 1000 ft, set." }
    - { note: "(minimum flap retraction altitude)." }
    - { say: "First officer oxygen mask, normal test, checked." }
    - { say: "First officer oxygen mask, emergency test (hold), checked." }
    - { say: "Panel lightning, set, as needed." }
    - { say: "Flap inhibit, guard closed, checked." }
    - { say: "Gear inhibit, guard closed, checked." }
    - { say: "Terrain inhibit, guard closed, checked." }
    - { say: "Gwps ground sys, test, set." }
    - { say: "Clock, utc time, set." }
    - { say: "Main panel du, norm, checked." }
    - { say: "Lower du, norm, checked." }
    - { say: "Terrain radar, on (first officer, tfc dist. <40), set." }
    - { say: "Weather radar, off, checked.", check: weather_radar, is: off }
    - { say: "Barometric reference selector, in/hpa, set." }
    - { say: "Barometric value, local qnh, set." }
    - { say: "Minimums reference selector, baro, set." }
    - { say: "Minimums, airport elevation + 1000 ft, set." }
    - { say: "Service crews on ground, stop, set." }
    - { say: "Fwd & aft service doors, closed, set." }
    - { say: "Fwd entry door, open, set.", check: doors, is: open }
    - { say: "Aft entry door, open, as needed." }
    - { say: "Pax & cargo, flightplan (match zfw), load." }
    - { say: "Flight leg, start, set." }
    - { say: "Aircraft model, correct, checked." }
    - { say: "Engine rating, correct, checked." }
    - { say: "Nav data base, actual, checked." }
    - { say: "Irs position, gps l data (next page), set." }
    - { say: "Ref airport, origin icao, set." }
    - { say: "Origin icao, set." }
    - { say: "Destination icao, set." }
    - { say: "Flight number, set." }
    - { say: "Airways & waypoint routing, set." }
    - { say: "Departure routing, runway & sid, selected." }
    - { say: "Arrival routing, runway & star, selected." }
    - { say: "Route, no discontinuities, checked." }
    - { say: "Route, activated, set." }
    - { say: "Zero fuel weight, flightplan (estimated), set." }
    - { say: "Reserves, flightplan, roundup 0.1 tons, set." }
    - { say: "Cost index, flightplan ci, set." }
    - { say: "Trip cruise, flightplan altitude, set." }
    - { say: "Cruise, flightplan toc wind, set." }
    - { say: "Isa deviation, flightplan toc tdv, set." }
    - { say: "Transition altitude, sid chart, set." }
    - { say: "First waypoint after toc, new wind, set." }
    - { note: "Set avg wind according flightplan." }
    - { say: "Flt control a & b, guard closed, checked." }
    - { say: "Spoiler a & b, guard closed, checked." }
    - { say: "Alternate flaps position, guard closed, checked." }
    - { say: "Yaw damper, on, set.", check: yaw_damper, is: on }
    - { say: "Vhf nav transfer, normal, checked." }
    - { say: "Irs transfer, normal, checked." }
    - { say: "Fmc transfer, normal, checked." }
    - { say: "Display source, auto, checked." }
    - { say: "Display control panel, normal, checked." }
    - { say: "Engine valve l & r, closed (dimmed), checked." }
    - { say: "Spar valve l & r, closed (dimmed), checked." }
    - { say: "Ctr fuel pumps l & r, on (> 453kgs), as needed." }
    - { say: "Aft & fwd fuel pumps 1, on, set.", check: fuel_pumps, is: on }
    - { say: "Fwd & aft fuel pumps 2, on, set." }
    - { say: "Crossfeed valve, set open & light dimmed, checked." }
    - { say: "Crossfeed valve, set closed & light off, checked." }
    - { say: "Electrical ac switch, apu gen, set." }
    - { say: "Battery, guard closed, checked." }
    - { say: "Standby power, guard closed, checked." }
    - { say: "Disconnect gen. drives, guards closed, checked." }
    - { say: "Supply switch, normal, checked." }
    - { say: "Exhaust switch, normal, checked." }
    - { say: "Emergency exit lights, guard closed, checked." }
    - { say: "Fasten belts, on (if refueling completed), set.", check: seat_belts, is: on }
    - { say: "Left side & fwd window heats, on, set." }
    - { say: "Right side & fwd window heats, on, set." }
    - { say: "Engine hydraulic pumps 1 & 2, on, checked." }
    - { say: "Electric hydraulic pumps a & b, on, checked.", check: hydraulic_pumps, is: on }
    - { say: "System hyd press > 2800 psi, quantity > 76%, checked." }
    - { say: "Display, eng (engine page), set." }
    - { say: "Cabin diff pressure, 0 psi, checked." }
    - { say: "Cabin alt, indicates airport altitude, checked." }
    - { say: "Cabin climb, indicates 0, checked." }
    - { say: "Trim air, on, set." }
    - { note: "To get a consistent cabin temp." }
    - { say: "Fwd cab selector, auto or set (aim 28 deg.), as needed." }
    - { say: "Cont cab selector, turn left (fwd cab -1), set." }
    - { say: "Aft cab selector, turn right (fwd cab +1), set." }
    - { say: "Left & right recirc fans, auto, checked." }
    - { say: "Left & right air conditioning pack, auto, set.", check: packs, is: on }
    - { say: "Isolation valve, open, checked." }
    - { say: "Engine bleed air 1 & 2, on, checked.", check: engine_bleeds, is: on }
    - { say: "Apu bleed, off (on if apu is running), checked." }
    - { say: "Flight altitude indicator, cruise altitude, set." }
    - { say: "Landing altitude indicator, rwy elevation, set." }
    - { note: "(round rwy elevation to nearest +-50 ft)." }
    - { say: "Pressurization mode selector, auto, set." }
    - { say: "Wheel well light, off, checked." }
    - { say: "Wing light, off, checked." }
    - { say: "Anti collision light, off, checked.", check: lights.beacon, is: off }
    - { say: "Position lights, steady, checked.", check: lights.nav, is: on, act: false }
    - { say: "Logo light, on (in darkness), as needed." }
    - { say: "Ignition select, right position, checked." }
    - { say: "Engine start switches 1 & 2, auto, checked.", check: start_switch, is: normal }
    - { say: "Taxi light, off, checked.", check: lights.taxi, is: off }
    - { say: "Left & right runway turnoff lights, off, checked." }
    - { say: "Left & right landing lights, off, checked.", check: lights.landing, is: off, act: false }
    - { note: "Set mcp for departure (rawdata)." }
    - { say: "Course 1 & 2, to sid-vor, set." }
    - { say: "Captain flight director, on, set.", check: flight_director, is: on }
    - { say: "First officer flight director, on, set." }
    - { say: "Autopilot disengage bar, up, checked." }
    - { say: "Autopilots, all off, checked." }
    - { say: "Bank angle below fl300, 25 degrees, set." }
    - { say: "Departure heading, according charts, set." }
    - { say: "Initial climb clearance, according charts, set." }
    - { say: "Standby altimeter baro. select., in/hpa, set." }
    - { say: "Standby altimeter, local qnh, set." }
    - { say: "Standby rmi, adf / vor (rawdata backup), as needed." }
    - { say: "N1 set selector, auto, checked." }
    - { say: "Spd ref selector, auto, checked." }
    - { say: "Auto brakes, rto, set.", check: autobrake, is: rto }
    - { say: "Auto brakes annunciator, unilluminates, checked." }
    - { say: "Fuel flow, reset then rate, set." }
    - { say: "Initial com-frequencies, according charts, tuned." }
    - { say: "Nav-frequencies, active & passive (rawdata), tuned." }
    - { say: "Adf-frequencies, active & passive (rawdata), as needed." }
    - { say: "Initial transponder code, 2000, set." }
    - { note: "Transponder switches, booth 1 (not modeled)." }
    - { say: "Mic selectors, 1-vhf (capt.) & 2-vhf (first off.), set." }
    - { say: "Flight deck door, closed, checked." }

shutdown:
  title: "Transit shutdown procedure"
  items:
    - { say: "Parking brake, pulled (active), set.", check: park_brake, is: on }
    - { say: "Engine start levers 1 & 2, cutoff, done.", check: start_levers, is: cutoff }
    - { say: "Anti collision lights, off (if n1 <20%), set.", check: lights.beacon, is: off }
    - { say: "Initial transponder code, 2000, set." }
    - { say: "Transponder, standby, set.", check: transponder, is: standby, act: false }
    - { say: "Flight deck door, open, done." }
    - { note: "If gate power available." }
    - { say: "Ac ground power, on, set." }
    - { note: "If not connect to gpu." }
    - { say: "Gpu ground service, connected, set." }
    - { say: "Ac ground power, on, set." }
    - { say: "Apu, off, set.", check: apu, is: off }
    - { say: "Left & right wiper, park position, set." }
    - { say: "Chimes only, off (release cabin crew), set." }
    - { say: "Fasten belts, off, set.", check: seat_belts, is: off }
    - { say: "Electric hydraulic pumps a & b, off, set.", check: hydraulic_pumps, is: off }
    - { say: "Isolation valve, open, set." }
    - { say: "Cabin lighting, white bright (passengers), set." }
    - { say: "Fwd entry door, open, set.", check: doors, is: open }
    - { say: "Aft entry door, open, as needed." }
    - { say: "Fwd & aft cargo doors, open, set.", check: cargo_doors, is: open }
    - { say: "Reminder, stop tracking client, done." }
    - { say: "Pax & cargo, total 0 (efb, loadsheet), unload." }
    - { say: "Flight leg, terminate, set." }
    - { say: "Aft entry door, closed, set." }
    - { say: "Fwd & aft cargo doors, closed, as needed.", check: cargo_doors, is: closed }
    - { note: "Opened:  activates turnaround." }
    - { note: "Closed:  continue to c&d shutdown." }
    - { say: "Normal checklist, shutdown (read out), compl.." }
