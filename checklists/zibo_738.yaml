# Native checklist (format: src/checklist.rs), from Vin Kaizen's Zibo 737 procedures (clist.txt v9.0), the phases the crew runs.

engine_start:
  title: "Engine start & pushback procedure"
  items:
    - { say: "Contact atc, ifr / start-up clearance, done." }
    - { say: "Sid, as given by atc, set." }
    - { say: "Initial altitude, as given by atc, set." }
    - { say: "Transponder code, as given by atc, set." }
    - { say: "Transponder, alt off (ivao stby), set.", check: transponder, is: standby, act: false }
    - { say: "Anti collision light, on, set.", check: lights.beacon, is: on }
    - { say: "Left & right air conditioning packs, off, set.", check: packs, is: off }
    - { say: "Normal checklist, before start (read out), compl.." }
    - { note: "(start below the line till end)." }
    - { say: "Contact atc, request push & start, done." }
    - { say: "Start pushback, as given by atc, done." }
    - { note: "Follow ground instructions for pushback." }
    - { say: "Engine start switch 2, ground, set.", check: start_switch.2, is: ground }
    - { say: "Engine 2 start lever, idle reaching 25% n2, set.", check: start_levers.2, is: idle }
    - { note: "Monitor egt 2, cutoff if temp. >500 degrees." }
    - { say: "Engine 2, stable (20% n1, ~420 deg., 65% n2), checked.", check: start_switch.2, is: normal }
    - { say: "Engine start switch 1, ground, set.", check: start_switch.1, is: ground }
    - { say: "Engine 1 start lever, idle reaching 25% n2, set.", check: start_levers.1, is: idle }
    - { note: "Monitor egt 1, cutoff if temp. >500 degrees." }
    - { say: "Engine 1, stable (20% n1, ~420 deg., 65% n2), checked.", check: start_switch.1, is: normal }

before_taxi:
  - { say: "Engine generators 1 & 2, on, set.", check: electrical.generators, is: on, act: false }
  - { say: "Apu switch, off, set.", check: apu, is: off }
  - { say: "Engine start switches 1 & 2, continues, set.", check: start_switch, is: continuous }
  - { note: "Left & right wiper, int / low / high (rain)." }
  - { say: "Probe heats a & b, on, set.", check: pitot_heat, is: on, act: false }
  - { note: "Engine anti ice, temp. <10 degrees & vis. moist." }
  - { note: "Wing anti ice, temp. <10 degrees & vis. moist." }
  - { say: "Left & right air conditioning pack, auto, set.", check: packs, is: on }
  - { say: "Isolation valve, auto, set." }
  - { say: "Apu bleed, off, set.", check: apu_bleed, is: off }
  - { say: "Pushback crew, disconn. & showing bypass pin, checked." }
  - { note: "(do nothing until you´ve seen bypass pin!)." }
  - { say: "Take-off flaps, as calculated, set." }
  - { say: "Flight control elevators, full forward, checked.", check: controls, is: pitch_forward }
  - { say: "Flight control elevators, full back, checked.", check: controls, is: pitch_aft }
  - { say: "Flight control ailerons, full left, checked.", check: controls, is: roll_left }
  - { say: "Flight control ailerons, full right, checked.", check: controls, is: roll_right }
  - { say: "Flight control rudder, full left, checked.", check: controls, is: yaw_left }
  - { say: "Flight control rudder, full right, checked.", check: controls, is: yaw_right }
  - { say: "Recall, sixpack push (captain or first officer), set." }
  - { say: "Recall, sixpack all off (captain & first officer), checked." }
  - { say: "Lower du, switch off engine page (mfd), set." }
  - { note: "(it will popup during engine exceedance)." }
  - { say: "Normal checklist, before taxi (read out), compl.." }

before_takeoff:
  - { say: "Contact atc, request takeoff clearance, done." }
  - { say: "Position lights, strobe & steady, set.", check: lights.strobe, is: on, act: false }
  - { say: "Left & right landing lights, on, set.", check: lights.landing, is: on, act: false }
  - { say: "Autothrottle, active, set.", check: autothrottle, is: armed }
  - { say: "Lnav or hdg sel, active, set." }
  - { say: "Vnav, active, set." }
  - { say: "Weather radar, on (captain, tfc dist. >5), set.", check: weather_radar, is: on }
  - { say: "Transponder, ta/ra, set.", check: transponder, is: altitude, act: false }
  - { say: "Yoke checklist, before take-off (read out), compl.." }

cruise:
  title: "Cruise procedure (level off)"
  items:
    - { say: "Cabin lighting, cruise (passengers), set." }
    - { say: "Cabin lighting, white medium (entry), set." }
    - { say: "Pax announcement, level off message, played." }

after_landing:
  - { say: "Reverse levers, idle <60 knots, done." }
  - { say: "Reverse levers, closed <30 knots, done." }
  - { say: "Auto brakes, off, set.", check: autobrake, is: off }
  - { say: "Manual brakes, till <15 knots, done." }
  - { say: "Speedbrake lever, down (retract), set.", check: speedbrake, is: down }
  - { say: "Flaps, up & clear runway, done.", check: flaps, is: up, act: false }
  - { say: "Weather radar, off (captain), set.", check: weather_radar, is: off }
  - { say: "Terrain radar, off (first officer), set." }
  - { say: "Left & right landing lights, off, set.", check: lights.landing, is: off, act: false }
  - { say: "Position lights, steady (off rwy), set.", check: lights.nav, is: on, act: false }
  - { say: "Transponder, alt off (ivao stby), set.", check: transponder, is: standby, act: false }
  - { say: "Contact atc, report rwy vacated, done." }

before_landing:
  title: "Landing procedure"
  items:
    - { note: "At 4,5 nm dme to runway." }
    - { say: "Landing gear lever, down, set.", check: gear, is: down }
    - { say: "Flaps, 15, set.", check: flaps, is: "15", act: false }
    - { say: "Airspeed bug, flaps 15 speed, set." }
    - { say: "Left & right wiper, int / low / high (in rain), as needed." }
    - { say: "Engine start switches 1 & 2, continues, set.", check: start_switch, is: continuous }
    - { say: "Recall, sixpack push (captain or first officer), set." }
    - { say: "Recall, sixpack all off (captain & first officer), checked." }
    - { say: "Speedbrake lever, armed (green lights), checked.", check: speedbrake, is: armed }
    - { say: "Auto brakes, set as calculated, checked.", check: autobrake, is: on }
    - { say: "Landing gear, down (3 green), checked.", check: gear, is: down }
    - { say: "Landing flaps, set 30 or 40 (green lights), set." }
    - { say: "Airspeed bug, vref + 50% hw (approach), set." }
    - { say: "Taxi light, on, set.", check: lights.taxi, is: on }
    - { say: "A/p disengage, yoke button, set." }
    - { say: "Autothrottle, off, set.", check: autothrottle, is: off }
    - { note: "30 feet, check - close - hold." }

climb:
  - { say: "Landing gear lever, up, done.", check: gear, is: up }
  - { say: "Left & right wiper, park position (max 200kts), set." }
  - { note: "Engine anti ice, temp. <10 degrees & vis. moist." }
  - { note: "Wing anti ice, temp. <10 degrees & vis. moist." }
  - { say: "Autopilot, engage (above 1000 ft agl), set.", check: autopilot, is: on, act: false }
  - { note: "For noise abatement departures." }
  - { note: "Start flaps up speed & flaps retract acc." }
  - { note: "Nadp1:   >3000 ft agl      nadp2:    > 800 ft agl." }
  - { note: "Proc a:  >3000 ft agl      proc b:  >1000 ft agl." }
  - { note: "Accelerate normal climb speed >3000 ft agl." }
  - { say: "Airspeed bug, flaps up speed, set." }
  - { say: "Flaps, retract (above each previous flap bug), done.", check: flaps, is: up, act: false }
  - { say: "Landing gear lever, off, set." }
  - { say: "Auto brakes, off, set.", check: autobrake, is: off }
  - { say: "Engine start switches 1 & 2, auto, as needed.", check: start_switch, is: normal }
  - { note: "(continues if <10 degrees & visible moisture)." }
  - { say: "Cabin pressure & differential, within limits, checked." }
  - { say: "Pressurization selector, auto, checked." }
  - { say: "Apu bleed, off, checked.", check: apu_bleed, is: off }
  - { say: "Engine bleed air 1 & 2, on, checked.", check: engine_bleeds, is: on }
  - { say: "Left & right air conditioning pack, auto, checked.", check: packs, is: on }
  - { say: "Isolation valve, auto, checked." }
  - { say: "Left & right duct pressure, working, checked." }
  - { say: "Contact atc, report height & position, done." }
  - { note: "At transition alt. or if cleared to fl." }
  - { say: "Altimeters, std (captain & first officer), set." }
  - { say: "Standby altimeter, std, set." }
  - { say: "Yoke checklist, after take-off (read out), compl.." }
  - { say: "Chimes only, off (release cabin crew), set." }
  - { say: "Cabin attend button, push (as crewinfo), set." }

descent:
  - { say: "Descend weather, max 3 flightlevel steps, set." }
  - { say: "Descend weather, flightplan wind data, set." }
  - { say: "Transition level, arrival, set." }
  - { say: "Local qnh, arrival, set." }
  - { say: "Isa deviation, flightplan avg isa, set." }
  - { say: "Fix, destination landing runway (rw14l), set." }
  - { say: "Distance rings, /10 /4.5 /xx nautical miles, set." }
  - { note: "Xx (t/d-ring): ~(cruise fl/10*3)+10nm." }
  - { say: "Decision altitute height, according chart, set." }
  - { say: "Nav-frequencies, active (captain & first officer), set." }
  - { say: "Courses, according approach chart, set." }
  - { say: "Altitude bug, adjust till iaf clearance, set." }
  - { note: "Use actual gw (fmc) + actual - landing fuel." }
  - { say: "Landing performance calculation, done." }
  - { say: "Landing flaps / vref, select 2* to fill flap/spd, set." }
  - { say: "Auto brakes, as calculated, set.", check: autobrake, is: on }
  - { say: "Yoke checklist, descent (read out, move knob), compl.." }
  - { say: "Cabin lighting, landing (passengers), set." }
  - { say: "Cabin lighting, white bright (entry), set." }
  - { say: "Pax announcement, descent message (pa system), played." }
  - { note: "Engine start switches 1 & 2, cont <10d. & v.m." }
  - { note: "Engine anti ice, temp. <10 degrees & vis. moist." }
  - { note: "Wing anti ice, temp. <10 degrees & vis. moist." }
  - { note: "Passing 10 thousand feet." }
  - { say: "Left & right landing lights, on, set.", check: lights.landing, is: on, act: false }
  - { say: "Left & right runway turnoff lights, on, set." }
  - { say: "Logo light, on (in darkness), as needed." }
  - { say: "Fasten belts, on, set.", check: seat_belts, is: on }
  - { note: "At the latest passing transition level." }
  - { say: "Barometric ref. selector, hpa (capt. & first off.), set." }
  - { say: "Barometric value, local qnh, set." }
  - { say: "Standby altimeter barometric selector, hpa, set." }
  - { say: "Standby altimeter, local qnh, set." }
  - { say: "Standby altimeter, approach mode (for ils), set." }
  - { say: "Yoke checklist, approach (read out, move knob), compl.." }
  - { say: "Contact atc, report height, position, info, done." }
  - { note: "Reaching initial approach fix (iaf)." }
  - { note: "Without clearance, fly holding." }
  - { say: "Pax announcement, prepare landing message, played." }

