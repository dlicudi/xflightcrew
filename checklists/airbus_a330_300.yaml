# Native checklist (format: src/checklist.rs), from the aircraft's own POM (pp.55-84) and its auto-board/auto-start scripts, 2026-09-20.

preflight:
  - { note: "Preflight." }
  - { say: "Parking brake, on.", check: park_brake, is: on }
  - { say: "Transponder, standby.", check: transponder, is: standby, act: false }
  - { say: "Battery 1, on.", check: electrical.battery, is: on }
  - { say: "Battery 2, on." }
  - { say: "Beacon, on.", check: lights.beacon, is: on }
  - { say: "Nav lights, on.", check: lights.nav, is: on }
  - { say: "Apu battery, on." }
  - { say: "Apu master, on.", check: apu, is: on }
  - { say: "Apu, avail." }
  - { say: "Apu generator, on.", check: apu_generator, is: on }
  - { say: "Ir 1, 2, 3, on." }
  - { say: "Adr 1, 2, 3, on." }
  - { say: "Adirs selectors, nav." }
  - { say: "Apu bleed, on.", check: apu_bleed, is: on }
  - { say: "Mcdu, init and perf entered." }
  - { say: "Flight control computers, all on." }
  - { say: "Gpws, all on." }
  - { say: "Electric hydraulic pumps, auto.", check: hydraulic_pumps, is: on }
  - { say: "Fuel pumps, all on.", check: fuel_pumps, is: on }
  - { say: "Bus tie, auto.", check: bus_tie, is: on }
  - { say: "Altimeters, set." }
  - { note: "Preflight complete." }

before_start:
  - { note: "Before start." }
  - { say: "Parking brake, on.", check: park_brake, is: on }
  - { say: "Thrust levers, idle.", check: throttle, is: idle }
  - { say: "Engine masters, off.", check: start_levers, is: cutoff }
  - { say: "Flaps, 0.", check: flaps, is: up }
  - { say: "Speed brake, retracted.", check: speedbrake, is: down }
  - { say: "Fuel quantity, checked." }
  - { say: "Fuel pumps, all on.", check: fuel_pumps.2, is: on }
  - { say: "Apu bleed, on.", check: apu_bleed, is: on }
  - { say: "Doors, closed." }
  - { note: "Before start complete." }

engine_start:
  - { note: "Engine start, number two first: say start the engines." }
  - { say: "Engine mode selector, ign start.", check: start_switch, is: ground }
  - { say: "Engine 2 master, on.", check: start_levers.2, is: idle }
  - { say: "Engine 2 stabilised, checked.", check: n2.2, is: stable }
  - { say: "Engine 1 master, on.", check: start_levers.1, is: idle }
  - { say: "Engine 1 stabilised, checked.", check: n2.1, is: stable }
  - { say: "Engine mode selector, norm.", check: start_switch, is: normal }
  - { say: "Generator 1, on.", check: electrical.generators, is: on }
  - { say: "Generator 2, on." }
  - { say: "Apu generator, off.", check: apu_generator, is: off }
  - { say: "Apu bleed, off.", check: apu_bleed, is: off }
  - { say: "Engine bleeds, on.", check: engine_bleeds, is: on }
  - { say: "Packs, on.", check: packs, is: on }
  - { say: "Apu master, off.", check: apu, is: off }
  - { note: "Engine start complete." }

before_taxi:
  - { note: "Before taxi." }
  - { say: "Seat belt signs, on.", check: seat_belts, is: on }
  - { say: "Taxi light, taxi.", check: lights.taxi, is: on }
  - { say: "Transponder, auto.", check: transponder, is: altitude, act: false }
  - { say: "Tcas, ta ra." }
  - { say: "Flaps, conf 2 for takeoff.", check: flaps, is: takeoff, act: false }
  - { say: "Speed brake, armed.", check: speedbrake, is: armed }
  - { say: "Autobrake, max.", check: autobrake, is: rto }
  - { say: "Flight controls, checked." }
  - { say: "Parking brake, off.", check: park_brake, is: off }
  - { note: "Before taxi complete." }

before_takeoff:
  - { note: "Before takeoff." }
  - { say: "Altimeters, set." }
  - { say: "Flaps, conf 2.", check: flaps, is: takeoff, act: false }
  - { say: "Speed brake, armed.", check: speedbrake, is: armed }
  - { say: "Autobrake, max.", check: autobrake, is: rto }
  - { say: "Flight directors, on.", check: flight_director, is: on }
  - { say: "Speed, v2.", check: speed_bug, is: v2 }
  - { say: "Transponder, auto.", check: transponder, is: altitude, act: false }
  - { say: "Landing lights, on.", check: lights.landing, is: on }
  - { say: "Taxi light, takeoff.", check: lights.taxi, is: on }
  - { say: "Strobes, on.", check: lights.strobe, is: on }
  - { say: "Parking brake, off.", check: park_brake, is: off }
  - { say: "Cabin, secure." }
  - { note: "Before takeoff complete. v1 143, vr 148, v2 153 at mid weight, conf 2." }

climb:
  - { note: "Climb." }
  - { say: "Landing gear, up.", check: gear, is: up }
  - { say: "Flaps, retracted on schedule.", check: flaps, is: up }
  - { say: "Thrust, climb." }
  - { say: "Speed brake, disarmed.", check: speedbrake, is: down }
  - { say: "Landing lights, off above 10,000." }
  - { say: "Taxi light, off.", check: lights.taxi, is: off }
  - { say: "Altimeters, standard at transition." }
  - { say: "Packs, on.", check: packs, is: on }
  - { note: "Climb complete." }

cruise:
  - { note: "Cruise." }
  - { say: "Seat belt signs, as required." }
  - { say: "Landing lights, off.", check: lights.landing, is: off }
  - { say: "Fuel, balanced and sufficient." }
  - { say: "Engine instruments, checked." }
  - { say: "Pressurisation, checked." }
  - { note: "Cruise complete." }

descent:
  - { note: "Descent." }
  - { say: "Seat belt signs, on.", check: seat_belts, is: on }
  - { say: "Approach briefing, complete." }
  - { say: "Mcdu, approach phase and minimums set." }
  - { say: "Autobrake, as required." }
  - { say: "Altimeters, qnh below transition." }
  - { say: "Landing lights, on below 10,000." }
  - { note: "Descent complete." }

before_landing:
  - { note: "Before landing." }
  - { say: "Speed brake, armed.", check: speedbrake, is: armed }
  - { say: "Autobrake, lo or med.", check: autobrake, is: on }
  - { say: "Landing gear, down.", check: gear, is: down }
  - { say: "Flaps, conf 3 or full.", check: flaps, is: landing, act: false }
  - { say: "Landing lights, on.", check: lights.landing, is: on }
  - { say: "Taxi light, takeoff.", check: lights.taxi, is: on }
  - { note: "Before landing complete. vapp 154 mid weight, conf full." }

after_landing:
  - { note: "After landing." }
  - { say: "Flaps, retracted.", check: flaps, is: up }
  - { say: "Speed brake, disarmed.", check: speedbrake, is: down }
  - { say: "Landing lights, off.", check: lights.landing, is: off }
  - { say: "Taxi light, taxi.", check: lights.taxi, is: on }
  - { say: "Strobes, off or auto.", check: lights.strobe, is: off }
  - { say: "Transponder, as required." }
  - { note: "After landing complete." }

shutdown:
  - { note: "Shutdown." }
  - { say: "Parking brake, on.", check: park_brake, is: on }
  - { say: "Seat belt signs, off.", check: seat_belts, is: off }
  - { say: "Transponder, standby.", check: transponder, is: standby, act: false }
  - { say: "Engine 1 master, off.", check: start_levers.1, is: cutoff }
  - { say: "Engine 2 master, off.", check: start_levers.2, is: cutoff }
  - { say: "Fuel pumps, all off.", check: fuel_pumps, is: off }
  - { say: "Adirs selectors, off." }
  - { say: "Beacon, off.", check: lights.beacon, is: off }
  - { say: "Nav lights, off.", check: lights.nav, is: off }
  - { say: "Batteries, off.", check: electrical.battery, is: off }
  - { note: "Shutdown complete." }
