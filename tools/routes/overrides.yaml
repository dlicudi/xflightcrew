# A Wikipedia airline that is a BRAND, not an operator (matched on the
# link target or its text): its operators, the first the default. Where
# BTS has the pair, the operator flying most of it takes the row
# (global-routes spikes: KJFK Delta Connection, KSEA Alaska, KASE).
brands:
  "Delta Connection": [EDV, SKW, RPA]
  "United Express": [SKW, RPA, ASH, GJS, UCA, AWI]
  "American Eagle": [ENY, PDT, JIA, SKW, RPA]
  "Alaska Airlines": [ASA, QXE, SKW]
  "LATAM Chile": [LAN]
  "Air Canada Express": [JZA]

# Wikidata airline codes that name a sister operator (spike: Norwegian Air
# Shuttle's first P230 is NOZ, the flights are NAX).
codes:
  NOZ: NAX

# Designators the performance tables (crates/traffic/src/perf.rs) do not
# know, mapped to the nearest one they do. A type in neither is dropped,
# logged; a row left with no type is dropped, logged.
