# Workspace: the crew (this root package) embeds the world (crates/atc) as a
# library; both stand on crates/sim. One process at runtime — the split is a
# compile-time boundary, not the failed second-terminal experiment.
[workspace]
members = ["crates/atc", "crates/sim"]

# One license across the workspace, inherited by every member, for the same
# reason the deps are pinned here: the crates must never drift apart. GPL-3.0
# (not 2.0) because several deps are Apache-2.0, which is compatible with v3
# only. Decided 2026-07-30; see the Licensing section of CLAUDE.md.
[workspace.package]
license = "GPL-3.0-or-later"
# Cargo's bookkeeping only, never shown: the product version is the date of
# the commit a build sits on, stamped by build.rs (and the plugin's Makefile).
# Nothing here is published, so this never needs to move.
version = "0.0.0"

# One version of each shared dep across the workspace, so the crates never drift.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"

[package]
# The package is the product; the binary is the short form you type. The crate
# identifier that follows from this name (`xvoicelayer`) is also the tracing
# target prefix — if you ever change it, change the RUST_LOG default in
# src/main.rs with it or every crew-side log line silently disappears.
name = "xvoicelayer"
version.workspace = true
edition = "2021"
# Plain `cargo run` means the copilot; the atc binary is opt-in (--bin atc).
default-run = "xvl"
description = "The voice layer for X-Plane 12: copilot, ATC and cabin crew, entirely local"
license.workspace = true
publish = false

[[bin]]
name = "xvl"
path = "src/main.rs"

# The old standalone-ATC dev skeleton: tower FSM + ATIS glue over the atc
# crate's modules (via src/lib.rs re-exports), with its own simple TTS. The
# real standalone product gets its own thin binary at repo-extraction time.
[[bin]]
name = "atc"
path = "src/bin/atc.rs"

[dependencies]
# the world side: ATC as a library (station, tower FSM, nav, atis)
atc = { path = "crates/atc" }
# shared simulator plumbing (Web API client, dataref names, blackbox)
sim = { path = "crates/sim" }

# async runtime + HTTP
tokio = { workspace = true }
reqwest = { workspace = true }
# WebSocket for the live-state subscription cache (see src/livestate.rs); sync,
# matching the rustdecks X-Plane client it's ported from.
tungstenite = { version = "0.21", default-features = false, features = ["handshake"] }
# The EFB's small LAN web server (src/efb/): GET the page, the state and
# its Server-Sent Events, POST a line. axum rides the hyper 1 / tower stack
# reqwest already pulls in, so it adds little; default features off (no
# WebSocket, no multipart, no tracing layer).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
# Global keyboard state for push-to-talk — polled so it works while X-Plane has
# focus (needs macOS Input Monitoring permission). No event-tap run-loop quirks.
device_query = "2"

# serde
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
base64 = { workspace = true }

# audio capture + speech-to-text
cpal = "0.15"
# `metal` runs whisper inference on the Apple GPU instead of pegging CPU cores —
# transcription was the app's main CPU cost (multi-threaded CPU inference spiking
# to ~4 cores per utterance). WhisperContextParameters::default() has use_gpu=true,
# so the feature is all that's needed to activate it on Apple Silicon.
whisper-rs = { version = "0.12", features = ["whisper-cpp-tracing", "metal"] }

# tooling glue
async-trait = { workspace = true }
# bounded-concurrency stream combinators for the failure scan (buffer_unordered
# over ~800 failure-dataref reads with a borrowed client — see src/failures.rs)
futures = "0.3"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Terminal dashboard (optional UI, XCOPILOT_UI=tui)
ratatui = "0.29"
dotenvy = "0.15"

# WAV read/write: the `transcribe` subcommand reads a clip for whisper, and the
# onnx backend writes synthesized PCM for playback. Pure Rust, always built.
hound = "3"

# In-process ONNX TTS (warm session) — optional, behind the `onnx-tts` feature so
# the default build stays light. `ort` wraps libonnxruntime.
ort = { version = "2.0.0-rc.12", optional = true }
earshot = "1.1.0"

[dev-dependencies]
# `start_paused` for the flows that sleep at a crew's pace: a thirty-second
# start runs in milliseconds with the clock paused and the order still tested.
tokio = { version = "1", features = ["full", "test-util"] }

[features]
# Native in-process ONNX TTS is the default voice backend (arm64 onnxruntime via
# `ort`, warm session — no Python sidecar, no x86 piper subprocess under Rosetta).
default = ["onnx-tts"]
# Opt out with `cargo build --no-default-features` to drop the onnxruntime link
# (the voice then falls back to the `say`/`piper` subprocess backends).
onnx-tts = ["dep:ort"]
