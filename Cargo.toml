[package]
name = "x-copilot"
version = "0.1.0"
edition = "2021"
description = "A voice-commanded copilot for X-Plane (working name; product name: Roger)"
license = "LicenseRef-proprietary"
publish = false

[[bin]]
name = "x-copilot"
path = "src/main.rs"

[dependencies]
# async runtime + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"

# audio capture + speech-to-text
cpal = "0.15"
# `metal` runs whisper inference on the Apple GPU instead of pegging CPU cores —
# transcription was the app's main CPU cost (multi-threaded CPU inference spiking
# to ~4 cores per utterance). WhisperContextParameters::default() has use_gpu=true,
# so the feature is all that's needed to activate it on Apple Silicon.
whisper-rs = { version = "0.12", features = ["whisper-cpp-tracing", "metal"] }

# tooling glue
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Terminal dashboard (optional UI, XCOPILOT_UI=tui)
ratatui = "0.29"
dotenvy = "0.15"

# In-process ONNX TTS (warm session) — optional, behind the `onnx-tts` feature so
# the default build stays dependency-free. `ort` wraps libonnxruntime; `hound`
# writes the synthesized PCM to a WAV for playback.
ort = { version = "2.0.0-rc.12", optional = true }
hound = { version = "3", optional = true }

[dev-dependencies]
# WAV reader, used only by the STT integration test.
hound = "3"

[features]
# Build with: cargo build --features onnx-tts  (then XCOPILOT_TTS=onnx)
onnx-tts = ["dep:ort", "dep:hound"]
