# Aircraft profile — X-Plane stock Airbus A330-300 (A333).
#
# The first widebody and the first fly-by-wire airframe: a Laminar aircraft on
# stock systems whose xlua REPLACES more than the 737's — the battery toggles,
# generator 1 on/off and both generator toggles, the APU commands, engine and
# APU bleed toggles, autobrake, speedbrake, the flight director bars, wipers,
# barometer and minimums (grepped `replace_command` across
# plugins/xlua/scripts, 2026-09-16). A replaced command still reaches the
# aircraft's own handler, so the stock commands below are declared and every
# one is a hypothesis until the swap-time probe and a live readback confirm
# it. Figures are from the aircraft: the specifications page of `X-Plane A330
# Pilot Operating Manual.pdf` in the aircraft folder and its `A330.acf` (Vs
# 175 / Vso 125 / Vfe 215 and 180 / Vle 250 / Vmo 330, MTOW 533,519 lb, empty
# 285,278 lb, five flap positions 0/8/14/22/32 deg = CONF 0/1/2/3/FULL).
#
# The engine start is `airliner_start` below, read out of the aircraft's own
# autostart script. The FBW protections are the aircraft's: the takeoff
# rotation through the pitch channel is a sidestick demand here, bounded by
# `tail_strike_deg`, and the flare through the VS dial is what the stock
# autopilot does with it.
#
# AUDITED AGAINST THE SCRIPTS (every per-frame write in plugins/xlua/scripts
# mapped, 2026-09-20): the aircraft REWRITES the stock seat-belt and
# no-smoking signs, transponder mode, every probe-heat switch, the nav and
# strobe light switches, battery/generator/bus-tie states, APU and engine
# bleeds, packs (on ditching), fuel pumps and electric hydraulic pumps every
# frame from its own laminar/A333 switch positions. A stock write to any of
# those is a silent no-op; the stock dataref is still an HONEST READ. Hence
# the laminar commands on the lights and signs below, the transponder knob,
# and the checklist's laminar positions. Stock writes that DO work: throttle,
# the AP dials (altitude, speed, VS; heading only in selected HDG), flaps,
# gear, speedbrake, parking brake ratio, autobrake level, barometer, COM
# frequencies, transponder code, landing lights [0] and [1], beacon.
# The parking brake is a VALVE on this airframe (its own auto-board sets
# `park_brake_valve` 1 = set), so `park_brake_valve_set` is declared.

id: airbus_a330_300
display_name: Airbus A330-300

# Which loaded aircraft this profile is for (detect::resolve): the ICAO
# alone is a TYPE, and two models of one type (the stock 737 and the Zibo
# both say B738) must never share a profile. Every key must hit. The acf
# entry is a substring of acf_relative_path: if the aircraft's folder is
# renamed, change it here (an unmatched model flies generic, said aloud).
match:
  icao: [A333, A332, A330]
  acf: ["Laminar Research/Airbus A330-300/"]

# Capability flags.
autopilot: true
throttle: true
# Stock autothrust exists on this model, but the `autothrottle` tool is written
# against laminar/md82 datarefs and declaring it withholds `hold_speed`.
autothrottle: false
speedbrake: true
reverse_thrust: true   # VERIFY
barometer: true
pitot_heat: true
pitch_trim: true
com_radio: true
com2_radio: true
nav_radio: true
transponder: true
ils: true
parking_brake: true
retractable_gear: true
cabin_crew: true       # up to 440 seats
# Full auto's arm-time load (#95): the stock tank and payload writes have
# never been written and read back on this airframe, so the arm names it
# and leaves the load to the pilot.
load_sheet: unprobed
pressurised: true
engines: 2

turbine_start: false   # the MD-82's bleed/crank sequence; not this aircraft's
auto_prep: false

# The ENGINE START, at last — every name and value read out of the aircraft's
# own `A333.Z.autostart.lua`, not guessed. ENG MODE to IGN/START, each master
# lifted past its guard and set, wait for the spool, knob back to NORM.
#
# Until 2026-09-20 this said "engine start is the pilot's" because neither
# existing block could express it: `turbine_start` is the MD-82's, hardcoded
# to laminar/md82/*, and `turboprop_start` is condition levers and starter
# commands. An Airbus has an ENG MODE knob and two guarded master switches.
#
# The guard is not decoration: the script lifts it, sets the switch, and drops
# it a quarter second later. A bare write with the guard down is exactly the
# silent no-op a study-level add-on is full of. VERIFY on the ramp.
airliner_start:
  mode_selector: sim/cockpit2/engine/actuators/eng_mode_selector
  mode_start: 1.0        # IGN/START (the script's own value)
  mode_norm: 0.0         # NORM
  masters: sim/cockpit2/engine/actuators/eng_master
  master_guards:
    - laminar/A333/switches/engine1_start_lift
    - laminar/A333/switches/engine2_start_lift
  # Number two first: the POM's own order (p.66), the way Airbus crews do it.
  start_order: [1, 0]
  # The APU, in the order and with the controls the aircraft's own script
  # uses. COMMANDS, not datarefs: `laminar/A333/buttons/APU_start` exists as
  # both, and the dataref is the button's POSITION, which the aircraft
  # rewrites every frame. Declared as a dataref first, the APU never moved
  # and the start timed out saying it had no bleed air (2026-09-20).
  #
  # Every latching step reads its position first — these are toggles, and one
  # fired at a switch already on turns it off.
  apu_steps:
    - { command: sim/electrical/battery_1_toggle,       position: "sim/cockpit2/electrical/battery_on[0]", want: 1.0 }
    - { command: sim/electrical/battery_2_toggle,       position: "sim/cockpit2/electrical/battery_on[1]", want: 1.0 }
    - { command: laminar/A333/buttons/APU_batt_toggle,  position: laminar/A333/buttons/APU_batt_pos, want: 1.0 }
    - { command: laminar/A333/buttons/APU_master,       position: laminar/A333/buttons/apu_master_ctct_on_off, want: 1.0 }
    # Momentary press-and-hold, and the only step with no position to read.
    - { command: laminar/A333/buttons/APU_start,        held_secs: 1.0 }
    # POM step 7: the APU generator carries the buses until the engines do.
    - { command: laminar/A333/buttons/APU_gen_toggle,   position: laminar/A333/buttons/gen_apu_pos, want: 1.0 }
  apu_n1: sim/cockpit2/electrical/APU_N1_percent
  # Trent 700s are three-spool, but the sim's gauge the script watches is N2.
  # AUTO-START steps 1-14, in the aircraft's own order. The EIGHT FUEL PUMPS
  # are the reason this list exists: the first version of this block went
  # straight from the APU to the master switches, which is a start with no
  # fuel at the engine. The aircraft spends a third of its sequence on them.
  pre_start_steps:
    # THE ADIRS FIRST — AUTO-BOARD steps 27-32 and 19-21, which the first
    # version of this block skipped entirely. Without them the aircraft has no
    # attitude, heading or air data: SPD, ATT, ALT, V/S, HDG and MACH all flag
    # red on the PFD and the ND says MAP NOT AVAIL and GPS PRIMARY LOST. The
    # engines ran perfectly and there was nothing to fly them on (2026-09-20).
    #
    # Alignment then runs in the background while the engines start, which is
    # what a crew does; the flags clear when it finishes.
    - { command: laminar/A333/buttons/adirs/ir1_toggle,  position: laminar/A333/buttons/adirs/ir1_pos, want: 1.0 }   # step 27
    - { command: laminar/A333/buttons/adirs/ir2_toggle,  position: laminar/A333/buttons/adirs/ir2_pos, want: 1.0 }   # step 28
    - { command: laminar/A333/buttons/adirs/ir3_toggle,  position: laminar/A333/buttons/adirs/ir3_pos, want: 1.0 }   # step 29
    - { command: laminar/A333/buttons/adirs/adr1_toggle, position: laminar/A333/buttons/adirs/adr1_pos, want: 1.0 }  # step 30
    - { command: laminar/A333/buttons/adirs/adr2_toggle, position: laminar/A333/buttons/adirs/adr2_pos, want: 1.0 }  # step 31
    - { command: laminar/A333/buttons/adirs/adr3_toggle, position: laminar/A333/buttons/adirs/adr3_pos, want: 1.0 }  # step 32
    # The selectors are OFF / NAV / ATT; NAV is 1, and the direction depends
    # on where the knob is — hence `down_command`.
    - { command: laminar/A333/knobs/adirs/ir1_knob_right, down_command: laminar/A333/knobs/adirs/ir1_knob_left, position: laminar/A333/buttons/adirs/ir1_knob_pos, want: 1.0 }  # step 19
    - { command: laminar/A333/knobs/adirs/ir2_knob_right, down_command: laminar/A333/knobs/adirs/ir2_knob_left, position: laminar/A333/buttons/adirs/ir2_knob_pos, want: 1.0 }  # step 20
    - { command: laminar/A333/knobs/adirs/ir3_knob_right, down_command: laminar/A333/knobs/adirs/ir3_knob_left, position: laminar/A333/buttons/adirs/ir3_knob_pos, want: 1.0,
        say: "A.D.I.R.S. on and aligning." }  # step 21
    - { command: sim/lights/beacon_lights_on,  position: sim/cockpit2/switches/beacon_on, want: 1.0 }        # step 1
    - { command: sim/bleed_air/apu_toggle,     position: laminar/A333/switch_memory/apu_bleed_on_off, want: 1.0,
        say: "Beacon and A.P.U. bleed on." }  # step 2
    - { command: laminar/A333/switches/left1_pump_toggle,         position: laminar/A333/fuel/buttons/left1_pump_pos,       want: 1.0 }  # step 7
    - { command: laminar/A333/switches/left2_pump_toggle,         position: laminar/A333/fuel/buttons/left2_pump_pos,       want: 1.0 }  # step 8
    - { command: laminar/A333/switches/left_stby_pump_toggle,     position: laminar/A333/fuel/buttons/left_stby_pump_pos,   want: 1.0 }  # step 9
    - { command: laminar/A333/switches/right1_pump_toggle,        position: laminar/A333/fuel/buttons/right1_pump_pos,      want: 1.0 }  # step 10
    - { command: laminar/A333/switches/right2_pump_toggle,        position: laminar/A333/fuel/buttons/right2_pump_pos,      want: 1.0 }  # step 11
    - { command: laminar/A333/switches/right_stby_pump_toggle,    position: laminar/A333/fuel/buttons/right_stby_pump_pos,  want: 1.0 }  # step 12
    - { command: laminar/A333/switches/center_left_pump_toggle,   position: laminar/A333/fuel/buttons/center_left_pump_pos, want: 1.0 }  # step 13
    - { command: laminar/A333/switches/center_right_pump_toggle,  position: laminar/A333/fuel/buttons/center_right_pump_pos, want: 1.0,
        say: "Fuel pumps on, eight of eight." } # step 14

  # The after-start flow, the POM's order (p.68-69): engine generators on
  # and the APU generator off, APU bleed off, ENGINE BLEEDS ON, packs on, APU
  # master off. The first version of this list did the packs and shut the
  # APU down and never opened the engine bleeds or touched a generator
  # (profile review, 2026-09-20): the packs had no air. Generator 1's stock
  # on/off is replaced by the aircraft (reaches gen1_pos); generator 2 only
  # has its toggle replaced, so it is read first. Engine bleed toggles are
  # replaced too; every position is the aircraft's own pushbutton.
  post_start_steps:
    - { command: sim/electrical/generator_1_on,        position: laminar/A333/buttons/gen1_pos,    want: 1.0 }
    - { command: sim/electrical/generator_2_toggle,    position: laminar/A333/buttons/gen2_pos,    want: 1.0,
        say: "Generators on." }
    - { command: laminar/A333/buttons/APU_gen_toggle,  position: laminar/A333/buttons/gen_apu_pos, want: 0.0 }
    - { command: sim/bleed_air/apu_toggle,             position: laminar/A333/switch_memory/apu_bleed_on_off, want: 0.0 }  # step 22
    - { command: sim/bleed_air/engine_1_toggle,        position: laminar/A333/buttons/eng_bleed_1_pos, want: 1.0 }
    - { command: sim/bleed_air/engine_2_toggle,        position: laminar/A333/buttons/eng_bleed_2_pos, want: 1.0 }
    - { command: sim/bleed_air/pack_left_toggle,       position: laminar/A333/buttons/pack_1_pos, want: 1.0 }   # step 20
    - { command: sim/bleed_air/pack_right_toggle,      position: laminar/A333/buttons/pack_2_pos, want: 1.0,
        say: "Engine bleeds and packs on." }   # step 21
    - { command: laminar/A333/buttons/APU_master,      position: laminar/A333/buttons/apu_master_ctct_on_off,  want: 0.0,
        say: "A.P.U. off." }  # step 23
  spool: sim/cockpit2/engine/indicators/N2_percent
  spool_idle: 50.0

# Jet — none of the piston systems apply.
engine: false
magnetos: false
carb_heat: false
fuel_pump: false
directional_gyro: false

# Electrical. Battery on/off are NOT replaced (only the toggles are);
# generator_1_on/off ARE, by the aircraft's handler. Two batteries. VERIFY.
electrical:
  # TOGGLES, not on/off. The aircraft replaces `battery_1_toggle` and
  # `battery_2_toggle` and leaves `_on`/`_off` stock, so firing the latter
  # reached nothing — this profile's own header warned about it and the
  # block did it anyway (found by the write audit, 2026-09-20). `toggles`
  # reads each switch first and fires only when it disagrees, which is the
  # only safe way to drive a toggle to a known state.
  - key: battery
    spoken: batteries
    on_commands:  []
    off_commands: []
    toggles:
      - { command: sim/electrical/battery_1_toggle, dataref: "sim/cockpit2/electrical/battery_on[0]" }
      - { command: sim/electrical/battery_2_toggle, dataref: "sim/cockpit2/electrical/battery_on[1]" }
    readback:     ["sim/cockpit2/electrical/battery_on[0]", "sim/cockpit2/electrical/battery_on[1]"]
  # Generator 1 has its on/off replaced; generator 2 does NOT — only its
  # toggle. "Generators on" brought up one of two and said both.
  - key: generators
    spoken: generators
    on_commands:  [sim/electrical/generator_1_on]
    off_commands: [sim/electrical/generator_1_off]
    toggles:
      - { command: sim/electrical/generator_2_toggle, dataref: "sim/cockpit/electrical/generator_on[1]" }
    readback:     ["sim/cockpit/electrical/generator_on[0]", "sim/cockpit/electrical/generator_on[1]"]
  - key: avionics
    spoken: avionics
    on_commands:  [sim/systems/avionics_on]
    off_commands: [sim/systems/avionics_off]
    readback:     [sim/cockpit/electrical/avionics_on]

# Exterior lights. The nav and strobe switches are the aircraft's own
# (A333.lighting.lua rewrites the stock `navigation_lights_on` and
# `strobe_lights_on` every frame from `laminar/a333/switches/nav_pos` and
# `strobe_pos`), so the stock commands went nowhere and the readback read
# what the aircraft was doing anyway. The laminar commands step those
# switches: nav 0 OFF / 1 ON / 2 ON+LOGO, strobe 0 OFF / 1 AUTO / 2 ON. The
# nose light is a three-position switch on `landing_lights_switch[1]` (OFF 0
# / TAXI 0.5 / T.O. 1.0): "taxi light" is the TAXI detent; the T.O. position
# is the checklist's before takeoff. Beacon and landing lights are stock.
lights:
  - { key: nav,     spoken: navigation lights, dataref: sim/cockpit2/switches/navigation_lights_on,  command_on: laminar/A333/toggle_switch/nav_light_pos_up, command_off: laminar/A333/toggle_switch/nav_light_pos_dn }
  - { key: beacon,  spoken: beacon,            dataref: sim/cockpit2/switches/beacon_on,             command_on: sim/lights/beacon_lights_on,  command_off: sim/lights/beacon_lights_off }
  - { key: strobe,  spoken: strobe lights,     dataref: sim/cockpit2/switches/strobe_lights_on,      command_on: laminar/A333/toggle_switch/strobe_pos_on, command_off: laminar/A333/toggle_switch/strobe_pos_off }
  - { key: landing, spoken: landing lights,    dataref: "sim/cockpit2/switches/landing_lights_switch[0]", command_on: sim/lights/landing_lights_on, command_off: sim/lights/landing_lights_off }  # VERIFY the stock command reaches [0]
  - { key: taxi,    spoken: taxi light,        dataref: "sim/cockpit2/switches/landing_lights_switch[1]", command_on: laminar/A333/switch/lighting/taxi_light_taxi, command_off: laminar/A333/switch/lighting/taxi_light_off }

# Vmo 330 KIAS (Mmo 0.89 per the POM); the acf's Vne. The flight governor's
# ceiling is derived from it (under the 0.9 Vne overspeed caution, 287), so
# a cruise target of 285 is no longer clamped to a GA 250.
vne_kts: 330.0

# The parking brake is a VALVE here: the aircraft's own auto-board writes
# `park_brake_valve = 1` for SET and its ECAM reads the brake from the valve
# (A333.Z.autostart.lua:501, ecam_fws200.lua:301). Any brake application with
# the valve set latches, so the crew goes through the valve-aware seam. VERIFY.
park_brake_valve_set: 1.0

# The transponder MODE is the aircraft's own knob (`A333.transponder.lua`
# rewrites the stock `transponder_mode` every frame from it): -1 STBY, 0 AUTO
# (mode S on the ground, mode C airborne — the Airbus SOP position), 1 ON.
# There is no OFF; standby is the nearest thing. "Altitude" is AUTO, so the
# crew's SOP knob position and the checklist's agree. The knob dataref is
# READ-ONLY (probed live 2026-09-21: is_writable false; the flight before
# went out in standby), so the knob is stepped by the aircraft's own
# commands (A333.transponder.lua: right = -1 -> 0 -> 1, left the reverse).
transponder_mode_knob:
  dataref: laminar/A333/transponder/auto_on_knob_pos
  off: -1
  standby: -1
  on: 1
  altitude: 0
  up_command: laminar/A333/transponder/auto_on_off_right
  down_command: laminar/A333/transponder/auto_on_off_left
  # AUTO is not enough. The script computes the stock mode from THREE knobs,
  # and with TCAS left in STBY (where the aircraft loads) AUTO is stock mode 1:
  # standby. Read live 2026-09-21, airborne in Glasgow's zone: knob 0, TA/RA
  # knob 0, stock mode 1, and the takeoff had logged the mode as set. TA/RA
  # (2) and altitude reporting (1) are turned too, and the stock mode is what
  # confirms (7 airborne, 5 or 6 on the ground). Both read-only, both stepped.
  also:
    - { dataref: laminar/A333/transponder/alt_rpt_knob_pos, want: 1,
        up_command: laminar/A333/transponder/alt_rpt_on, down_command: laminar/A333/transponder/alt_rpt_off }
    - { dataref: laminar/A333/transponder/ta_ra_knob_pos, want: 2,
        up_command: laminar/A333/transponder/ta_ra_right, down_command: laminar/A333/transponder/ta_ra_left }
# What the crew sets after start and confirms before the brakes come off,
# beyond flaps, trim and the altitude selector (src/takeoff_config.rs), and at
# the gear on the way in. All three are stock writes that work here (header).
# The checklist has always asked for them and nothing ever set them: the
# Monitor list named "speed brake, armed" and "autobrake" on every flight.
# MED is stock level 4 on this aircraft (its annunciator script: LO 3, MED 4).
# The seat belt switch is the aircraft's own, OFF 0 / AUTO 1 / ON 2
# (A333.switches.lua; the stock dataref is rewritten from it every frame).
# The crew has it ON from before start to ten thousand, AUTO in cruise (the
# signs return with the flaps or gear by themselves), ON again below ten.
seat_belt_signs:
  position: laminar/A333/switches/fasten_seatbelts
  on: 2
  off: 1
  up_command: laminar/A333/switches/seatbelt_signs_up
  down_command: laminar/A333/switches/seatbelt_signs_dn
# The circuit puts its pattern altitude on the FCU and the autopilot's own
# capture holds the level legs (the VS law wandered 1,796 to 1,840 ft down the
# EGPF downwind, 2026-09-21, behind a dial at 100). Stock dial and VS writes
# work on this aircraft (header). VERIFY in the air: that the stock VS command
# leaves ALT for the base leg's descent (blackbox `circuit` `leg`: `ap_level`
# true on the downwind, false with `vs_on` true on base).
ap_altitude_capture: true
takeoff_config:
  arm_spoilers: true
  autobrake_rto: true
  landing_autobrake_level: 4
  # Flight directors on and V2 on the FCU speed before the roll (stock
  # flight_director_mode / airspeed_dial_kts_mach, both read, never written,
  # by the A333 scripts; issue #91). V2 is the card's (V1 143 / VR 148 /
  # V2 153). VERIFY: blackbox `autotakeoff` `takeoff_config` names
  # "flight directors on" and "V2 153 set", or "Check ..." if they did not
  # take. NOT declared here: the autothrust arm (A333.autopilot.lua sets
  # autothrottle_enabled from the lever detents' FADEC mode every frame, so a
  # write is its output) and the thrust reduction (the lever positions of
  # its CL and FLX detents are the script's, unprobed).
  flight_directors: true
  v2_kts: 153.0
# Clean stall from the acf at a mid weight. 1.2 x this (210) is the floor any
# handed-down target is raised to; the derived approach speed is max(1.3 Vso,
# 1.2 Vs) so a clean floor never lands the aircraft fast on its own.
vs_clean_kts: 175.0
# Gear operating limit (VLO 250 extend; the acf's Vle 250).
vlo_kts: 250.0

# Tail clearance at rotation is about 12.5 degrees on the -300; the rotation
# is bounded 2 degrees below. VERIFY.
tail_strike_deg: 12.5
# The highest attitude the hand-flown initial climb may hold once the tail
# clears (autotakeoff::tail_clear_ceiling_deg), holding V2 + 15 by pitch to the 300 ft engage
# (autotakeoff::ClimbHold, issue #78). About 15 degrees is the all-engine
# SRS attitude at a mid weight; 17.5 leaves the light end room. VERIFY:
# blackbox `autotakeoff` `climb_manual` `ias` 150-173 and `theta` under this.
climb_pitch_max_deg: 17.5

# The approach is flown on thrust, the 737's floor as the starting
# hypothesis for a bigger turbofan (a book "approach idle"). VERIFY on the
# first landing, from the `power` ticks.
approach_thrust_min: 0.3
# The circuit's final leads its offset by this many seconds of the ground
# track (#189): the heading mode rolls at about 3 deg/s through a 2 s lag and
# flies the bug two ticks late (fitted to the LEMG 30 circuits of 2026-09-29,
# sorties 1790710769 and 1790698132), and on the bare pursuit ran 66 to 67 m
# through the centreline both times. VERIFY: `circuit` `handoff_autoland`
# `xtk_m` on the base's side of the line, Final `x_m` never past it by 10 m.
circuit_final_lead_s: 3.5
# The speed governor on these engines (#169): about 2.5 kt/s per unit of
# lever through a 4.6 s spool (fitted to the circuit's clean legs, sortie
# 1790633832-full_auto). The shared 5 s projection and 0.04 a tick ran the
# clean circuit 227.5 to 265 kt at the level-off.
speed_governor:
  lead_s: 8.0
  gain: 0.006
  max_step: 0.08
# --- Jet/turboprop figures, added 2026-09-20 after the 737 shakedown. Every
# law below defaults to a Cessna 172's number when a profile is silent, and on
# BIKF-EGPH that flew an airliner on a 0.8 nm capture radius, a 700 fpm
# descent, a 0.10 nose-down limit and avgas density. VERIFY each against the
# POM/FCOM; they are reasoned from the type, not measured on it.
# Nose-DOWN elevator the rotation law may command. The shared default is
# 0.10, which on a jet is not authority at all: the 737 was commanded 8
# degrees and flew 22.4 with the law pinned at its limit. VERIFY.
pitch_authority_down: 0.5

# Taxi pacing as the MD-82's: at idle a widebody rolls past 10 knots on its own.
taxi:
  kts: 18.0
  turn_kts: 10.0
  sharp_kts: 6.0

# Fuel-endurance alerting. The SIM's tanks, not the real aircraft's: the acf
# carries 240,712 lb (109,190 kg, the POM's 109,000) where the real -300
# holds 97,530 L. The burn is the POM's "average 15,800 lb/h" for the pair
# (7,170 kg/h); this said 5,500 until the profile review (2026-09-20), which
# briefed every endurance 30% long.
fuel:
  reserve_caution_min: 60.0
  reserve_warning_min: 30.0
  cruise_burn_kg_hr: 7170.0
  # Jet A-1, not the 100LL the shared default assumes: that briefed the
  # 737's fuel 11.8% light and in a unit no crew uses (2026-09-20).
  kg_per_gal: 3.04
  spoken_unit: kg

transition_altitude_ft: 18000.0

# Static reference figures. One mid-weight card (about 400,000 lb, CONF 2) for
# the reasons the 737's gives. POM: approach 140-160 full flap, takeoff
# 8,200 ft, landing 4,750 ft, ceiling 41,000, cruise M0.86.
reference:
  kind: twin-engine jet
  # Widebody. Optimum anchored at 200 t; the -300 sits near FL330 at max takeoff
# weight and near FL390 light, which is the ~85 ft per tonne below.
  # Enroute vertical rates: the shared 700 fpm is a GA number and a ~1 degree
  # path at these speeds. VERIFY.
  enroute_climb_fpm: 2000.0
  enroute_descent_fpm: 2000.0
  optimum_alt_ft: 37000.0
  optimum_alt_at_kg: 200000.0
  optimum_alt_ft_per_1000kg: 85.0
  vr_kts: 148.0                # ~400,000 lb CONF 2 (V1 143 / V2 153). VERIFY
  vy_kts: 220.0                # climb-out + pattern speed the laws hold
  # The INITIAL climb, liftoff to the takeoff's handoff — V2 + 20 on this
  # weight card. Kept apart from `vy_kts` for the reason the 737 found out:
  # the takeoff's climb law protects the speed it is handed, and the enroute
  # figure reads a perfectly good climb-out as thirty knots slow and takes
  # the whole rate away (LFLL, 2026-09-17).
  initial_climb_kts: 173.0     # V2 153 + 20. VERIFY
  # Where the climb-out stops holding that speed and starts accelerating and
  # cleaning up. Below it the takeoff climbs as hard as `best_climb_fpm` to
  # keep the speed, and the flaps stay put (EGPH 2026-09-21: 1,500 fpm at
  # takeoff thrust was 240 kt through 1,000 ft, the flaps up by 740). VERIFY
  # in the air: blackbox `autotakeoff` `climb`, `ias` near the hold to 1,000 ft.
  acceleration_height_agl_ft: 1000.0
  best_climb_fpm: 2500.0       # initial climb, light; the climb law takes 80%
  cruise_ias_kts: 285.0        # KIAS the cruise governor holds (~M0.82 up high), under the ceiling (287)
  # POM 140-160 CONF FULL; the MCDU's own example is VLS 149 / VAPP 154.
  # 145 sat under the 1.2 x Vso floor (150) and was raised, aloud, on every
  # arm, and 150 is exactly the monitor's caution line; 154 is the box's own
  # VAPP, inside the book and above both.
  approach_kts: 154.0
  vs0_kts: 125.0               # acf: stall, landing configuration
  cruise_kts: 470.0            # M0.86 at altitude, KTAS
  max_gross_lb: 533519.0       # acf MTOW
  empty_weight_lb: 285278.0    # acf empty
  useful_load_lb: 248241.0     # MTOW - empty
  service_ceiling_ft: 41000.0  # POM
  max_crosswind_kts: 32.0      # demonstrated, dry. VERIFY
  fuel_capacity_gal: 35900.0   # acf 240,712 lb at 6.7 lb/gal Jet A-1
  endurance_hours: 15.0        # 240,712 lb / 15,800 lb per hour, no reserve
  takeoff_distance_ft: 8200.0  # RECITED: POM field length at MTOW
  # GROUND ROLL at the card's mid weight, roughly 6,000 ft; the recited 8,200
  # is the factored MTOW field length.
  takeoff_roll_ft: 6000.0
  landing_distance_ft: 4750.0  # POM

# Five positions in the aircraft file, 0/8/14/22/32 degrees flap, which the
# POM labels CONF 0 / 1 / 2 / 3 / FULL (slats 16/20/23/23). Limits are the
# A330 placard (CONF 1+F 215, 2 196, 3 186, FULL 180); the acf agrees at both
# ends. Takeoff is CONF 2, the POM's own hint. VERIFY the middle in the sim.
flaps:
  takeoff_ratio: 0.5
  detents:
    # 210, not the 230 this carried: CONF 1's placard is 215, so a clean-up
    # gated at 230 could never happen legally and never did (EGPH 2026-09-20,
    # flap 1 carried to 330 kt). 210 is the clean floor (1.2 x 175).
    - { label: "0",    spoken: up,    ratio: 0.0, retract_above_kts: 210.0 }
    # 180 (about F speed at mid weights), under CONF 2's 196 placard; the 200
    # this carried stepped the flaps four knots over it. VERIFY
    # vs_kts: the stall IN each configuration, at the weight of Vs 175 / Vso
    # 125. The slats take most of the reduction at the first notch, so the
    # straight line between the two (162 / 150 / 138) put a normal 175 kt
    # CONF 2 base inside the "getting slow" band (EGPF 2026-09-21). From the
    # acf's own schedule (aircraft::detent_stall_from_acf: slats 70/87/100 %
    # of 8 degrees, flap 8/14/22 of 32 degrees at CL 1.1, ends at 175 and
    # 125): 147 / 139 / 131. VERIFY against the PFD's VLS band.
    - { label: "1",    spoken: one,   ratio: 0.25, vfe_kts: 215.0, retract_above_kts: 180.0, vs_kts: 147.0 } # acf Vfe1
    - { label: "2",    spoken: two,   ratio: 0.5,  vfe_kts: 196.0, vs_kts: 139.0 } # VERIFY
    - { label: "3",    spoken: three, ratio: 0.75, vfe_kts: 186.0, vs_kts: 131.0 } # VERIFY
    - { label: full,   spoken: full,  ratio: 1.0,  vfe_kts: 180.0 } # acf Vfe

# The normal checklist (checklists/airbus_a330_300.txt, 2026-09-20, from the
# POM's own lists and the aircraft's switch positions). Section titles are the
# phase keys, so the tracker's climb / cruise / descent / before landing /
# after landing lists resolve without an override; until this file existed
# the tracker logged `no_section` at every phase (EGPH, 2026-09-20).
checklist: checklists/airbus_a330_300.txt
checklist_map:
  - { match: parking_brake_ratio,        action: parking_brake }
  - { match: flap_ratio,                 action: flaps }
  - { match: throttle_ratio,             action: throttle }
  - { match: "landing_lights_switch[1]", action: !light taxi }
  - { match: "landing_lights_switch[0]", action: !light landing }
  - { match: strobe_pos,                 action: !light strobe }
  - { match: beacon_on,                  action: !light beacon }
  - { match: navigation_lights,          action: !light nav }
  - { match: buttons/gen1_pos,           action: !electrical generators }
  - { match: buttons/battery1_pos,       action: !electrical battery }

advisor:
  # THE ADIRS, watched and FIXED. The start sequence sets them from cold, but
  # an aircraft can be loaded with them off, or a start can miss them — and
  # when it does the engines run beautifully with no attitude, heading or air
  # data behind them: SPD, ATT, ALT, V/S, HDG and MACH all flag red and the ND
  # reads MAP NOT AVAIL (2026-09-20). Nothing was watching for it.
  #
  # `command` makes these ACTIONED rather than asked about, like the light
  # rows: there is no judgement in "the IR should be on".
  - dataref: laminar/A333/buttons/adirs/ir1_pos
    phases: [ground, takeoff, climb, cruise, approach, landing]
    say: Inertial reference one is off. Switching it on.
    command: laminar/A333/buttons/adirs/ir1_toggle
  - dataref: laminar/A333/buttons/adirs/ir2_pos
    phases: [ground, takeoff, climb, cruise, approach, landing]
    say: Inertial reference two is off. Switching it on.
    command: laminar/A333/buttons/adirs/ir2_toggle
  - dataref: laminar/A333/buttons/adirs/ir3_pos
    phases: [ground, takeoff, climb, cruise, approach, landing]
    say: Inertial reference three is off. Switching it on.
    command: laminar/A333/buttons/adirs/ir3_toggle
  - dataref: laminar/A333/buttons/adirs/adr1_pos
    phases: [ground, takeoff, climb, cruise, approach, landing]
    say: Air data reference one is off. Switching it on.
    command: laminar/A333/buttons/adirs/adr1_toggle
  - dataref: laminar/A333/buttons/adirs/adr2_pos
    phases: [ground, takeoff, climb, cruise, approach, landing]
    say: Air data reference two is off. Switching it on.
    command: laminar/A333/buttons/adirs/adr2_toggle
  - dataref: laminar/A333/buttons/adirs/adr3_pos
    phases: [ground, takeoff, climb, cruise, approach, landing]
    say: Air data reference three is off. Switching it on.
    command: laminar/A333/buttons/adirs/adr3_toggle
  # The selectors. `expect_on` only distinguishes OFF from not-OFF, which is
  # the failure that matters: a knob in ATT still feeds attitude, a knob at
  # OFF feeds nothing. One press right takes OFF to NAV.
  - dataref: laminar/A333/buttons/adirs/ir1_knob_pos
    phases: [ground, takeoff, climb, cruise, approach, landing]
    say: A.D.I.R.S. one is off. Selecting nav.
    command: laminar/A333/knobs/adirs/ir1_knob_right
  - dataref: laminar/A333/buttons/adirs/ir2_knob_pos
    phases: [ground, takeoff, climb, cruise, approach, landing]
    say: A.D.I.R.S. two is off. Selecting nav.
    command: laminar/A333/knobs/adirs/ir2_knob_right
  - dataref: laminar/A333/buttons/adirs/ir3_knob_pos
    phases: [ground, takeoff, climb, cruise, approach, landing]
    say: A.D.I.R.S. three is off. Selecting nav.
    command: laminar/A333/knobs/adirs/ir3_knob_right
  - dataref: sim/cockpit2/ice/ice_pitot_heat_on_pilot
    phases: [takeoff, climb, cruise, approach, landing]
    say: Pitot heat's off.
  - dataref: sim/cockpit/electrical/landing_lights_on
    phases: [takeoff, approach, landing]
    say: Landing lights on.
    command: sim/lights/landing_lights_on
  # The sign switch is OFF / AUTO / ON on the aircraft's own dataref; the
  # stock one is derived every frame, so it is the honest read and the
  # laminar command is the hand. One press up: OFF to AUTO (belts on with
  # flaps out or gear down), a second AUTO to ON.
  # The CREW works the switch now (`seat_belt_signs` above: on before start,
  # AUTO through ten thousand, on again below). This row is the pilot-flying
  # net for the takeoff and the landing only: in the climb AUTO legitimately
  # reads dark, and pressing "up" at it there fought the crew's own AUTO.
  - dataref: sim/cockpit2/switches/fasten_seat_belts
    phases: [takeoff, approach, landing]
    say: Seat belt signs are off. Switching them on.
    command: laminar/A333/switches/seatbelt_signs_up
