# Aircraft profile — X-Plane stock McDonnell Douglas MD-82.
#
# A twin turbofan airliner — a deliberate contrast to the GA singles. What's
# different here: it's a JET (no mixture/magnetos/carb heat/fuel selector — it
# declares `throttle` for thrust levers instead of the piston `engine` group), it
# has RETRACTABLE GEAR (the first profile to expose the `gear` tool), and it uses
# Vmo (max operating speed) rather than a fixed Vne. Figures are from the X-Plane
# MD-82 Pilot Operating Manual; flap detents/limits are marked VERIFY (X-Plane's
# flap_ratio mapping for the handle notches needs confirming in the sim).

id: md82
display_name: McDonnell Douglas MD-82

# Capability flags.
autopilot: true        # set_heading / set_altitude / set_vertical_speed
throttle: true         # set_throttle (thrust levers) — jet, so NO piston engine group
turbine_start: true    # start_engines (bleed/fuel/ignition/crank sequence)
auto_prep: true        # power_up — "all electrical on" run as individual steps
autothrottle: true     # set_speed (AP speed bug) + autothrottle on/off
speedbrake: true       # speedbrake extend/retract/arm
barometer: true        # set_barometer
pitot_heat: true       # set_pitot_heat
# The MD-82's ice script drives ALL pitot/stall heat from the overhead heat
# selector knob and overwrites the stock datarefs every frame, so the stock
# pitot-heat command is a no-op here. 0 = off, any of 1-9 = heaters on (verified
# live: knob 1 lit the pitot annunciators and cleared the master caution driver).
pitot_heat_dataref: laminar/md82/ice/heatknob
pitch_trim: true       # set_pitch_trim (the checklist sets elevator_trim)
com_radio: true        # set_com1
com2_radio: true       # set_com2 / swap_radio
nav_radio: true        # set_nav1 / set_obs
transponder: true      # set_transponder (squawk)
ils: true              # prepare_ils
parking_brake: true    # set_parking_brake
retractable_gear: true # gear up/down (with on-ground safety gate)
cabin_crew: true       # interphone persona ("cabin crew, prepare for landing")

# Jet — none of the piston systems apply.
engine: false
magnetos: false
carb_heat: false
fuel_pump: false
directional_gyro: false # IRS-aligned, no vacuum DG to sync

# The CENTRE tank's pumps come off when it is empty (tools/fuel_pumps.rs).
# The stock `fuel_tank_pump_on` is the switch itself: the overhead's pump
# switches animate straight from elements 0..2 (cockpit_overhead.obj), and the
# xlua writes it only at flight start (md80__init) and at the boarding step
# that switches all three on (md80_auto_board_start), as does our power_up.
# Tank 0 is the centre on this airframe (acf `_tank_name/0 Center`,
# `_tank_xyz/0,0` 0; the wings 25.4 ft either side). Read from the files
# 2026-09-27, not yet probed live.
fuel_tank_pumps_off_when_empty: [0]

# Electrical: battery, two engine generators, avionics, and an "all"/master that
# brings the lot up ("all electrical systems on"). Actions fire the standard
# X-Plane electrical commands (Laminar's own aircraft respond to them); readback
# datarefs are the ones the MD-82 checklist reads. The APU and bus cross-ties use
# custom laminar/md82 datarefs and stay pilot items for now. VERIFY in the sim.
electrical:
  - key: battery
    spoken: battery
    on_commands:  [sim/electrical/battery_1_on]
    off_commands: [sim/electrical/battery_1_off]
    readback:     [sim/cockpit/electrical/battery_on]
  - key: generators
    spoken: generators
    on_commands:  [sim/electrical/generator_1_on, sim/electrical/generator_2_on]
    off_commands: [sim/electrical/generator_1_off, sim/electrical/generator_2_off]
    readback:     ["sim/cockpit/electrical/generator_on[0]", "sim/cockpit/electrical/generator_on[1]"]
  - key: avionics
    spoken: avionics
    on_commands:  [sim/systems/avionics_on]
    off_commands: [sim/systems/avionics_off]
    readback:     [sim/cockpit/electrical/avionics_on]
  # "All electrical systems on" is NOT an electrical-tool key -- it's the procedural
  # power_up tool (auto_prep), which runs battery -> APU -> bleed -> buses ->
  # generators as individual steps with a callout each, driving the real laminar
  # controls (semantics from the MD-82's xlua scripts).

# Exterior lights (standard X-Plane switch datarefs).
lights:
  - { key: nav,     spoken: navigation lights, dataref: sim/cockpit2/switches/navigation_lights_on, command_on: sim/lights/nav_lights_on,     command_off: sim/lights/nav_lights_off }
  - { key: beacon,  spoken: beacon,            dataref: sim/cockpit2/switches/beacon_on,            command_on: sim/lights/beacon_lights_on,  command_off: sim/lights/beacon_lights_off }
  - { key: strobe,  spoken: strobe lights,     dataref: sim/cockpit2/switches/strobe_lights_on,     command_on: sim/lights/strobe_lights_on,  command_off: sim/lights/strobe_lights_off }
  - { key: landing, spoken: landing lights,    dataref: sim/cockpit2/switches/landing_lights_on,    command_on: sim/lights/landing_lights_on, command_off: sim/lights/landing_lights_off }
  - { key: taxi,    spoken: taxi light,        dataref: sim/cockpit2/switches/taxi_light_on,        command_on: sim/lights/taxi_lights_on,    command_off: sim/lights/taxi_lights_off }

# Never-exceed for the monitor = Vmo (max operating speed), 340 KIAS (Mmo 0.84).
vne_kts: 340.0
# Landing-gear limit speed (VLO/VLE) ~270 KIAS — gear tool refuses cycling above it.
vlo_kts: 270.0
# No fixed clean-stall figure: a jet's stall speed varies strongly with weight and
# config, so the fixed-value airspeed caution is left off (vs_clean_kts unset).

# The attitude at which the tail touches. The DC-9-80 family is long and
# famously tail-strike prone, and the auto-takeoff rotation is bounded 2 degrees
# below this. Luton 2026-07-28: the rotation overshot its 8 degree target to
# 10.6 at 21 ft and struck the tail. VERIFY against the POM.
tail_strike_deg: 9.5
# --- Jet/turboprop figures, added 2026-09-20 after the 737 shakedown. Every
# law below defaults to a Cessna 172's number when a profile is silent, and on
# BIKF-EGPH that flew an airliner on a 0.8 nm capture radius, a 700 fpm
# descent, a 0.10 nose-down limit and avgas density. VERIFY each against the
# POM/FCOM; they are reasoned from the type, not measured on it.
# Nose-DOWN elevator the rotation law may command. The shared default is
# 0.10, which on a jet is not authority at all: the 737 was commanded 8
# degrees and flew 22.4 with the law pinned at its limit. VERIFY.
pitch_authority_down: 0.5

# Taxi pacing. The defaults (10/6/4) were tuned on a 172, where 10 knots is a
# THROTTLE setting; on this airframe it is a BRAKE setting, because an MD-82 at
# idle thrust rolls past 10 knots on flat pavement by itself, so the governor
# would ride the brakes the whole taxi. Airline practice is 15-20 knots down a
# long taxiway, slowing to about 10 through the turns.
taxi:
  kts: 18.0
  turn_kts: 10.0
  sharp_kts: 6.0

# Static reference figures from the X-Plane MD-82 POM.
#
# The V-speeds below are NOT reference trivia — the automation flies them. They
# were missing, and the fallbacks are stall-based: no vs_clean_kts means vs
# defaults to 60 kt, so vr came out at 60 x 1.15 = 69 and full auto would have
# called "rotate" at 69 knots in an MD-82 (2026-07-27). A single mid-weight
# figure is used, because the automation needs A number and a weight-computed
# card is future work; they read high at light weight, which is the safe side
# for a rotation speed.

# Fuel endurance alerting, added 2026-09-20: without a fuel block this
# airframe had no reserve callouts at all, and its fuel was spoken at
# AVGAS density in gallons.
fuel:
  reserve_caution_min: 60.0
  reserve_warning_min: 30.0
  # Two JT8D-217s, about 2,700 kg/hr in the cruise. VERIFY.
  cruise_burn_kg_hr: 2700.0
  # Jet A-1, not 100LL — the density that briefed the 737 11.8% light.
  kg_per_gal: 3.04
  spoken_unit: lb

reference:
  kind: twin-engine jet
  # Same size class as the 737, so the same shape of numbers.
  # Enroute vertical rates: the shared 700 fpm is a GA number and a ~1 degree
  # path at these speeds. VERIFY.
  enroute_climb_fpm: 2000.0
  enroute_descent_fpm: 2000.0
  optimum_alt_ft: 35000.0
  optimum_alt_at_kg: 55000.0
  optimum_alt_ft_per_1000kg: 290.0
  vr_kts: 140.0                # rotate, ~130,000 lb (V1 137 / V2 149). VERIFY
  vy_kts: 200.0                # climb-out + pattern speed the laws hold. VERIFY
  best_climb_fpm: 2500.0       # initial climb, light; the climb law takes 80%
  cruise_ias_kts: 250.0        # KIAS the cruise governor holds (~M0.76 up high)
  approach_kts: 140.0          # final approach, full flap / gear down (133-140)
  cruise_kts: 439.0            # long-range cruise (KTAS); max level 500
  max_gross_lb: 140000.0       # MTOW
  empty_weight_lb: 78500.0     # operating empty
  useful_load_lb: 61500.0      # MTOW - OEW
  service_ceiling_ft: 37000.0
  fuel_capacity_gal: 5840.0    # ~48,500 lb Jet A-1
  endurance_hours: 8.0         # ~48,500 lb / 6,000 lb per hour
  takeoff_distance_ft: 7450.0   # RECITED: factored field length at MTOW
  # GROUND ROLL, what the automation checks a runway against (it adds its own
  # x1.4). At the same mid-weight the V-speeds above assume, ~130,000 lb: the
  # field length is around 5,500 ft, of which the roll to lift-off is roughly
  # 4,400. The recited 7,450 above is a FACTORED FIELD LENGTH at max weight and
  # was being used as a roll — x1.4 demanded 3,179 m, more than the whole of
  # Luton's runway, so full auto backtracked for length it did not need and then
  # failed its own lined-up test twice (2026-07-28). VERIFY against the POM.
  takeoff_roll_ft: 4400.0
  landing_distance_ft: 4850.0

# Laminar's stock MD-82 XChecklist (by royaloak). The copilot reads each item,
# performs the ones below, and calls out the rest (most MD-82 items use custom
# laminar/md82/* datarefs or compound conditions, so they stay pilot call-outs).
checklist: checklists/md82.txt
checklist_map:
  - { match: parkbrake,                 action: parking_brake }
  - { match: transponder_mode,          action: transponder }
  - { match: pitot_heat,                action: pitot_heat }
  - { match: elevator_trim,             action: pitch_trim }
  - { match: taxi_light,                action: !light taxi }
  - { match: electrical/generator_on,   action: !electrical generators }
  - { match: electrical/battery_on,     action: !electrical battery }
  - { match: electrical/avionics_on,    action: !electrical avionics }

# Phase-expectation advisor: the SOP table. In the listed phases the switch
# should read as `expect_on`; otherwise the copilot advises once ("aren't you
# forgetting something?"). Born of an LEAL-LEMD flight flown gate to field with
# the yaw damper off and the pitot heat cold, master caution lit the whole way.
advisor:
  - dataref: sim/cockpit2/switches/yaw_damper_on
    phases: [climb, cruise, approach]
    say: Yaw damper's still off.
  - dataref: sim/cockpit2/ice/ice_pitot_heat_on_pilot
    phases: [takeoff, climb, cruise, approach, landing]
    say: Pitot heat's off.
  - dataref: sim/cockpit/electrical/landing_lights_on
    phases: [takeoff, approach, landing]
    say: Landing lights on.
    command: sim/lights/landing_lights_on
  - dataref: sim/cockpit2/switches/fasten_seat_belts
    phases: [takeoff, climb, approach, landing]
    say: Seat belt signs are off.

# Flap handle detents 0 / 11 / 15 / 28 / 40 degrees (slats extend automatically).
# Ratios and per-notch Vfe are best-effort from MD-80 placards — VERIFY in the sim.
flaps:
  # Flaps 11 is the normal takeoff setting: the auto takeoff sets it before the
  # roll and retracts it climbing out. Without this the jet departed clean.
  takeoff_ratio: 0.275
  detents:
    - { label: up,   spoken: up,             ratio: 0.0, retract_above_kts: 210.0 }
    - { label: "11", spoken: eleven,         ratio: 0.275, vfe_kts: 280.0, retract_above_kts: 190.0 } # VERIFY
    - { label: "15", spoken: fifteen,        ratio: 0.375, vfe_kts: 240.0 } # VERIFY
    - { label: "28", spoken: twenty eight,   ratio: 0.70,  vfe_kts: 220.0 } # VERIFY
    - { label: "40", spoken: forty,          ratio: 1.0,   vfe_kts: 200.0 } # VERIFY
