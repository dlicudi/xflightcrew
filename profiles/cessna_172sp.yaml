# Aircraft profile — X-Plane stock Cessna 172SP Skyhawk.
# Loaded by src/aircraft.rs at startup. Capability flags gate which tools are
# exposed; the tools own the standard X-Plane datarefs/commands. Flap detents,
# their Vfe limits, and the light set are per-airframe and live here.
#
# To add an aircraft: copy this file to profiles/<id>.yaml, adjust, and select
# it via XCOPILOT_AIRCRAFT=<id> (or add an acf_ICAO mapping in main.rs for
# auto-detect).

id: cessna_172sp
display_name: Cessna 172SP Skyhawk

# Capability flags — each gates a tool (or tool group).
autopilot: true        # set_heading / set_altitude / set_vertical_speed
engine: true           # set_throttle / set_mixture
barometer: true        # set_barometer
directional_gyro: true # align_gyro (sync DG to compass)
com_radio: true        # set_com1
transponder: true      # set_transponder (squawk)
ils: true              # prepare_ils (ILS approach lookup + setup)
parking_brake: true    # set_parking_brake
# Electrical systems for set_electrical. Each fires on/off commands (which
# animate the panel switch) and reads back to confirm. The 172 has a single
# battery, a single alternator, the two-bus avionics master, and a split BAT/ALT
# "master" rocker (battery+alternator together, NOT avionics).
electrical:
  - key: battery
    spoken: battery
    on_commands:  [sim/electrical/battery_1_on]
    off_commands: [sim/electrical/battery_1_off]
    readback:     [sim/cockpit/electrical/battery_on]
  - key: alternator
    spoken: alternator
    on_commands:  [sim/electrical/generator_1_on]
    off_commands: [sim/electrical/generator_1_off]
    readback:     ["sim/cockpit/electrical/generator_on[0]"]
  - key: avionics
    spoken: avionics master
    on_commands:  [sim/systems/avionics_on, sim/electrical/cross_tie_on]
    off_commands: [sim/systems/avionics_off, sim/electrical/cross_tie_off]
    readback:     [sim/cockpit/electrical/avionics_on, sim/cockpit2/electrical/cross_tie]
  - key: master
    spoken: master
    on_commands:  [sim/electrical/battery_1_on, sim/electrical/generator_1_on]
    off_commands: [sim/electrical/battery_1_off, sim/electrical/generator_1_off]
    readback:     [sim/cockpit/electrical/battery_on, "sim/cockpit/electrical/generator_on[0]"]
flood_lights: true     # set_flood_lights (pilot + copilot cockpit floods)
fuel_pump: true        # set_fuel_pump (electric/aux boost pump)
magnetos: true         # set_magnetos (off/left/right/both — run-up mag check)
carb_heat: true        # set_carb_heat (carb / alternate-air heat)
# set_fuel_selector — LEFT/BOTH/RIGHT (OFF is a separate shutoff valve, not a
# selector position). Commands animate the 3D knob; the logical position dataref
# confirms (1 left, 3 right, 4 both).
fuel_selector:
  readback: sim/cockpit2/fuel/fuel_tank_selector
  positions:
    - { key: left,  spoken: left,  command: sim/fuel/fuel_selector_lft, value: 1 }
    - { key: both,  spoken: both,  command: sim/fuel/fuel_selector_all, value: 4 }
    - { key: right, spoken: right, command: sim/fuel/fuel_selector_rgt, value: 3 }
pitot_heat: true       # set_pitot_heat (anti-ice for the ASI)
pitch_trim: true       # set_pitch_trim (nose up/down nudges, takeoff, neutral)
nav_radio: true        # set_nav1 / set_obs (NAV1 frequency + OBS course)
com2_radio: true       # set_com2 / swap_radio (COM2 + active/standby swap)
retractable_gear: false # no gear tool — the 172 has fixed gear

# Fuel-endurance alerting (minutes of fuel left at the current burn). The
# monitor cautions at the first figure and warns at the second. Standard VFR
# reserves: 30 min day / 45 min night.
fuel:
  reserve_caution_min: 45.0
  reserve_warning_min: 30.0
  cruise_burn_kg_hr: 24.0   # ~8.5 gal/hr — used to estimate endurance pre-takeoff

# Clean (flaps-up, power-off) stall speed, KIAS. Drives the monitor's airspeed
# callouts: a caution as you approach it, an urgent "lower the nose" below.
vs_clean_kts: 48.0

# Never-exceed speed (Vne), KIAS. Drives the monitor's overspeed callout: a
# caution as you approach redline, an urgent prompt at or above it.
vne_kts: 163.0

# Static reference figures recited on request ("what's best glide?", "Va?",
# "performance limits"). From the X-Plane C172 Pilot's Operating Manual. Vne and
# clean stall live above (the monitor uses them) and aren't repeated here.
# Note: the manual lists Va 99; the real-world 172S POH lists 105 at gross.
reference:
  kind: single-engine aircraft
  vno_kts: 129.0           # max structural cruise
  va_kts: 99.0             # maneuvering (manual value)
  vx_kts: 62.0             # best angle of climb
  vy_kts: 74.0             # best rate of climb
  vr_kts: 55.0             # rotate
  best_glide_kts: 68.0
  vs0_kts: 40.0            # stall, full flaps
  approach_kts: 65.0
  max_crosswind_kts: 15.0  # demonstrated
  cruise_kts: 124.0
  best_climb_fpm: 730.0
  max_gross_lb: 2558.0
  empty_weight_lb: 1640.0
  useful_load_lb: 918.0
  service_ceiling_ft: 14000.0
  fuel_capacity_gal: 56.0
  fuel_useable_gal: 53.0
  endurance_hours: 4.0
  takeoff_distance_ft: 1630.0
  landing_distance_ft: 1335.0
  max_rpm: 2700.0
  oil_temp_min_f: 100.0
  oil_temp_max_f: 245.0
  oil_press_min_psi: 50.0
  oil_press_max_psi: 90.0

# XChecklist file to interpret (read-only; the de-facto X-Plane community format,
# as used by the XChecklist plug-in). The copilot reads each item aloud, performs
# the ones it owns, verifies what it can read, and calls out the pilot's items.
checklist: checklists/cessna_172sp.txt

# Maps the checklist file's datarefs to curated actions. `match` is a substring of
# the file's dataref; the first matching entry wins, so order specific → general.
# The *value* (on/off, mode, percent, notch) is derived from the file's condition
# in code — this table only says which dataref drives which system.
checklist_map:
  - { match: parkbrake,                     action: parking_brake }
  - { match: autopilot/autopilot_on,        action: autopilot_off }
  - { match: electrical/battery_on,         action: !electrical battery }
  - { match: electrical/avionics_on,        action: !electrical avionics }
  - { match: electrical/generator_on,       action: !electrical alternator }
  - { match: pitot_heat_on,                 action: pitot_heat }
  - { match: fuel_pump_on,                  action: fuel_pump }
  - { match: transponder_mode,              action: transponder }
  - { match: fuel_tank_selector,            action: fuel_selector }
  - { match: flap_ratio,                    action: flaps }
  - { match: mixture_ratio,                 action: mixture }
  - { match: throttle_ratio,                action: throttle }
  - { match: ignition_key,                  action: ignition }
  - { match: elevator_trim,                 action: pitch_trim }
  - { match: taxi_light,                    action: !light taxi }
  - { match: landing_lights,                action: !light landing }
  - { match: strobe_lights,                 action: !light strobe }
  - { match: beacon_lights,                 action: !light beacon }
  - { match: navigation_lights,             action: !light nav }
  - { match: nav_lights,                    action: !light nav }

# Flap detents, retracted → full. Vfe is the max IAS (kts) to extend to each.
flaps:
  detents:
    - { label: up,   spoken: up,             ratio: 0.0 }
    - { label: "10", spoken: ten degrees,    ratio: 0.3333, vfe_kts: 110.0 }
    - { label: "20", spoken: twenty degrees, ratio: 0.6667, vfe_kts: 85.0 }
    - { label: full, spoken: full,           ratio: 1.0,    vfe_kts: 85.0 }

# Switchable lights (key the LLM selects by, spoken form, 0/1 dataref).
# command_on/command_off drive the panel switch (a raw dataref write can set the
# value without animating the 3D switch); dataref is still read back to confirm.
lights:
  - { key: nav,     spoken: navigation lights, dataref: sim/cockpit2/switches/navigation_lights_on, command_on: sim/lights/nav_lights_on,     command_off: sim/lights/nav_lights_off }
  - { key: beacon,  spoken: beacon,            dataref: sim/cockpit2/switches/beacon_on,            command_on: sim/lights/beacon_lights_on,  command_off: sim/lights/beacon_lights_off }
  - { key: strobe,  spoken: strobe lights,     dataref: sim/cockpit2/switches/strobe_lights_on,     command_on: sim/lights/strobe_lights_on,  command_off: sim/lights/strobe_lights_off }
  - { key: landing, spoken: landing light,     dataref: sim/cockpit2/switches/landing_lights_on,    command_on: sim/lights/landing_lights_on, command_off: sim/lights/landing_lights_off }
  - { key: taxi,    spoken: taxi light,        dataref: sim/cockpit2/switches/taxi_light_on,        command_on: sim/lights/taxi_lights_on,    command_off: sim/lights/taxi_lights_off }
