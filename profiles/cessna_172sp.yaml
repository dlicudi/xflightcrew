# Aircraft profile — X-Plane stock Cessna 172SP Skyhawk.
# Loaded by src/aircraft.rs at startup. Capability flags gate which tools are
# exposed; the tools own the standard X-Plane datarefs/commands. Flap detents,
# their Vfe limits, and the light set are per-airframe and live here.
#
# To add an aircraft: copy this file to profiles/<id>.yaml, adjust, and select
# it via XCOPILOT_AIRCRAFT=<id> (or add an acf_ICAO mapping in main.rs for
# auto-detect).

id: cessna_172sp
display_name: Cessna 172SP Skyhawk

# Capability flags — each gates a tool (or tool group).
autopilot: true        # set_heading / set_altitude / set_vertical_speed
engine: true           # set_throttle / set_mixture
barometer: true        # set_barometer
directional_gyro: true # align_gyro (sync DG to compass)
com_radio: true        # set_com1
transponder: true      # set_transponder (squawk)
ils: true              # prepare_ils (ILS approach lookup + setup)
parking_brake: true    # set_parking_brake
# Electrical systems for set_electrical. Each fires on/off commands (which
# animate the panel switch) and reads back to confirm. The 172 has a single
# battery, a single alternator, the two-bus avionics master, and a split BAT/ALT
# "master" rocker (battery+alternator together, NOT avionics).
electrical:
  - key: battery
    spoken: battery
    on_commands:  [sim/electrical/battery_1_on]
    off_commands: [sim/electrical/battery_1_off]
    readback:     [sim/cockpit/electrical/battery_on]
  - key: alternator
    spoken: alternator
    on_commands:  [sim/electrical/generator_1_on]
    off_commands: [sim/electrical/generator_1_off]
    readback:     ["sim/cockpit/electrical/generator_on[0]"]
  - key: avionics
    spoken: avionics master
    on_commands:  [sim/systems/avionics_on, sim/electrical/cross_tie_on]
    off_commands: [sim/systems/avionics_off, sim/electrical/cross_tie_off]
    readback:     [sim/cockpit/electrical/avionics_on, sim/cockpit2/electrical/cross_tie]
  - key: master
    spoken: master
    on_commands:  [sim/electrical/battery_1_on, sim/electrical/generator_1_on]
    off_commands: [sim/electrical/battery_1_off, sim/electrical/generator_1_off]
    readback:     [sim/cockpit/electrical/battery_on, "sim/cockpit/electrical/generator_on[0]"]
flood_lights: true     # set_flood_lights (pilot + copilot cockpit floods)
fuel_pump: true        # set_fuel_pump (electric/aux boost pump)
magnetos: true         # set_magnetos (off/left/right/both — run-up mag check)
carb_heat: false       # Lycoming IO-360 — FUEL INJECTED, like the aux pump above
                       # implies. The quadrant is THROT and MIX and nothing else
                       # (verified on the panel, 2026-09-13); induction alternate
                       # air is automatic, and the only pull knob near it is ALT
                       # STATIC AIR, which is the static system. Declaring it true
                       # earned a set_carb_heat tool writing carb_heat_ratio at an
                       # engine with no carburettor, a carb-ice advisory that can
                       # never apply, and "could be carburettor ice, try carb
                       # heat" in the rough-running diagnosis.
# set_fuel_selector — LEFT/BOTH/RIGHT (OFF is a separate shutoff valve, not a
# selector position). Commands animate the 3D knob; the logical position dataref
# confirms (1 left, 3 right, 4 both).
fuel_selector:
  readback: sim/cockpit2/fuel/fuel_tank_selector
  positions:
    - { key: left,  spoken: left,  command: sim/fuel/fuel_selector_lft, value: 1 }
    - { key: both,  spoken: both,  command: sim/fuel/fuel_selector_all, value: 4 }
    - { key: right, spoken: right, command: sim/fuel/fuel_selector_rgt, value: 3 }
pitot_heat: true       # set_pitot_heat (anti-ice for the ASI)
pitch_trim: true       # set_pitch_trim (nose up/down nudges, takeoff, neutral)
nav_radio: true        # set_nav1 / set_obs (NAV1 frequency + OBS course)
com2_radio: true       # set_com2 / swap_radio (COM2 + active/standby swap)
retractable_gear: false # no gear tool — the 172 has fixed gear

# Fuel-endurance alerting (minutes of fuel left at the current burn). The
# monitor cautions at the first figure and warns at the second. Standard VFR
# reserves: 30 min day / 45 min night.
fuel:
  reserve_caution_min: 45.0
  reserve_warning_min: 30.0
  cruise_burn_kg_hr: 24.0   # ~8.5 gal/hr — used to estimate endurance pre-takeoff

# Clean (flaps-up, power-off) stall speed, KIAS. Drives the monitor's airspeed
# callouts: a caution as you approach it, an urgent "lower the nose" below.
vs_clean_kts: 48.0

# Never-exceed speed (Vne), KIAS. Drives the monitor's overspeed callout: a
# caution as you approach redline, an urgent prompt at or above it.
vne_kts: 163.0

# Static reference figures recited on request ("what's best glide?", "Va?",
# "performance limits"). From the X-Plane C172 Pilot's Operating Manual. Vne and
# clean stall live above (the monitor uses them) and aren't repeated here.
# Note: the manual lists Va 99; the real-world 172S POH lists 105 at gross.
reference:
  kind: single-engine aircraft
  vno_kts: 129.0           # max structural cruise
  va_kts: 99.0             # maneuvering (manual value)
  vx_kts: 62.0             # best angle of climb
  vy_kts: 74.0             # best rate of climb
  vr_kts: 55.0             # rotate
  best_glide_kts: 68.0
  vs0_kts: 40.0            # stall, full flaps
  approach_kts: 65.0
  max_crosswind_kts: 15.0  # demonstrated
  cruise_kts: 124.0
  cruise_ias_kts: 108.0    # KIAS the cruise-power governor holds (124 kt TAS); tune in-sim
  best_climb_fpm: 730.0
  max_gross_lb: 2558.0
  empty_weight_lb: 1640.0
  useful_load_lb: 918.0
  service_ceiling_ft: 14000.0
  fuel_capacity_gal: 56.0
  fuel_useable_gal: 53.0
  endurance_hours: 4.0
  takeoff_distance_ft: 1630.0   # over a 50 ft obstacle: the recited field length
  takeoff_roll_ft: 960.0        # POH ground roll, 2,550 lb, sea level, 15 C: what the runway gates check
  landing_distance_ft: 1335.0
  max_rpm: 2700.0
  oil_temp_min_f: 100.0
  oil_temp_max_f: 245.0
  oil_press_min_psi: 50.0
  oil_press_max_psi: 90.0

# XChecklist file to interpret (read-only; the de-facto X-Plane community format,
# as used by the XChecklist plug-in). The copilot reads each item aloud, performs
# the ones it owns, verifies what it can read, and calls out the pilot's items.
checklist: checklists/cessna_172sp.txt

# Maps the checklist file's datarefs to curated actions. `match` is a substring of
# the file's dataref; the first matching entry wins, so order specific → general.
# The *value* (on/off, mode, percent, notch) is derived from the file's condition
# in code — this table only says which dataref drives which system.
checklist_map:
  - { match: parkbrake,                     action: parking_brake }
  - { match: autopilot/autopilot_on,        action: autopilot_off }
  - { match: electrical/battery_on,         action: !electrical battery }
  - { match: electrical/avionics_on,        action: !electrical avionics }
  - { match: electrical/generator_on,       action: !electrical alternator }
  - { match: pitot_heat_on,                 action: pitot_heat }
  - { match: fuel_pump_on,                  action: fuel_pump }
  - { match: transponder_mode,              action: transponder }
  - { match: fuel_tank_selector,            action: fuel_selector }
  - { match: flap_ratio,                    action: flaps }
  - { match: mixture_ratio,                 action: mixture }
  - { match: throttle_ratio,                action: throttle }
  - { match: ignition_key,                  action: ignition }
  - { match: elevator_trim,                 action: pitch_trim }
  - { match: taxi_light,                    action: !light taxi }
  - { match: landing_lights,                action: !light landing }
  - { match: strobe_lights,                 action: !light strobe }
  - { match: beacon_lights,                 action: !light beacon }
  - { match: navigation_lights,             action: !light nav }
  - { match: nav_lights,                    action: !light nav }

# Where things are, for "where's the X?" (answered from here, never guessed;
# longest matching key wins). Laminar 172SP, verified against the cockpit
# (2026-09-13, screenshot): the switch panel sits low on the pilot's side, and
# is DIMMING knobs (AVIONICS, SW/CB PANELS, PEDESTAL, STDBY IND) on the left,
# then a bracket labelled LIGHTS holding two rows of TOGGLE switches, not
# rockers: top row BEACON, LAND, TAXI, NAV, STROBE; bottom row FUEL PUMP,
# PITOT HEAT, then three blanks. The first version of this block (written from
# memory after the LEMG sortie, 2026-09-12) called them rockers in one row and
# put the fuel pump next to the master switch: all of that was wrong, and it
# was answered confidently. A location line is a HYPOTHESIS until somebody
# looks at the panel. The clearer shot the next minute corrected more of it:
# the master is ALT | BAT (not BAT | ALT), the magneto key is not beside the
# master at all but at the left end of the black BREAKER panel below, and this
# airframe is the G1000 variant, so the transponder is a PFD softkey and not a
# box in a radio stack.
locations:
  fuel pump: "the FUEL PUMP toggle on the switch panel low on the pilot's side, bottom row of the LIGHTS block, directly below the BEACON switch and left of PITOT HEAT"
  aux fuel pump: "the FUEL PUMP toggle on the switch panel low on the pilot's side, bottom row of the LIGHTS block, directly below the BEACON switch and left of PITOT HEAT"
  auxiliary fuel pump: "the FUEL PUMP toggle on the switch panel low on the pilot's side, bottom row of the LIGHTS block, directly below the BEACON switch and left of PITOT HEAT"
  auxiliary pump: "the FUEL PUMP toggle on the switch panel low on the pilot's side, bottom row of the LIGHTS block, directly below the BEACON switch and left of PITOT HEAT"
  boost pump: "the FUEL PUMP toggle on the switch panel low on the pilot's side, bottom row of the LIGHTS block, directly below the BEACON switch and left of PITOT HEAT"
  master switch: "the red split rocker on the sub-panel above and left of the DIMMING knobs, ALT on the left half and BAT on the right. Up is ON"
  battery switch: "the BAT half, the right side of the red MASTER rocker above and left of the DIMMING knobs. Up is ON"
  alternator switch: "the ALT half, the left side of the red MASTER rocker above and left of the DIMMING knobs. Up is ON"
  avionics master: "the grey AVIONICS split rocker immediately right of the red master, BUS 1 and BUS 2 halves. Up is ON"
  avionics switch: "the grey AVIONICS split rocker immediately right of the red master, BUS 1 and BUS 2 halves. Up is ON"
  standby battery: "the STDBY BATT toggle at the top of that sub-panel, above the master: ARM up, OFF, TEST down, with the green test light beside it"
  stdby batt: "the STDBY BATT toggle at the top of that sub-panel, above the master: ARM up, OFF, TEST down, with the green test light beside it"
  heading bug: "the knob right of the avionics switches, marked PUSH HDG SYNC. Press it to sync the bug to the current heading"
  heading knob: "the knob right of the avionics switches, marked PUSH HDG SYNC. Press it to sync the bug to the current heading"
  altitude select: "the ALT knob below the heading knob, left of the PFD"
  altitude bug: "the ALT knob below the heading knob, left of the PFD"
  ignition switch: "the MAGNETOS key at the left end of the black breaker panel below the switch panel, by your left knee"
  ignition key: "the MAGNETOS key at the left end of the black breaker panel below the switch panel, by your left knee"
  magnetos: "the key at the left end of the black breaker panel below the switch panel: OFF, R, L, BOTH, and START clockwise past BOTH"
  beacon light: "the BEACON toggle at the left end of the top row of the LIGHTS block, above the FUEL PUMP switch"
  beacon: "the BEACON toggle at the left end of the top row of the LIGHTS block, above the FUEL PUMP switch"
  landing light: "the LAND toggle in the top row of the LIGHTS block, second from the left, between BEACON and TAXI"
  taxi light: "the TAXI toggle in the middle of the top row of the LIGHTS block, between LAND and NAV"
  nav lights: "the NAV toggle in the top row of the LIGHTS block, between TAXI and STROBE"
  navigation lights: "the NAV toggle in the top row of the LIGHTS block, between TAXI and STROBE"
  strobe lights: "the STROBE toggle at the right end of the top row of the LIGHTS block"
  strobes: "the STROBE toggle at the right end of the top row of the LIGHTS block"
  pitot heat: "the PITOT HEAT toggle in the bottom row of the LIGHTS block, right of the FUEL PUMP switch"
  panel lights: "the DIMMING knobs at the left of the switch panel: AVIONICS and SW/CB PANELS on top, PEDESTAL and STDBY IND below"
  dimmer: "the DIMMING knobs at the left of the switch panel: AVIONICS and SW/CB PANELS on top, PEDESTAL and STDBY IND below"
  instrument lights: "the DIMMING knobs at the left of the switch panel: AVIONICS and SW/CB PANELS on top, PEDESTAL and STDBY IND below"
  fuel selector: "on the floor between the seats, the rotary with LEFT, BOTH and RIGHT"
  fuel shutoff valve: "the red knob on the floor pedestal behind the fuel selector. Pushed in is open"
  parking brake: "the pull handle under the panel by the pilot's left knee. Pull to set, push to release"
  flaps: "the WING FLAPS lever on the right of the panel, right of the mixture, with UP, 10, 20 and FULL down its scale and the indicator beside it"
  flap lever: "on the right of the panel, right of the mixture, with UP, 10, 20 and FULL down its scale and the indicator beside it"
  throttle: "the black knob in the centre of the lower panel, labelled THROT PUSH OPEN"
  mixture: "the red knob right of the throttle, labelled MIX PULL LEAN"
  elevator trim: "the trim wheel on the pedestal below the throttle. Forward is nose down"
  trim wheel: "on the pedestal below the throttle. Forward is nose down"
  alternate static: "the red pull knob above and left of the throttle, labelled ALT STATIC AIR PULL ON"
  static air: "the red pull knob above and left of the throttle, labelled ALT STATIC AIR PULL ON"
  circuit breakers: "three rows on the black panel below the switch panel, right of the magneto key: X-FEED BUS, ELEC BUS 1 and ELEC BUS 2 on the left, BUS ESS and the two AVN buses on the right. Each breaker is labelled above it"
  fuel pump breaker: "the leftmost breaker in the ELEC BUS 1 row, the middle row of the left breaker block, labelled FUEL PUMP"
  transponder: "on the G1000: the XPDR softkey along the bottom of the PFD, and the code reads out above it in the bottom right corner"
  autopilot: "the GFC 700 keys in the double column between the audio panel and the MFD: AP and FD on top, then HDG, ALT, NAV, VNV, APR, VS, FLC and the pitch UP and DOWN keys"
  autopilot panel: "the double column of keys between the audio panel and the MFD: AP and FD on top, then HDG, ALT, NAV, VNV, APR, VS, FLC and the pitch keys"
  audio panel: "the narrow stack between the two displays: COM and NAV mic and monitor keys, the PILOT/COPLT isolation knob, and the red DISPLAY BACKUP button at the bottom"
  com radio: "on the G1000: the COM knob at the top right of either display, push 1-2 to swap active and standby. The frequencies read along the top right of the screen"
  nav radio: "on the G1000: the NAV knob at the top left of either display, push 1-2 to swap active and standby"
  standby instruments: "the three round gauges low in the centre of the panel: airspeed, the vacuum attitude indicator, and the altimeter"
  cabin heat: "the two pull knobs at the far right of the panel, right of the flap lever: CABIN HT and CABIN AIR, both PULL ON"

# Checklist flow (src/flow.rs): the section read at each phase boundary. The
# defaults find this file's own titles by their words (CLIMB, CRUISE, DESCENT,
# BEFORE LANDING, AFTER LANDING), so nothing is declared here. A file whose
# titles differ maps them:
#   checklist_flow: { climb: CLIMB, before_landing: APPROACH, after_landing: TAXI IN }

# Phase-expectation advisor: standard VFR lighting discipline. Taxi light on
# the ground; strobes whenever airborne; landing light for the takeoff and the
# arrival. The copilot ACTS on these (fires `command`) rather than only advising.
# Landing light is deliberately NOT on the ground — the taxi light is what you
# use to taxi; landing lights on the taxiway dazzle other crews.
advisor:
  - dataref: sim/cockpit2/switches/taxi_light_on
    phases: [ground]
    say: Taxi light on.
    command: sim/lights/taxi_lights_on
  - dataref: sim/cockpit2/switches/strobe_lights_on
    phases: [takeoff, climb, cruise, approach, landing]
    say: Strobes on.
    command: sim/lights/strobe_lights_on
  - dataref: sim/cockpit2/switches/landing_lights_on
    phases: [takeoff, approach, landing]
    say: Landing light on.
    command: sim/lights/landing_lights_on

# Flap detents, retracted → full. Vfe is the max IAS (kts) to extend to each.
flaps:
  takeoff_ratio: 0.0   # the 172 takes off clean (flaps up)
  detents:
    - { label: up,   spoken: up,             ratio: 0.0 }
    - { label: "10", spoken: ten degrees,    ratio: 0.3333, vfe_kts: 110.0 }
    - { label: "20", spoken: twenty degrees, ratio: 0.6667, vfe_kts: 85.0 }
    - { label: full, spoken: full,           ratio: 1.0,    vfe_kts: 85.0 }

# Switchable lights (key the LLM selects by, spoken form, 0/1 dataref).
# command_on/command_off drive the panel switch (a raw dataref write can set the
# value without animating the 3D switch); dataref is still read back to confirm.
lights:
  - { key: nav,     spoken: navigation lights, dataref: sim/cockpit2/switches/navigation_lights_on, command_on: sim/lights/nav_lights_on,     command_off: sim/lights/nav_lights_off }
  - { key: beacon,  spoken: beacon,            dataref: sim/cockpit2/switches/beacon_on,            command_on: sim/lights/beacon_lights_on,  command_off: sim/lights/beacon_lights_off }
  - { key: strobe,  spoken: strobe lights,     dataref: sim/cockpit2/switches/strobe_lights_on,     command_on: sim/lights/strobe_lights_on,  command_off: sim/lights/strobe_lights_off }
  - { key: landing, spoken: landing light,     dataref: sim/cockpit2/switches/landing_lights_on,    command_on: sim/lights/landing_lights_on, command_off: sim/lights/landing_lights_off }
  - { key: taxi,    spoken: taxi light,        dataref: sim/cockpit2/switches/taxi_light_on,        command_on: sim/lights/taxi_lights_on,    command_off: sim/lights/taxi_lights_off }
