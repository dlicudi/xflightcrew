# Aircraft profile — X-Plane stock Boeing 737-800 (B738).
#
# The first stock airliner, and the bridge to the add-on 737s: a clean Laminar
# aircraft on STOCK systems. Its xlua replaces only the starters, auto_start /
# auto_board, the speedbrake, barometer and minimums commands, and
# `battery_1_off` (grepped `replace_command` across plugins/xlua/scripts,
# 2026-09-16), so the stock electrical and light commands below reach it.
# Every figure is from the aircraft itself: the specifications page of
# `X-Plane_B737_Pilot_Operating_Manual.pdf` in the aircraft folder and its
# `b738.acf` (Vs 139 / Vso 114 / Vfe 250 and 162 / Vle 270 / Vmo 340, MTOW
# 174,200 lb, empty 91,300 lb, nine flap positions 0/3/5/8/10/12/14/18/40 deg).
# Lines marked VERIFY are placard figures from memory, hypotheses until probed.
#
# ENGINE START IS THE AIRCRAFT'S OWN SCRIPT. Its xlua replaces
# `sim/operation/auto_start` with a full sequence (auto-board from cold and
# dark: battery, standby power, fire tests, APU; then auto-start: fuel pumps,
# APU gens, packs off, starter 2 then 1 on N2, condition levers, generators,
# probe heat, bleeds, APU off, continuous ignition). Probed parked at LFLL
# 2026-09-17: one press, 124 s to both engines running. `scripted_auto_start`
# makes that the crew's start; the MD-82 APU/bleed sequence (`turbine_start`)
# is written against laminar/md82/* and stays off.

id: boeing_737_800
display_name: Boeing 737-800

# Which loaded aircraft this profile is for (detect::resolve): the ICAO
# alone is a TYPE, and two models of one type (the stock 737 and the Zibo
# both say B738) must never share a profile. Every key must hit. The acf
# entry is a substring of acf_relative_path: if the aircraft's folder is
# renamed, change it here (an unmatched model flies generic, said aloud).
match:
  icao: [B738, B737, B739]
  acf: ["Laminar Research/Boeing 737-800/"]

# Capability flags.
autopilot: true        # set_heading / set_altitude / set_vertical_speed
throttle: true         # thrust levers — jet, so NO piston engine group
# The stock 737 has an autothrottle, but the `autothrottle` tool is written
# against laminar/md82 datarefs and declaring it withholds `hold_speed` (the
# Citation X lesson, 2026-07-28). Speed is the throttle governor's job.
autothrottle: false
speedbrake: true       # the xlua implements the stock speedbrake commands
reverse_thrust: true   # rollout only, self-stowing (VERIFY on this airframe)
rollout_reverse: true  # autoland selects it on settled wheels (#222; unflown)
# The stock dial is this xlua's OUTPUT: `B738_baro_memory` copies its own
# laminar/B738/barometer/capt_setting into it every frame, and that dataref
# is not writable over the API (403). A dial write is a silent no-op (probed
# parked at LFLL, 2026-09-17); the crew's setter notices and steps the knob
# with the replaced barometer_up/down commands, a hundredth a press (proven
# live: eleven presses, 30.11 to 30.00 and back).
barometer: true
# The STD fast path (#94): `B738_efis_std_*_CMDhandler` toggles STD, and
# `B738_baro_memory` resets the memory to 29.92 while STD shows (unless the
# knob was turned in STD), so two presses leave the memory at 29.92 in QNH
# display from anywhere. A set far from the ask goes there first and steps
# the knob from 29.92 (EGSS 2026-09-22: 0 to 30.40 was 3,040 presses; this
# is 2 plus 48). The dial read after the presses is the verdict. VERIFY: the
# pair was pressed live once (2026-09-22) and never through this path.
# At flight start the xlua copies the STOCK dial into its memory
# (`B738_set_glare_all_modes`), which is how a stock dial at 0.0 at load
# became a memory at 0.0.
altimeter:
  std_command: laminar/B738/EFIS_control/capt/push_button/std_press
  std_presses: 2
  copilot_std_command: laminar/B738/EFIS_control/fo/push_button/std_press
# The approach is flown ON thrust (about 55-60% N1 with flaps 40): the speed
# law never pulls the lever under this on a stabilised final, and the flare
# retards it on the engine's spool (TECS, `pilot::energy`), never a cut (a
# swept wing at idle sinks
# at once: the first landing here touched at -449 fpm and 128 kt after an
# idle last mile and a throttle cut at 22 ft, 2026-09-17). Both VERIFY: the
# 0.4 lever the speed law settled on at Vref that day is the only measurement.
approach_thrust_min: 0.3
# The rudder on the takeoff roll (autotakeoff::RollSteer): yaw rate per unit
# of steer, growing with the square of the speed. Fitted to both EGKK 26L
# rolls of 2026-09-27 (8 kt crosswind from the left, 30 to 86 kt; 3 s
# predictions 0.07 degrees rms): 6.45 deg/s at 60 kt, through a 0.47 s lag
# after 0.3 s of dead time, against a weathervane of 2.5 deg/s per 60 kt.
# The default law's 0.03 of steer per degree over 50 kt held the nose 5
# degrees off and rejected both rolls 10 m left of the centreline.
roll_rudder:
  yaw_dps: 11.5
  at_kts: 80.0
pitot_heat: true
pitch_trim: true
com_radio: true
com2_radio: true
nav_radio: true
transponder: true
ils: true
# The MCP, owned by src/autoflight.rs. Its own buttons (B738.glareshield.lua:
# each press handler fires the stock mode command after its power check and
# sets the MCP lamps; cmd_a_press engages only while the captain's FD mode is
# not already servos, so it is not a toggle). CMD B is never named: pressed
# with CMD A in, outside APP, it dropped CMD A (LEMG, 2026-10-05). LVL CHG
# stays stock on purpose: the 737's own press also fires autothrottle_on, and
# a loop that flies the levers would then fight it. VERIFY: blackbox
# `autoflight` `press` with these commands, and `ap_state` following.
# The window: this MCP flies a V/S only toward its altitude window (parked at
# 5,600 over a 3,400 ft inbound the -570 dial held level, LEMG 13
# 2026-10-05 12:25; with it at 0 the descents and the go-around climbs
# followed), so autoland parks it at the field, toward every descent of the
# approach (`autoflight::WindowRule::AtField`, was `alt_dial_park_field`).
autoflight:
  engage_command: laminar/B738/autopilot/cmd_a_press
  heading_command: laminar/B738/autopilot/hdg_sel_press
  vs_command: laminar/B738/autopilot/vs_press
  altitude_hold_command: laminar/B738/autopilot/alt_hld_press
  # LNAV on the stock FMS (#227, probed live 2026-10-06 at FL360 over Spain):
  # lnav_press is a toggle firing the stock GPSS (only with CMD in), the lamp
  # reads 1 engaged, autopilot_state 540672 (LNAV 524288 + ALT HOLD).
  lnav_command: laminar/B738/autopilot/lnav_press
  lnav_status: laminar/B738/autopilot/lnav_status
  vs_toward_window: true
parking_brake: true
retractable_gear: true
cabin_crew: true       # 189 seats and an interphone
pressurised: true
engines: 2

turbine_start: false
auto_prep: false
scripted_auto_start: true

# The aircraft scripts its own START; the SHUTDOWN is ours, and the stock
# mixture lever is not the control. B738.systems.lua rewrites
# `mixture_ratio[0..1]` every frame from `condition_lever{1,2}`, itself an
# animation output driven toward `_target`, so the stock write is accepted and
# then erased and "fuel levers cut" was a lie at the EIDW stand (2026-09-20).
# Probed live the same day: `condition_lever1` is_writable FALSE, `_target`
# TRUE. Cutoff is 0; the lua lights the engine at >= 0.75.
fuel_cutoff_levers:
  - laminar/B738/engine/slider/condition_lever1_target
  - laminar/B738/engine/slider/condition_lever2_target

# Jet — none of the piston systems apply.
engine: false
magnetos: false
carb_heat: false
fuel_pump: false
directional_gyro: false

# The CTR tank's pumps come off when the centre is empty (tools/fuel_pumps.rs).
# The stock `fuel_tank_pump_on` IS the cockpit switch here: probed live
# 2026-09-27, the pilot switched CTR off and element 1 read 0 with both CTR
# LOW PRESSURE lights out. B738.Z.autostart.lua step 4 switches it ON over an
# empty centre and B738.systems.lua writes 0 only at cold and dark; nothing
# rewrites it per frame. Tank 1 is the centre (acf `_tank_name/1 Center`,
# `_tank_xyz/1,0` 0), the wings 23 ft either side.
fuel_tank_pumps_off_when_empty: [1]

# Electrical on the stock commands (only `battery_1_off` is replaced, and by
# the aircraft's own handler). Readbacks are the stock switch datarefs. VERIFY.
electrical:
  - key: battery
    spoken: battery
    on_commands:  [sim/electrical/battery_1_on]
    off_commands: [sim/electrical/battery_1_off]
    readback:     [sim/cockpit/electrical/battery_on]
    # The battery switch is GUARDED: B738.systems.lua `B738_guard_cover_logic`
    # sets battery_on[0] = 1 every frame while guard_cover_pos[0] < 0.5, so
    # battery_1_off under a shut guard is undone the next frame ("The battery
    # didn't move", 17:07Z 2026-09-26). The cover is the xlua's own toggle
    # command; its position array is created by B738.switches.lua.
    guards:
      - { command: laminar/B738/guard_cover00, dataref: "laminar/B738/button_switch/guard_cover_pos[0]" }
  - key: generators
    spoken: generators
    on_commands:  [sim/electrical/generator_1_on, sim/electrical/generator_2_on]
    off_commands: [sim/electrical/generator_1_off, sim/electrical/generator_2_off]
    readback:     ["sim/cockpit/electrical/generator_on[0]", "sim/cockpit/electrical/generator_on[1]"]
  - key: avionics
    spoken: avionics
    on_commands:  [sim/systems/avionics_on]
    off_commands: [sim/systems/avionics_off]
    readback:     [sim/cockpit/electrical/avionics_on]

# Exterior lights (standard X-Plane switch datarefs; no light command is
# replaced). PROVEN 2026-09-17 on the parked aircraft: the stock landing
# command sets all four landing_lights_switch[] entries the lamps read.
# NOT proven: the taxi lamp. The stock command sets taxi_light_on (which the
# readback reads) but the cockpit switch drives generic_lights_switch[4] via
# laminar/B738/toggle_switch/taxi_light_brightness_pos_dn (0 / 0.5 / 1), and
# no object references either name; the acf declares a stock taxi light
# circuit. Look at the nose when the crew says "taxi light on".
lights:
  - { key: nav,     spoken: navigation lights, dataref: sim/cockpit2/switches/navigation_lights_on, command_on: sim/lights/nav_lights_on,     command_off: sim/lights/nav_lights_off }
  - { key: beacon,  spoken: beacon,            dataref: sim/cockpit2/switches/beacon_on,            command_on: sim/lights/beacon_lights_on,  command_off: sim/lights/beacon_lights_off }
  - { key: strobe,  spoken: strobe lights,     dataref: sim/cockpit2/switches/strobe_lights_on,     command_on: sim/lights/strobe_lights_on,  command_off: sim/lights/strobe_lights_off }
  - { key: landing, spoken: landing lights,    dataref: sim/cockpit2/switches/landing_lights_on,    command_on: sim/lights/landing_lights_on, command_off: sim/lights/landing_lights_off }
  - { key: taxi,    spoken: taxi light,        dataref: sim/cockpit2/switches/taxi_light_on,        command_on: sim/lights/taxi_lights_on,    command_off: sim/lights/taxi_lights_off }

# Vmo 340 KIAS (Mmo 0.82); the acf's Vne. The monitor carries one number.
vne_kts: 340.0
# Clean stall from the acf, mid weight. The speed floor (1.2 x this = 167) sits
# ABOVE the flaps-40 approach speed on purpose: a clean-configuration floor is
# what the automation may be handed from a plan, and the derived approach speed
# is max(1.3 Vso, 1.2 Vs) anyway.
# Set after start, confirmed before the brakes come off, and at the gear
# (src/takeoff_config.rs). Probed parked 2026-09-21, a write and a read 1.2 s
# later: `speedbrake_ratio` -0.5 (armed) holds, `auto_brake_level` 0 (RTO)
# holds. Landing autobrake 2 is stock level 3 (0 RTO, 1 off, 2..5 = 1, 2, 3,
# MAX). VERIFY in the air that the armed lever deploys at touchdown.
# Boeing: the lever is DOWN for takeoff (the BEFORE TAKEOFF list's own item;
# armed is a takeoff configuration warning), raised by the crew on a reject,
# armed at the gear. EGPH 2026-09-21: armed after start and still armed
# climbing through 7,000 ft.
takeoff_config:
  arm_spoilers: true
  takeoff_speedbrake_down: true
  autobrake_rto: true
  landing_autobrake_level: 3
  # The autoflight a crew sets before the roll (EGPH 2026-09-21: the MCP
  # speed window at 125, no flight directors, no A/T arm; issue #91). All
  # stock, and the B738 glareshield script only READS them: FD
  # flight_director_mode (fdir_on), A/T autothrottle_enabled 0 = the PFD's
  # "ARM" (autothrottle_arm from hard off; an engaged mode is taken out with
  # autothrottle_off, since the takeoff owns the levers), the MCP window
  # airspeed_dial_kts_mach. V2 is the card's (V1 140 / VR 145 / V2 150).
  flight_directors: true
  autothrottle_armed: true
  v2_kts: 150.0
  # Thrust reduction at 1,000 ft to climb thrust. No FADEC notches on this
  # acf (_fadec_parameter -1), so the lever is roughly linear in thrust and
  # 0.9 is a hypothesis for CLB. VERIFY: blackbox `autotakeoff`
  # `thrust_reduction` carries `n1` (CLB is about 95 % at sea level).
  thrust_reduction_agl_ft: 1000.0
  climb_thrust_ratio: 0.9
vs_clean_kts: 139.0
# Gear operating limit (VLO 235 to extend in the real aircraft; the acf's
# Vle 270 is the extended limit). The tool refuses cycling above this.
vlo_kts: 235.0

# The attitude at which the tail touches: about 11 degrees at full strut
# extension on the -800, the longest-bodied 737 of its generation. The auto
# takeoff bounds its rotation 2 degrees below this. VERIFY.
tail_strike_deg: 11.0
# Nose-down elevator the rotation law may command. The shared GA default is
# 0.10, which on this airframe is not authority: commanded 8 degrees, it flew
# 22.4 with the law pinned at -0.10 and the pitch rate still building, wanting
# -0.38 (BIKF-EGPH, 2026-09-20). Half travel is enough to hold the tail-strike
# ceiling above without being able to shove the nose at the runway.
pitch_authority_down: 0.5
# The highest attitude the hand-flown initial climb may hold once the tail
# clears (autotakeoff::tail_clear_ceiling_deg), holding V2 + 15 by pitch to the 300 ft engage
# (autotakeoff::ClimbHold, issue #78). At 8 degrees the aircraft went 162 to
# 185 kt by 300 ft on all five LEMG 13 circuits (2026-09-28); the excess
# thrust recorded there wants about 16 to hold 165. VERIFY: blackbox
# `autotakeoff` `climb_manual` `ias` 150-173 and `theta` under this.
climb_pitch_max_deg: 18.0

# Taxi pacing: an MD-82 figure. At idle thrust a 737 rolls past 10 knots on
# flat pavement, so 10 is a brake setting; airline practice is 15-20 straight,
# about 10 through the turns.
taxi:
  kts: 18.0
  turn_kts: 10.0
  sharp_kts: 6.0
  # Full lock turns it at about 20 deg/s under 7 kt (LEMG, LIBP 2026-09-26);
  # a corner is taken at 15 of them times its radius. LEMG's Alpha, drawn at
  # 9 m, went in at 11.5 kt asking 38 and swung 5.8 m wide.
  max_yaw_dps: 15.0

# Fuel-endurance alerting. 6,875 US gal capacity; cruise burn about 5,500
# lb/hr (2,500 kg/hr) for the pair. Reserves are airline final-reserve shaped.
fuel:
  reserve_caution_min: 60.0
  reserve_warning_min: 30.0
  cruise_burn_kg_hr: 2500.0
  # Jet A-1, not 100LL. The shared default is avgas (2.72), which briefed this
  # airframe's fuel 11.8% light: 3,126 kg in the tanks was read back as "1,149
  # gallons" when it is 1,028 (BIKF-EGPH, 2026-09-20).
  kg_per_gal: 3.04
  # ...and an airliner is fuelled in kilos, never gallons. Full auto's own
  # preflight already spoke pounds; the plan brief spoke gallons. One cockpit,
  # one unit.
  spoken_unit: kg

# Transition altitude is the FLIGHT's, not the airframe's; the plan overrides
# this when it carries one. FL180 is the default for the US.
transition_altitude_ft: 18000.0

# Static reference figures. V-speeds are a single mid-weight card (about
# 150,000 lb, flaps 5) because the automation needs A number and a
# weight-computed card is future work; they read high at light weight, which
# is the safe side for a rotation. POM: approach 135-155 full flap, takeoff
# 8,700 ft, landing 5,360 ft, ceiling 41,000, long-range cruise 450 KTAS.
reference:
  kind: twin-engine jet
  vr_kts: 145.0                # ~150,000 lb flaps 5 (V1 140 / V2 150). VERIFY
  vy_kts: 210.0                # climb-out + pattern speed the laws hold (250 below 10,000 is the cruise climb)
  # The INITIAL climb, liftoff to the takeoff's handoff — V2 + 20 at this
  # weight card, which is what the aircraft actually has at 400 ft. Distinct
  # from `vy_kts` because the takeoff's climb law protects the speed it is
  # given: fed the 210, it read 174 kt as thirty-six knots slow, stripped
  # 2,150 fpm off the commanded rate and levelled a 737 at takeoff thrust at
  # 1,030 ft before the follower picked it up (LFLL, 2026-09-17).
  initial_climb_kts: 170.0     # V2 150 + 20. VERIFY
  # Where the climb-out stops holding that speed and starts accelerating and
  # cleaning up. Below it the takeoff climbs as hard as `best_climb_fpm` to
  # keep the speed, and the flaps stay put (EGPH 2026-09-21: 1,500 fpm at
  # takeoff thrust was 240 kt through 1,000 ft, the flaps up by 740). VERIFY
  # in the air: blackbox `autotakeoff` `climb`, `ias` near the hold to 1,000 ft.
  acceleration_height_agl_ft: 1000.0
  best_climb_fpm: 3000.0       # initial climb, light; the climb law takes 80%
  # KIAS the cruise governor holds. Nothing in the crew reads Mach, so the
  # number must stay under Mmo 0.82 at the cruise altitudes a 737 files:
  # 255 KIAS is M0.78 at FL360 (the old 280, the acf's Vno, is M0.84 there,
  # and on 2026-09-17 the aircraft could not reach it and sat at 240 on the
  # stop). Lower cruise is slower than it could be; that is the safe side.
  cruise_ias_kts: 255.0
  # Optimum cruise altitude, and how it rises as fuel burns off. Anchored at
  # 65 t / FL380; the -800 sits near FL340 at max takeoff weight and near
  # FL400 light, which is the ~290 ft per tonne below. Advisory only: the
  # copilot offers the step, the pilot asks ATC for it. VERIFY against the FCOM
  # cruise tables.
  optimum_alt_ft: 38000.0
  optimum_alt_at_kg: 65000.0
  optimum_alt_ft_per_1000kg: 290.0
  # Enroute vertical rates. The shared 700 fpm default is a GA number and a
  # 1.1 degree path at these speeds: the BIKF arrival wanted ~2,000 fpm on
  # every leg inbound of BASLU, and the climb to FL340 took 37 minutes at it.
  # 2,000 fpm is an ordinary jet climb at mid-altitudes and an idle descent
  # near enough a 3 degree path at 340 kt over the ground. The climb is still
  # speed-protected on top of this (`climb_vs_fpm`), so a rate the aircraft
  # cannot support up high backs itself off.
  enroute_climb_fpm: 2000.0
  enroute_descent_fpm: 2000.0
  approach_kts: 145.0          # POM 135-155, full flap / gear down; Vref40 ~140 mid weight
  vs0_kts: 114.0               # acf: stall, landing configuration
  cruise_kts: 450.0            # POM long-range cruise, KTAS (max level 490)
  max_gross_lb: 174200.0       # acf MTOW
  empty_weight_lb: 91300.0     # acf empty
  useful_load_lb: 82900.0      # MTOW - empty
  service_ceiling_ft: 41000.0  # POM
  max_crosswind_kts: 33.0      # demonstrated, dry. VERIFY
  fuel_capacity_gal: 6875.0    # 46,000 lb Jet A-1 at 6.7 lb/gal
  endurance_hours: 8.0         # 46,000 lb / 5,500 lb per hour, no reserve
  takeoff_distance_ft: 8700.0  # RECITED: POM field length at MTOW
  # GROUND ROLL, what the automation checks a runway against (it adds its own
  # x1.4). At the card's mid weight the roll to lift-off is about 5,500 ft; the
  # recited 8,700 is a factored MTOW field length (the MD-82 lesson, 2026-07-28).
  takeoff_roll_ft: 5500.0
  landing_distance_ft: 5360.0  # POM
  # LANDING ROLL, touchdown to a stop on a wet runway: the room a landing
  # already on the wheels needs (autoland::landing_call at the roundout
  # gate, the committed flare). The 5,360 above is a factored field length
  # from 50 ft: x 0.6 is 3,216 ft of actual distance, less the 955 ft of
  # 3 degree air, x 1.15 wet. LXGB 09 wet (2026-10-06) stopped from 136 kt
  # over the ground in about 540 m (1,770 ft) with reverse.
  landing_roll_ft: 2600.0

# Nine positions in the aircraft file, 0/3/5/8/10/12/14/18/40 degrees, which
# are the 737's UP/1/2/5/10/15/25/30/40 handle gates in order. Per-gate limits
# are the placard ladder; the acf agrees at both ends (250 for the first gate,
# 162 for the last). VERIFY the middle in the sim.
flaps:
  takeoff_ratio: 0.375
  detents:
    # `retract_above_kts` is the detent's manoeuvring speed and gates the
    # climb-out retraction. Flaps 5 is the takeoff setting, so the schedule
    # this airframe actually walks is 5 -> 1 -> up (detent 2 declared a speed
    # too and added a step, Alghero 2026-09-27). VERIFY against the FCOM
    # flap manoeuvring speed card for the operating weight.
    #
    # `idle_decel_kts_s`: how fast each configuration slows at idle in level
    # flight, the plan behind every final (`approach_energy`, backward from
    # the 1,000 ft gate). Fitted from every 10 s idle window (lever 0.12 or
    # less, under 10,000 ft, wings level) of this airframe in the blackbox,
    # 2026-09-25 to 2026-10-05, made level by the climb or descent flown;
    # the lower quartile, rounded down (the 10-05 LEMG 13 final alone: 1.0
    # level at flaps 5, 0.5 on a 2.8 degree descent at 10 to 25). Clean
    # 1.14 median (n 341), flaps 5 1.05 (11), 10 1.59 (150), 30 1.49 (16),
    # 40 2.32 (4); 15 and 25 have two and three windows, held to 10's.
    # On the 3 degree path gravity takes 1.0 kt/s back: flaps 5 and cleaner
    # cannot slow on the path at all, so the path is joined at flaps 15 with
    # the gear (`join_kts`). VERIFY: autoland ticks carry `e_kts`, `e_flap`,
    # `e_gate`.
    - { label: up,   spoken: up,          ratio: 0.0,   retract_above_kts: 210.0, idle_decel_kts_s: 0.9 }
    - { label: "1",  spoken: one,         ratio: 0.125, vfe_kts: 250.0, retract_above_kts: 190.0, idle_decel_kts_s: 0.8 }
    - { label: "2",  spoken: two,         ratio: 0.25,  vfe_kts: 250.0, idle_decel_kts_s: 0.8 }
    - { label: "5",  spoken: five,        ratio: 0.375, vfe_kts: 250.0, idle_decel_kts_s: 0.8 }
    - { label: "10", spoken: ten,         ratio: 0.5,   vfe_kts: 210.0, idle_decel_kts_s: 1.2 } # VERIFY
    - { label: "15", spoken: fifteen,     ratio: 0.625, vfe_kts: 200.0, idle_decel_kts_s: 1.2 } # VERIFY
    - { label: "25", spoken: twenty five, ratio: 0.75,  vfe_kts: 190.0, idle_decel_kts_s: 1.3 } # VERIFY
    - { label: "30", spoken: thirty,      ratio: 0.875, vfe_kts: 175.0, idle_decel_kts_s: 1.4 } # VERIFY
    - { label: "40", spoken: forty,       ratio: 1.0,   vfe_kts: 162.0, idle_decel_kts_s: 2.2 } # acf Vfe

# The normal checklist (checklists/boeing_737_800.txt, written 2026-09-17 on
# datarefs verified to exist on this aircraft). Section titles are the phase
# keys, so the tracker's climb / descent / before landing / after landing
# lists all resolve without an override.
checklist: checklists/boeing_737_800.txt
checklist_map:
  - { match: parking_brake_ratio,       action: parking_brake }
  - { match: transponder_mode,          action: transponder }
  - { match: pitot_heat,                action: pitot_heat }
  - { match: elevator_trim,             action: pitch_trim }
  - { match: flap_ratio,                action: flaps }
  - { match: throttle_ratio,            action: throttle }
  - { match: taxi_light,                action: !light taxi }
  - { match: landing_lights,            action: !light landing }
  - { match: strobe_lights,             action: !light strobe }
  - { match: beacon_on,                 action: !light beacon }
  - { match: navigation_lights,         action: !light nav }
  - { match: electrical/generator_on,   action: !electrical generators }
  - { match: electrical/battery_on,     action: !electrical battery }

# Phase-expectation advisor: the SOP table, the MD-82's on stock switches.
advisor:
  - dataref: sim/cockpit2/switches/yaw_damper_on
    phases: [climb, cruise, approach]
    say: Yaw damper's still off.
  - dataref: sim/cockpit2/ice/ice_pitot_heat_on_pilot
    phases: [takeoff, climb, cruise, approach, landing]
    say: Pitot heat's off.
  - dataref: sim/cockpit/electrical/landing_lights_on
    phases: [takeoff, approach, landing]
    say: Landing lights on.
    command: sim/lights/landing_lights_on
  # The crew works the switch (`tools::signs`, the stock switch here: on
  # before start, off through ten thousand, on again below), so the climb is
  # not a phase where "off" is a fault. Probed parked 2026-09-21: 0 off,
  # 1 AUTO, 2 ON all hold and the annunciator follows; the checklist's "ON"
  # tested for 1, which is AUTO.
  - dataref: sim/cockpit2/switches/fasten_seat_belts
    phases: [takeoff, approach, landing]
    say: Seat belt signs are off.

# The ILS is flown on the autopilot's own approach mode (#81): APP armed on
# an intercept from below the beam, the localiser and then the glideslope
# the airframe's once captured, our speed, configuration, gate, arrest and
# rollout. On the heading knob the 737 wove 10 to 15 m either side of LEMG
# 13's centreline all the way down (2026-09-26).
# The evidence, re-read on the autopilot_state bitfield: of 46 autoland arms
# 2026-09-26 to 09-28, 34 showed the APP armed or captured within 4 s (50 to
# 1330, 1584 or 2560), and every one was dropped by autoland's own HDG and
# V/S presses at the next tick, while app_status, the read it trusted, said
# 0 (the owner, src/autoflight.rs, never presses over a capture now). 7 more
# showed nothing in the 1 s state samples and 4 had the servos out. On
# 2026-10-05 the APP flown by hand from ALT HOLD under the beam armed at
# 13:22:39, captured the localiser 13:24:37 and the glideslope 13:25:45, and
# tracked both to the flare. VERIFY (unflown through the owner): blackbox
# `ils` `coupling` from Off to Coupled with `modes`, `autoflight` `press`
# APP once, no HDG or V/S press between the arm and the roundout, and the
# stable gate's record at 1,000 ft.
ils_coupled: true
# Coupled down to 500 ft radio, then autoland's own VS final and flare: the
# arrest taken out of the coupled glideslope at 80 ft ballooned 43 to 100 ft
# into a balk (LEMD 18L, 2026-10-05 16:57).
ils_decouple_agl_ft: 500.0
# Its own APP button (the press handler fires the stock approach command
# after its power check and lights the lamp).
approach_command: laminar/B738/autopilot/app_press
