# Aircraft profile — X-Plane stock Cirrus SR22 (Laminar).
#
# SCAFFOLD. Built from the GoofyJP XChecklist file and the POH; the datarefs
# marked "verify" are unconfirmed against the sim. Conservative by design: only
# tools/actions on *universal* X-Plane datarefs are enabled. The SR22's own
# systems — dual battery/alternator, the ENGN_mixt mixture, the boost pump, the
# off/left/right fuel selector, key-start ignition — are left off until their
# datarefs/tools are built and verified in the cockpit.

id: cirrus_sr22
display_name: Cirrus SR22

# Capability flags — universal-dataref tools only, for now.
autopilot: true        # set_heading / set_altitude / set_vertical_speed (universal AP)
barometer: true        # set_barometer (universal)
com_radio: true        # set_com1
com2_radio: true       # set_com2 / swap_radio
nav_radio: true        # set_nav1 / set_obs
transponder: true      # set_transponder (universal transponder_mode)
ils: true              # prepare_ils
parking_brake: true    # set_parking_brake (universal parkbrake)
pitot_heat: true       # set_pitot_heat (universal pitot_heat_on)

# Throttle/mixture/start write universal datarefs (throttle_ratio_all,
# mixture_ratio_all, the starter command) — confirmed against the rustdecks deck.
# (start_engine sets battery 1 + alternator 1 only; the SR22's BAT2/ALT2 need the
# dual-electrical tool.)
engine: true
# Dual battery + dual alternator + avionics. Datarefs/commands verified against
# the rustdecks SR22 deck. The pair keys ("batteries"/"alternators") switch both
# at once; "all" hits every system.
electrical:
  - { key: battery1,    spoken: battery one,       on_commands: [sim/electrical/battery_1_on],  off_commands: [sim/electrical/battery_1_off],  readback: ["sim/cockpit2/electrical/battery_on[0]"] }
  - { key: battery2,    spoken: battery two,       on_commands: [sim/electrical/battery_2_on],  off_commands: [sim/electrical/battery_2_off],  readback: ["sim/cockpit2/electrical/battery_on[1]"] }
  - { key: alternator1, spoken: alternator one,    on_commands: [sim/electrical/generator_1_on], off_commands: [sim/electrical/generator_1_off], readback: ["sim/cockpit2/electrical/generator_on[0]"] }
  - { key: alternator2, spoken: alternator two,    on_commands: [sim/electrical/generator_2_on], off_commands: [sim/electrical/generator_2_off], readback: ["sim/cockpit2/electrical/generator_on[1]"] }
  - { key: batteries,   spoken: both batteries,    on_commands: [sim/electrical/battery_1_on, sim/electrical/battery_2_on],   off_commands: [sim/electrical/battery_1_off, sim/electrical/battery_2_off],   readback: ["sim/cockpit2/electrical/battery_on[0]", "sim/cockpit2/electrical/battery_on[1]"] }
  - { key: alternators, spoken: both alternators,  on_commands: [sim/electrical/generator_1_on, sim/electrical/generator_2_on], off_commands: [sim/electrical/generator_1_off, sim/electrical/generator_2_off], readback: ["sim/cockpit2/electrical/generator_on[0]", "sim/cockpit2/electrical/generator_on[1]"] }
  - { key: avionics,    spoken: avionics master,   on_commands: [sim/systems/avionics_on],       off_commands: [sim/systems/avionics_off],      readback: [sim/cockpit/electrical/avionics_on] }

# --- SR22-specific: off until built and verified in the sim ---
magnetos: false        # key-start ignition differs from the 172 mag switch
carb_heat: false       # fuel-injected — no carb heat
fuel_pump: false       # laminar/sr22/switch/boost_pump
# Fuel selector: OFF / LEFT / RIGHT — no "both" (low-wing twin tanks, fed one at
# a time). laminar/sr22 selector commands verified against the rustdecks deck;
# the position dataref (laminar/sr22/fuel_selector_pos) exists but its integer
# mapping is unverified, so no readback confirm yet — the verified command is
# trusted. ("off" is quoted: bare off is YAML boolean false.)
fuel_selector:
  positions:
    - { key: "off",  spoken: "off",  command: laminar/sr22/fuel_sel_left_off }
    - { key: left,   spoken: left,   command: laminar/sr22/fuel_sel_left_select }
    - { key: right,  spoken: right,  command: laminar/sr22/fuel_sel_right_select }
directional_gyro: false # G1000 glass — no vacuum DG to sync
flood_lights: false
pitch_trim: false      # verify trim dataref + range first
retractable_gear: false

# Fuel-endurance alerting. SR22 ~92 gal usable, ~17 gal/hr cruise (~46 kg/hr). VERIFY.
fuel:
  reserve_caution_min: 45.0
  reserve_warning_min: 30.0
  cruise_burn_kg_hr: 46.0

# Clean (VS1) stall ~76 KIAS; landing config (VS0) ~61. Drives the airspeed monitor.
vs_clean_kts: 76.0

# Flaps 0 / 50% / 100% (Vfe 150 / 110 KIAS). set_flaps writes the universal
# flap_ratio. Detent ratios: VERIFY.
flaps:
  detents:
    - { label: up,   spoken: up,            ratio: 0.0 }
    - { label: "50", spoken: fifty percent, ratio: 0.5, vfe_kts: 150.0 }
    - { label: full, spoken: full,          ratio: 1.0, vfe_kts: 110.0 }

# XChecklist file to interpret (GoofyJP, read-only).
checklist: checklists/cirrus_sr22.txt

# Lights — datarefs verified against the rustdecks SR22 deck; universal commands.
lights:
  - { key: nav,     spoken: nav lights,    dataref: sim/cockpit2/switches/navigation_lights_on,   command_on: sim/lights/nav_lights_on,     command_off: sim/lights/nav_lights_off }
  - { key: strobe,  spoken: strobe lights, dataref: sim/cockpit2/switches/strobe_lights_on,        command_on: sim/lights/strobe_lights_on,  command_off: sim/lights/strobe_lights_off }
  - { key: landing, spoken: landing light, dataref: "sim/cockpit2/switches/landing_lights_switch[0]", command_on: sim/lights/landing_lights_on, command_off: sim/lights/landing_lights_off }

# Checklist action map. Acts on universal-dataref systems; the SR22's own systems
# (dual battery/alternator, boost pump, off/left/right fuel selector) still
# verify/call-out until their tools are built — their verified datarefs are now
# known from the rustdecks deck.
checklist_map:
  - { match: parkbrake,        action: parking_brake }
  - { match: transponder_mode, action: transponder }
  - { match: pitot_heat_on,    action: pitot_heat }
  - { match: throttle_ratio,   action: throttle }     # throttle_ratio_all (universal)
  - { match: ENGN_mixt,        action: mixture }      # set_mixture writes mixture_ratio_all
  - { match: flap_handle,      action: flaps }        # set_flaps writes flap_ratio
  - { match: avionics_on,      action: !electrical avionics }  # batteries are compound → call-out
  - { match: nav_lights,       action: !light nav }
  - { match: strobe_lights,    action: !light strobe }
  - { match: landing_lights,   action: !light landing }
