# Aircraft profile — X-Plane stock Cirrus SR22 (Laminar).
#
# Built from the GoofyJP XChecklist file, the POH, and the rustdecks SR22 deck
# (the verified dataref/command source). Enabled tools write universal X-Plane
# datarefs or rustdecks-verified commands: dual battery/alternator, mixture,
# throttle, boost pump, key-start ignition, pitch trim, off/left/right fuel
# selector. Off: carb heat (fuel-injected) and the vacuum DG (G1000 glass).

id: cirrus_sr22
display_name: Cirrus SR22

# Which loaded aircraft this profile is for (detect::resolve): the ICAO
# alone is a TYPE, and two models of one type (the stock 737 and the Zibo
# both say B738) must never share a profile. Every key must hit. The acf
# entry is a substring of acf_relative_path: if the aircraft's folder is
# renamed, change it here (an unmatched model flies generic, said aloud).
match:
  icao: [SR22]
  acf: ["Laminar Research/Cirrus SR22/"]

# Capability flags — universal-dataref tools only, for now.
autopilot: true        # set_heading / set_altitude / set_vertical_speed (universal AP)
barometer: true        # set_barometer (universal)
com_radio: true        # set_com1
com2_radio: true       # set_com2 / swap_radio
nav_radio: true        # set_nav1 / set_obs
transponder: true      # set_transponder (universal transponder_mode)
ils: true              # prepare_ils
parking_brake: true    # set_parking_brake (universal parkbrake)
park_brake_valve_set: 1.0  # valve sense: 1 = SET on the SR22 — OPPOSITE of the C90
                           # (driving it C90-style read as an inverted handle)
pitot_heat: true       # set_pitot_heat (universal pitot_heat_on)

# Throttle/mixture/start write universal datarefs (throttle_ratio_all,
# mixture_ratio_all, the starter command) — confirmed against the rustdecks deck.
# (start_engine sets battery 1 + alternator 1 only; the SR22's BAT2/ALT2 need the
# dual-electrical tool.)
engine: true
# Dual battery + dual alternator + avionics. Datarefs/commands verified against
# the rustdecks SR22 deck. The pair keys ("batteries"/"alternators") switch both
# at once; "all" hits every system.
electrical:
  - { key: battery1,    spoken: battery one,       on_commands: [sim/electrical/battery_1_on],  off_commands: [sim/electrical/battery_1_off],  readback: ["sim/cockpit2/electrical/battery_on[0]"] }
  - { key: battery2,    spoken: battery two,       on_commands: [sim/electrical/battery_2_on],  off_commands: [sim/electrical/battery_2_off],  readback: ["sim/cockpit2/electrical/battery_on[1]"] }
  - { key: alternator1, spoken: alternator one,    on_commands: [sim/electrical/generator_1_on], off_commands: [sim/electrical/generator_1_off], readback: ["sim/cockpit2/electrical/generator_on[0]"] }
  - { key: alternator2, spoken: alternator two,    on_commands: [sim/electrical/generator_2_on], off_commands: [sim/electrical/generator_2_off], readback: ["sim/cockpit2/electrical/generator_on[1]"] }
  - { key: batteries,   spoken: both batteries,    on_commands: [sim/electrical/battery_1_on, sim/electrical/battery_2_on],   off_commands: [sim/electrical/battery_1_off, sim/electrical/battery_2_off],   readback: ["sim/cockpit2/electrical/battery_on[0]", "sim/cockpit2/electrical/battery_on[1]"] }
  - { key: alternators, spoken: both alternators,  on_commands: [sim/electrical/generator_1_on, sim/electrical/generator_2_on], off_commands: [sim/electrical/generator_1_off, sim/electrical/generator_2_off], readback: ["sim/cockpit2/electrical/generator_on[0]", "sim/cockpit2/electrical/generator_on[1]"] }
  - { key: avionics,    spoken: avionics master,   on_commands: [sim/systems/avionics_on],       off_commands: [sim/systems/avionics_off],      readback: [sim/cockpit/electrical/avionics_on] }

# Key-start ignition: set_magnetos writes the universal ignition_key
# (0 off/1 R/2 L/3 both/4 start); start_engine engages starter 1
# (sim/starters/engage_starter_1 — the command the rustdecks deck uses).
magnetos: true
carb_heat: false       # fuel-injected — no carb heat
# Boost pump: set_fuel_pump writes sim/cockpit2/engine/actuators/fuel_pump_on[0],
# the dataref the rustdecks deck drives for BOOST (not laminar/sr22/switch/
# boost_pump, which an earlier scaffold guessed).
fuel_pump: true
# Fuel selector: OFF / LEFT / RIGHT — no "both" (low-wing twin tanks, fed one at
# a time). Selector commands verified against the rustdecks deck. The standard
# sim/cockpit2/fuel/fuel_tank_selector (0=off/1=left/2=right) is the readback the
# GoofyJP checklist trusts, so it confirms a write and lets the checklist decode
# the file's `fuel_tank_selector:N` items. ("off" is quoted: bare off is YAML
# boolean false.)
fuel_selector:
  readback: sim/cockpit2/fuel/fuel_tank_selector
  positions:
    - { key: "off",  spoken: "off",  command: laminar/sr22/fuel_sel_left_off,     value: 0.0 }
    - { key: left,   spoken: left,   command: laminar/sr22/fuel_sel_left_select,  value: 1.0 }
    - { key: right,  spoken: right,  command: laminar/sr22/fuel_sel_right_select, value: 2.0 }
directional_gyro: false # G1000 glass — no vacuum DG to sync
flood_lights: false
pitch_trim: true       # set_pitch_trim writes universal elevator_trim; T/O = centred
retractable_gear: false

# Fuel-endurance alerting. SR22 ~92 gal usable, ~17 gal/hr cruise (~46 kg/hr). VERIFY.
fuel:
  reserve_caution_min: 45.0
  reserve_warning_min: 30.0
  cruise_burn_kg_hr: 46.0

# Clean stall (Vs) 70 KIAS; landing config (Vso) 60. Drives the airspeed monitor.
vs_clean_kts: 70.0

# Never-exceed speed (Vne), KIAS — drives the monitor's overspeed callout.
vne_kts: 204.0

# Static reference figures recited on request, from the X-Plane Cirrus SR22
# Pilot's Operating Manual (the modeled aircraft is the turbo TSIO-550-K,
# ceiling 25,000 ft). Vne and clean stall live above (the monitor uses them).
reference:
  kind: single-engine aircraft
  vno_kts: 178.0
  va_kts: 133.0
  vx_kts: 88.0
  vy_kts: 101.0
  vr_kts: 73.0
  # A light single lifts its nose briskly: at the airline 2.5 deg/s from the
  # roll's -1.75 the SR22 took 6.2 s from Vr to lift off at 99.5 KIAS, 5.9 m
  # of drift in those seconds (LEMG 12 1790690995, 2026-09-29).
  rotate_rate_deg_s: 5.0
  best_glide_kts: 88.0
  vs0_kts: 60.0
  max_crosswind_kts: 21.0
  cruise_kts: 180.0          # normal cruise (manual lists 213 KTAS max)
  best_climb_fpm: 1200.0
  max_gross_lb: 3600.0
  empty_weight_lb: 2354.0
  useful_load_lb: 1260.0
  service_ceiling_ft: 25000.0
  fuel_capacity_gal: 92.0
  endurance_hours: 5.0       # 92 gal / ~18 gph
  max_rpm: 2700.0

# Flaps 0 / 50% / 100% (Vfe 150 / 110 KIAS). set_flaps writes the universal
# flap_ratio. Detent ratios: VERIFY.
flaps:
  detents:
    - { label: up,   spoken: up,            ratio: 0.0 }
    - { label: "50", spoken: fifty percent, ratio: 0.5, vfe_kts: 150.0 }
    - { label: full, spoken: full,          ratio: 1.0, vfe_kts: 110.0 }

# THE FLARE (issue #166; LEMG 13, sortie 1790619465, 2026-09-28): on the
# 172's tracker this elevator answers hard and late. The arrest took the
# servos at 51 ft sinking 476 fpm, pulled 0.14 and had the sink at +10 by
# 45 ft, then PUSHED 0.10 (the roundout is free both ways) and the sink
# rebuilt to -471 at 28 ft; the same again to -52; then the flare's full
# 0.35 at 22 ft met the step to idle a dead time later (-528 at 12 ft),
# ballooned to +298 at 22 ft, was let go to neutral in one tick, and the
# sink it rebuilt met the runway at -585 fpm (575 on the scorecard).
# Fitted with the servos out to that arrest and flare (38 ticks, 39 fpm
# rms, the lever and the speed carried as the plant's own terms): 10,000 fpm
# of standing sink per unit of pull through two 1.45 s lags after 0.9 s of
# dead time; at idle with full flap the speed bleeds 2.7 kt a second, and
# each knot lost is about 115 fpm more sink. So:
#   * the arrest is flown on a model of this elevator, as the SF50's and the
#     737's are, declared under every fit's gain but the arrest's (6,000
#     through 1.0 s lags after 0.8 s) so it pulls for the weakest;
#   * the lever stays at approach power through the flare until a second
#     from the wheels, then walks off at 0.03 a second (a float still takes
#     it off): cut at the flare gate, the lift the flare flies on has gone
#     before the column's dead time is out.
# Through every fitted plant from five gates: every calm landing under 300
# fpm (the worst 273; the fitted model 291), under 400 in 40 fpm rms of
# gusts (353); the model with the lever cut at the gate past 300, the
# tracker as flown past 400 (1,267, a float that stalled onto the runway).
# VERIFY: blackbox `flare_ask`, `flare_unexplained`, `flare_elev` against
# `vvi` from `arrest_hands`, the `power` events' `retard` key, and the
# landing's `sink_fpm` under 300.
flare_elevator:
  gain: 1.0
  max: 0.35
  max_push: 0.05
  balloon_ease_per_s: 0.15
  model:
    fpm_per_elevator: 6000.0
    lag_s: 1.0
    dead_s: 0.8
flare_power:
  reduction_per_second: 0.03
  retard_max_per_s: 0.03
  retard_at_s: 1.0

# XChecklist file to interpret (GoofyJP, read-only).
# Taxi steering. The nosewheel CASTORS: the yoke-heading channel (nosewheel
# + rudder) has only prop wash behind it at taxi speed, and measured over the
# blackbox the yaw response per unit of steer is 2.3 deg/s here against 12.8
# on the 172 the shared law was tuned on. Without this block the first LEMG
# taxi (2026-09-12) held full steer for forty seconds for about one degree
# per second, then the turn came in late and overshot: a +/-20 m weave down
# Bravo and a 25 m off-route stand-down. Same plant signature as the SF50,
# so the same medicine, carried over as a first pass: differential brakes
# through the plugin channels (the way the real aircraft is steered), a long
# aim, twice the yaw-rate lead, gentler full-scale, a slew clip. Pace stays
# the GA default. RE-FLY: if it wanders wide instead of weaving, walk
# steer_full_deg back first.
taxi:
  steer_full_deg: 42.0
  steer_slew_per_s: 0.8
  steer_lead_s: 2.0
  lookahead_s: 9.0
  brake_steer: true

# The takeoff roll's rudder (autotakeoff::RollSteer), fitted to LEMG 13
# 2026-09-29 (sortie 1790677606): the sim's yaw rate against the steer, 15 kt
# to 73 kt, 31 deg/s per unit at 60 kt growing as v^2, and a STANDING rudder
# of 0.35 at full power from 30 kt (0.25 to 0.3 below it) in 0.6 kt of wind:
# the propeller. The default law led 0.25 at a standstill fading to 0.1 by
# 40 kt and its trim bled as 1/v^2, so the nose sat 5 to 6 degrees left with
# the steer at 0.4 and the roll was rejected 9.8 m left at 66 kt.
#
# Flown so (LEMG 13 1790682305, 2026-09-29, about 3 kt of crosswind from the
# left): the need was 0.5 from 45 to 75 kt, then fell to 0.2 by 88 kt as the
# nose came up, while the lead held 0.35 and the trim 0.14; at 0.032 of steer
# per degree the nose swung 5 degrees right with the steer still right, from
# 4.1 m left at 68 kt to 7.5 m right at wheels-off (93 kt). Refitted over
# both rolls (three-second heading predictions, 0.3 s dead time): the rudder
# is 31 to 50 deg/s per unit at 60 kt growing nearer v than v^2 above it, so
# the standing rudder is believed to the 73 kt it was measured at and falls
# as v^2 past it, the heading closes at 1.5 per second and the trim's corner
# is 0.45: replayed, both rolls stay within 3 m to wheels-off on the rudder
# at half to twice either fit and 0.08 of need either way.
roll_rudder:
  yaw_dps: 31.0
  at_kts: 60.0
  power_steer: 0.35
  power_steer_to_kts: 73.0
  close_per_s: 1.5
  trim_per_s: 0.45

# The rotation's elevator on the wheels (autotakeoff::RotatePitch, #184),
# fitted to three LEMG 13 rotations of 2026-09-29 (1790682305 at a 0.25 s
# tick, 1790690995 and 1790694884 at 0.4 s): the column the law wrote,
# replayed from the ticks, against the attitude to 5 degrees, 0.35 degree
# rms. On the wheels the nose turns 29 deg/s per unit of column past the
# breakout (0.104 at 90 kt, as 1/v^2) plus 0.033 per degree it is already
# up: the tail's spring, as stiff as the law's own P, so the nose stopped at
# 3 degrees and lifted off at 98 to 100 KIAS each time, rotate 73.
#
# Flown fed forward (1790699819, 2026-09-29): wheels off at 81.4 KIAS 1.4 s
# after Vr, then the model dropped to a flat 0.164 "flying" hold and the nose
# fell 5.0 to 3.0; floating in ground effect, the 8 ft liftoff came at 94.7.
# The spring is on the wing's angle of attack, so it leaves only as the path
# comes up; ground effect holds the breakout until about half the span.
# There 0.31 held 4.6 degrees at 88 KIAS a few feet up (breakout plus
# spring); the 100 kt climbs hold 10 degrees on a 7 degree path with 0.1, the
# spring less 0.06 (`air_base`).
rotate_elevator:
  ref_kts: 90.0
  deg_s_per_unit: 29.2
  breakout: 0.104
  per_deg: 0.033
  air_base: -0.06
  ground_effect_ft: 20.0

# The rollout's brake split (autoland::RolloutBrakeSteer), fitted to LEMG 13
# 2026-09-29 (sortie 1790689843-approach, calm, the iMac's 0.46 s loop): the
# wheel difference turns the nose 15 to 30 deg/s per unit after 0.5 to
# 0.6 s, the rudder at idle next to nothing, and above 40 kt the windmilling
# propeller yaws it right at about 1.3 deg/s. The shared law (0.03 per
# degree, no trim) held that off only 3 degrees right of its target: 0.08 of
# difference for ten seconds from 75 kt and 1.2 m to 9.1 m right of the
# centreline. More gain rings through the delay at this tick (0.06 per degree
# swung +/-4 degrees in the replay), so the gain comes down a little, the
# lead covers the delay plus half a tick, and a trim learns the standing
# split: replayed through the record, 2.5 m at the fitted plant and 2.3 to
# 3.4 m at 10 to 35 deg/s per unit and 0.4 to 0.8 s of delay, and the
# 2026-09-28 rollout (#166) inside 2.9 m from 10 to 90.
#
# Flown so (LEMG 13 1790694457, 2026-09-29): 9.4 m, and below 35 kt the
# split went wheel to wheel at 0.39 every tick, the nose +/-7 degrees. Both
# rollouts had latched on a bounce (the latch now leaves the brakes off in
# the air, autoland `BounceHold`), so the fit above was mostly air. On the
# wheels alone (both sorties' ground ticks, two-tick predictions of heading
# and track): 45 deg/s per unit after 0.4 to 0.5 s, the nose weathervaning
# onto the track at 2 to 6 per second at 60 kt (as v^2), the track following
# the nose at 2 to 3 per second. Nothing damps the heading at taxi speed but
# the law, so the gain follows the speed (0.02 per degree at 40 kt, 0.4 of
# it at 16 kt and under, 1.5 times at 60 and over) and the lead's rate is
# smoothed over 0.25 s. Replayed (air phase flown by the arrest's wings, no
# brake): 1790689843 4.5 m (4.2 to 5.0 over the fitted plants), 1790694457
# 7.6 m (the bounce's own drift before the wheels), its ground heading span
# 4.5 to 7.5 degrees where the old numbers swung 10 to 22.
rollout_brakes:
  per_deg: 0.02
  lead_s: 0.8
  rate_tau_s: 0.25
  gain_ref_kts: 40.0
  gain_min: 0.4
  gain_max: 1.5
  trim_per_s: 0.6
  trim_max: 0.15

checklist: checklists/cirrus_sr22.txt

# Lights — datarefs verified against the rustdecks SR22 deck; universal commands.
lights:
  - { key: nav,     spoken: nav lights,    dataref: sim/cockpit2/switches/navigation_lights_on,   command_on: sim/lights/nav_lights_on,     command_off: sim/lights/nav_lights_off }
  - { key: strobe,  spoken: strobe lights, dataref: sim/cockpit2/switches/strobe_lights_on,        command_on: sim/lights/strobe_lights_on,  command_off: sim/lights/strobe_lights_off }
  - { key: landing, spoken: landing light, dataref: "sim/cockpit2/switches/landing_lights_switch[0]", command_on: sim/lights/landing_lights_on, command_off: sim/lights/landing_lights_off }

# Checklist action map. Acts on universal-dataref systems plus the now-wired
# boost pump, key-start ignition, pitch trim and the off/left/right fuel selector
# (decoded from the profile's position values). The dual battery/alternator stay
# call-out — their file conditions are compound &&.
checklist_map:
  - { match: parkbrake,        action: parking_brake }
  - { match: transponder_mode, action: transponder }
  - { match: pitot_heat_on,    action: pitot_heat }
  - { match: throttle_ratio,   action: throttle }     # throttle_ratio_all (universal)
  - { match: ENGN_mixt,        action: mixture }      # set_mixture writes mixture_ratio_all
  - { match: flap_handle,      action: flaps }        # set_flaps writes flap_ratio
  - { match: avionics_on,      action: !electrical avionics }  # batteries are compound → call-out
  - { match: nav_lights,       action: !light nav }
  - { match: strobe_lights,    action: !light strobe }
  - { match: landing_lights,   action: !light landing }
  - { match: boost_pump,         action: fuel_pump }    # set_fuel_pump → fuel_pump_on[0]
  - { match: ignition_key,       action: ignition }     # actuators/ignition_key: 4=start, 0=off
  - { match: ignition_on,        action: ignition }     # mag test: 1=R, 2=L, 3=both
  - { match: elevator_trim,      action: pitch_trim }   # "set T/O" → centre (not ail_trim)
  - { match: fuel_tank_selector, action: fuel_selector } # 0=off/1=left/2=right

# Cockpit geography — answers "where is the X?" deterministically. Seeded from the
# POM's layout section (console items are POM-verified); grow as verified live.
locations:
  fuel selector: "on the centre console between the seats, behind the throttle"
  parking brake: "the lever on the centre console. Pull toward you for on, push away for off"
  alternate air: "on the centre console next to the parking brake lever"
  switch panel: "the bolster panel on the pilot's left, below the instrument panel: starter key, batteries, alternators, avionics and lights"
  battery switches: "on the left bolster switch panel: BAT 1 and BAT 2"
  alternator switches: "on the left bolster switch panel, next to the battery switches"
  starter key: "leftmost on the bolster switch panel, the rotary magneto and start key"
  flaps: "the flap switch on the centre console, with UP, 50 percent and 100 percent detents"
