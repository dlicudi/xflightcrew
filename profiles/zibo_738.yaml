# Takeoff and climb thrust flown to N1 as a crew sets it
# (`crate::takeoff_thrust`). The levers at 1.0 gave 104 % N1 (LEMG 13,
# 2026-10-07), above even the 26K figure (98.0 at 15 C on the field): the
# 43 to 48 t aircraft climbed 4,600 to 4,700 fpm at 167 to 169 kt into the
# autopilot's engage. The rating is chosen for the weight, lightest first:
# 22K under 60 t, 24K under 70 t, else 26K. The FMC chooses nothing (its
# `N1_mode_to_sel` is the crew's pick); the line is drawn where each derate
# keeps the thrust for its weight of the full rating at 71 to 76 t
# (22/60 = 26/70.9, 24/70 = 26/75.8), a normal heavy takeoff for the 26K,
# and a light 26K is Vmcg-bound besides: its flaps 5 V1 at 40 to 45 t (101
# to 109) sits on its V1(MCG) of 104 at sea level, where the 22K's V1 of
# 104 at 40 t clears its own 96 (`v1_dry`, `v1_mcg`, `v1_mcg_22k`). A derate whose longer roll (in
# thrust's proportion, `klbf`) no longer fits the runway gives way to the
# next. The N1 tables are the aircraft's own FMC's (B738.calc.lua
# `takeoff_thrust[26|24|22]` by OAT and pressure altitude, packs on, and
# `climb_thrust` by TAT), read bilinear as it reads them. The lever is led
# on the line from idle (about 20 %) to 104 % at 1.0 and trimmed on the
# measured N1 once the engines have settled. On a runway with room for the
# most an assumed temperature can take (a quarter of the thrust), the
# rating is reduced further as the FMC computes it: the highest assumed
# temperature (`assumed_max_temp`, whole degrees, over the flat-rated
# `assumed_min_temp` and the OAT), the N1 at it (`takeoff_thrust_red`) less
# the correction for its distance above the OAT (`takeoff_adj_red`; its 99s
# are no figure). 44 t at LEMG (50 ft), 15 C: 22K, assumed 60, N1 86.1.
