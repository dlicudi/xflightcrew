# Aircraft profile: the Zibo 737-800X (B738), v4.05.35.
#
# A DRAFT, written 2026-10-06 from the aircraft's own files and probed
# read-only against the live sim (parked, cold and dark). Nothing below has
# been pressed, written or flown. Every name was looked up on the Web API and
# exists (dataref or command); whether it DOES what this file says is a
# hypothesis until a ground test reads it back. Lines marked VERIFY are the
# ones to test first.
#
# WHY THIS IS NOT THE STOCK 737's PROFILE. Both say B738, but the Zibo is a
# different machine under the same skin:
#   - Its systems live in a binary plugin (`plugins/zibomod`, about 7,400
#     laminar/B738 names) plus xlua (`B738.glaresheild`, `B738.a_fms`,
#     `B738.calc`, `B738.zz.sim_cockpit`). The stock 737's `B738.systems.lua`
#     and its `condition_lever*_target`, `barometer/capt_setting` and
#     `sim/operation/auto_start` sequence do not exist here (probed missing,
#     or not replaced), so the stock profile's start, cutoff and baro paths
#     would all be silent no-ops.
#   - Its MCP is its own. The windows are `laminar/B738/autopilot/mcp_alt_dial`,
#     `mcp_hdg_dial` and `mcp_speed_dial_kts_mach` (created by
#     B738.glaresheild.lua:996-997, :802), copied into the stock dials only by
#     its own handlers (glaresheild.lua:3926, :7241, :7244). Probed parked:
#     stock airspeed_dial_kts_mach 210 against the MCP's 100, so the stock
#     speed window is NOT the MCP. The stock altitude and heading dials agree
#     with the MCP at load (200, 262) and may be the AP's internal targets.
#   - It holds the controls: probed parked, override_throttles,
#     override_joystick_pitch/roll/heading, override_toe_brakes and
#     override_wheel_steer all read 1, set by zibomod (the Lua only clears them
#     on unload, B738.zz.sim_cockpit.lua:1139-1148). Our plugin's pitch, steer
#     and brake channels raise and DROP those same overrides; dropping one
#     the Zibo holds may hand that axis to the raw joystick. Ground test
#     before any automation rolls this aircraft.
#
# Stock commands the aircraft REWRITES (B738_Commands.txt "Rewrite default
# commands", and replace_command in B738.glaresheild.lua:3535-3545, :3958):
# landing_gear_toggle/down/up, take_off_go_around, TOGA_power, the four
# brakes commands, autopilot altitude_up/down, heading_up/down,
# heading_sync, airspeed_up/down, obs_HSI_up/down (both sides), and
# landing_lights_on/off/toggle. zibomod also names the stock speed_brakes_*,
# flaps_up/down, pitch_trim*, thrust_reverse_*, nav_lights_on/off,
# strobe_lights_on/off, generator_*_on/off, APU_* and GPU_* commands (a
# string in the binary; replaced or merely fired is not knowable from the
# file).
#
# Figures: the -800's placards are the type's (the stock profile's, from its
# POM), the weights and fuel from this aircraft's `b738_4k.acf` (empty
# 92,670 lb, max 174,700 lb, fuel 46,062 lb, nine flap positions). The acf's
# own Vs 110 / Vso 100 / Vne 400 are not the placards and are not used.
# Everything the stock profile FITTED to the Laminar 737's flight model and
# autopilot (roll rudder, flare model, idle decel per flap) is left out: this
# is another flight model (zibomod writes its own surfaces) and another
# autopilot, so those numbers are not this aircraft's. The roll rudder has
# since been fitted to this one (`roll_rudder:` below).

id: zibo_738
display_name: Zibo 737-800

# The Zibo says B738 like the stock 737; the folder tells them apart. If the
# aircraft's folder is renamed, change the acf entry (an unmatched model
# flies generic, said aloud). The acf's `_author` is "Alex Unruh", the same
# as the stock 737's, so it cannot be a second key.
match:
  icao: [B738]
  acf: ["B737-800X/"]

# Capability flags.
# The autopilot tools write the STOCK dials (heading_dial_deg_mag_pilot,
# altitude_dial_ft, vertical_velocity) and read the stock autopilot_state
# bitfield. Neither is this MCP's own (see the header). Kept on so the
# copilot can try and READ BACK; expect "did not take" until the owner can
# write the Zibo's mcp_* windows. VERIFY first thing on the ground.
autopilot: true
# The throttle write moves the engines (LXGB 2026-10-07: lever 1.0 gave
# 104 % N1, the 0.9 reduction took).
throttle: true
# zibomod snaps its levers to the HARDWARE lever on any twitch of it (the
# tablet's THROTTLE NOISE LOCK, laminar/B738/fms/throttle_noise, is OFF
# here): LEMG's takeoff read the levers at the hardware's 0.28 against 0.535
# and handed back a standing aircraft as "your throttle". A yield needs this
# axis to move too.
throttle_hardware_axis: laminar/B738/axis/throttle1
# The `autothrottle` tool is written against laminar/md82 names.
autothrottle: false
# Probed 2026-10-06: a stock speedbrake_ratio write STICKS but the Zibo's
# lever (flt_ctrls/speedbrake_lever) never moves, so a write's readback would
# lie. The stock speed_brakes_down_one / up_one commands drive the lever
# (down_one from DOWN is ARMED, lever 0.089, the speedbrake_armed lamp; up_one
# back to 0). So the lever is STEPPED by those commands and read back from
# itself (`speedbrake_lever:` below), and speedbrake_ratio is never written:
# the tool, the takeoff config's DOWN, the reject, arm-for-landing and the
# descent drag all go through that one seam.
speedbrake: true
speedbrake_lever:
  more: sim/flight_controls/speed_brakes_down_one
  less: sim/flight_controls/speed_brakes_up_one
  readback: laminar/B738/flt_ctrls/speedbrake_lever
  down: 0.0
  armed: 0.089
  # VERIFY: the flight detent's lever value (the 737's lever runs ARMED,
  # FLIGHT DETENT, UP); 0.667 is a hypothesis. A notch past it stops at the
  # nearest, never hunts back and forth.
  flight: 0.667
  full: 1.0
# The Zibo's reversers are its own levers (flt_ctrls/reverse_lever1/2) under
# override_throttles. Probed parked 2026-10-07, engines idle, brake set: a
# stock beta write of -1.5 read straight back 0 (undone), while HOLDING
# sim/engines/thrust_reverse_hold deployed them (0.69, then 1.0), ran the
# lever 0.09 to 0.71 and N1 19 to 70 % in about 3 s, and released stowed
# them. So reverse is that command, held (`tools::reverse`, re-held each
# second while due). Unflown.
reverse_thrust: true
rollout_reverse: true
reverse_hold_command: sim/engines/thrust_reverse_hold
# Released with the lever left at reverse idle (0.06, beta -1) the
# reversers stayed deployed, engines running and 2,900 psi on both systems;
# written down they stowed within 4 s (conform, parked, 2026-10-07).
reverse_stow_levers: [laminar/B738/flt_ctrls/reverse_lever1, laminar/B738/flt_ctrls/reverse_lever2]
# The Zibo owns its altimeters. Probed parked 2026-10-06: a stock dial write
# is undone, `laminar/B738/EFIS/baro_sel_in_hg_pilot` is read-only (HTTP 400),
# the stock `sim/instruments/barometer_up` does nothing, and ONE press of its
# own `laminar/B738/pilot/barometer_up` is a hundredth (29.92 to 29.93), the
# stock dial following. So the knob is stepped on its own commands. No STD
# fast path: its two-press behaviour is the stock 737's, unproven here.
altimeter:
  knob:
    up: laminar/B738/pilot/barometer_up
    down: laminar/B738/pilot/barometer_down
    copilot_up: laminar/B738/copilot/barometer_up
    copilot_down: laminar/B738/copilot/barometer_down
barometer: true
pitch_trim: true       # stock elevator_trim; zibomod names the stock trim commands. VERIFY
com_radio: true        # stock COM/NAV datarefs (the pilot's cockpitdecks reads them)
com2_radio: true
nav_radio: true
transponder: true
ils: true              # NAV1 tune and the needles are stock
# Not coupled on the old path (our own flare after a decouple): the Zibo
# LANDS on its own autopilot instead (`autopilot_lands`, below).
ils_coupled: false
# Its own APP button, created in zibomod (B738_Commands.txt). VERIFY: the
# setup reads the stock approach status after pressing it.
approach_command: laminar/B738/autopilot/app_press

# The MCP buttons, all the aircraft's own (zibomod; B738_Commands.txt
# "glareshield.lua" block; the same names the pilot's cockpitdecks MCP page
# presses). CMD B is never named here (stock 737 lesson, LEMG 2026-10-05):
# only as the landing's second channel, `autopilot_lands` below.
# Since 2026-10-07 the owner reads this MCP's own lamps and writes its own
# windows (below, `lamps:` and `windows:`). Blackbox `autoflight` `press`,
# `switch`, `knob` and `ap_state`.
autoflight:
  engage_command: laminar/B738/autopilot/cmd_a_press
  heading_command: laminar/B738/autopilot/hdg_sel_press
  vs_command: laminar/B738/autopilot/vs_press
  altitude_hold_command: laminar/B738/autopilot/alt_hld_press
  # LNAV button and its lamp (B738_Datarefs.txt "AUTOPILOT LIGHTS"); the lamp
  # is the read the follower trusts before pressing this toggle.
  lnav_command: laminar/B738/autopilot/lnav_press
  lnav_status: laminar/B738/autopilot/lnav_status
  # Boeing MCP: a V/S only toward the window (the stock 737's measured
  # behaviour; the Zibo's is unmeasured). VERIFY.
  vs_toward_window: true
  # ---- The Zibo's own MCP through the panel owner (autoflight.rs) ----------
  # Probed parked 2026-10-07 (battery only, engines off, park brake set),
  # every press undone after: the stock modes do NOT follow this MCP.
  # HDG SEL, ALT HLD, LVL CHG and APP each lit their lamp (0 to 1) while
  # autopilot_state stayed 132 and heading_status, vvi_status and
  # altitude_hold_status stayed 0. So the modes are READ from the lamps
  # (`lamps:`), never the bitfield. On the ground each mode button is a
  # toggle (a second press put the lamp out); LVL CHG put ALT HLD out. V/S
  # would not engage on the ground (lamp stayed 0), so its lamp, its wheel
  # and every engaged-in-flight behaviour are unflown.
  engage_status: laminar/B738/autopilot/cmd_a_status
  # The yoke's A/P disengage, never the MCP bar (`disconnect_toggle`): a
  # bar left down blocks every later CMD A. VERIFY in the air.
  disconnect_command: laminar/B738/autopilot/capt_disco_press
  level_change_command: laminar/B738/autopilot/lvl_chg_press
  lamps:
    heading: laminar/B738/autopilot/hdg_sel_status
    vs: laminar/B738/autopilot/vs_status
    altitude_hold: laminar/B738/autopilot/alt_hld_status
    level_change: laminar/B738/autopilot/lvl_chg_status
    # Lit armed OR captured: APP lit with nothing tuned on the ramp.
    approach: laminar/B738/autopilot/app_status
    vorloc: laminar/B738/autopilot/vorloc_status
    vnav: laminar/B738/autopilot/vnav_status1
    speed: laminar/B738/autopilot/speed_status1
    n1: laminar/B738/autopilot/n1_status
  windows:
    # Written 270 and 5,000: read back, and the stock dials followed within
    # a second. The stock dials written 100 and 3,000 were put back to the
    # MCP's values: a stock dial write here is a silent no-op.
    heading:
      write: laminar/B738/autopilot/mcp_hdg_dial
      # Whole degrees only: in flight 295 took and 295.4 was refused (the
      # window stayed 296), so every fractional correction down LEMG 30's
      # final was thrown away and both approaches went around 28 to 34 m
      # off the centreline (2026-10-07). Snapped to the nearest degree.
      step: 1.0
    altitude:
      write: laminar/B738/autopilot/mcp_alt_dial
    # The speed window undoes a write (150 read back 100). The stock
    # airspeed_up the glareshield Lua replaces steps it a knot (its own
    # handler, B738.glaresheild.lua:3958), but cold the window stayed 100
    # (the stock dial took 101). VERIFY powered: the knob is the hypothesis.
    airspeed:
      up: sim/autopilot/airspeed_up
      down: sim/autopilot/airspeed_down
      step: 1.0
      readback: laminar/B738/autopilot/mcp_speed_dial_kts_mach
    # B738_Datarefs.txt names the stock VVI dial as the MCP's. Written -500
    # with V/S off it read 0 (blanked, as a 737's is). VERIFY in V/S.
    vs:
      write: sim/cockpit2/autopilot/vvi_dial_fpm
      # The wheel keeps 50s: 287 read back 250, 324 read 300, every climb
      # write "unconfirmed" (LXGB 2026-10-07). Snapped to the nearest first.
      step: 50.0
    # The MCP course windows: the glareshield Lua writes NAV1's OBS from
    # `course_pilot` until the localiser captures (B738.glaresheild.lua:3598),
    # so a stock OBS write is undone. Its knob commands step a whole degree
    # (`up_dn_crs1_dial`, mode 0; held or fast repeats accelerate, mode 2).
    # VERIFY parked (`xfc conform --only mcp`): knob, or a write.
    # The course windows take a WRITE (probed in flight 2026-10-07: 311
    # written, 311 read). Knob-stepped they could not reach the ILS: the
    # 120-press cap left the captain's at 251 for a 311 course (from 131) and
    # the first officer's at 120 for 131, the tune read back wrong and the
    # coupled approach never armed. Whole degrees.
    course:
      write: laminar/B738/autopilot/course_pilot
      step: 1.0
    course_fo:
      write: laminar/B738/autopilot/course_copilot
      step: 1.0
  # The switches, each a toggle read before it is fired. FD: the toggle
  # moved flight_director_pos 0 to 1 (master_capt_status and pfd_fd_cmd 1;
  # the stock flight_director_mode stayed 0; fd_ca stayed 0) and back.
  flight_director:
    command: laminar/B738/autopilot/flight_director_toggle
    position: laminar/B738/autopilot/flight_director_pos
  flight_director_fo:
    command: laminar/B738/autopilot/flight_director_fo_toggle
    position: laminar/B738/autopilot/flight_director_fo_pos
  # A/T arm: the toggle did NOT move autothrottle_arm_pos on battery power
  # (the arm switch is solenoid-held; the stock autothrottle_enabled stayed
  # 0). VERIFY powered. An ENGAGED A/T (SPEED or N1 lamp) is taken out by
  # the A/T disengage button: it drops the arm too, never "armed, no mode".
  autothrottle_arm:
    command: laminar/B738/autopilot/autothrottle_arm_toggle
    position: laminar/B738/autopilot/autothrottle_arm_pos
  autothrottle_off_command: laminar/B738/autopilot/left_at_dis_press
  # TO/GA (the Zibo also rewrites sim/autopilot/take_off_go_around): with
  # the A/T armed it sets the takeoff N1 (Skymatix Zibomod checklist
  # C-0030: 40 % N1, stable, then TO/GA). Declared and probed; nothing
  # presses it yet.
  toga_command: laminar/B738/autopilot/left_toga_press
  # A/T SPEED (B738_Commands.txt), read on `lamps.speed` before it is
  # pressed. Pressed only by `autopilot_lands`. Unflown.
  speed_command: laminar/B738/autopilot/speed_press
  # ---- end of the Zibo's own MCP ------------------------------------------

# ---- The autopilot lands it (`ap_lands`), the crew monitors -------------
# An ILS landing as a 737 crew flies it: APP armed from below the beam,
# both captures read on the FMA, CMD B after G/S for a dual approach, its
# own flare, retard and rollout; our crew calls, watches the gates, takes
# reverse and brakes, disconnects at taxi speed. UNFLOWN (2026-10-07).
# The FMA codes are the PFD's own images (b738.acf `SHOW_EQUAL`, captain's
# element [0]): roll 1 HDG SEL, 2 VOR/LOC, 3 LNAV, 4 ROLLOUT, 5 FAC, 6 B/CRS;
# roll armed 1 VOR/LOC, 2 ROLLOUT, 3 LNAV; pitch 1 V/S, 2 MCP SPD, 3 ALT ACQ,
# 4 ALT HOLD, 5 G/S, 6 FLARE, 7 G/P, 8-10 VNAV, 11 TO/GA; pitch armed 1 G/S,
# 2 V/S, 3 FLARE, 4 G/P, 5 VNAV, 6 G/S+V/S; thrust 1 ARM, 2 N1, 3 MCP SPD,
# 4 FMC SPD, 5 GA, 6 THR HLD, 7 RETARD; pfd_land23 1 LAND 2, 2 LAND 3;
# autoland/fail_flag 2 NO LAND 3, 3 NO AUTOLAND. The rest are zibomod's
# names, logged raw for the probe flight (blackbox `autoland` `coupled_tick`).
autopilot_lands:
  second_cmd:
    command: laminar/B738/autopilot/cmd_b_press
    position: laminar/B738/autopilot/cmd_b_status
  fma:
    roll: laminar/B738/autopilot/pfd_hdg_mode[0]
    roll_armed: laminar/B738/autopilot/pfd_hdg_mode_arm[0]
    pitch: laminar/B738/autopilot/pfd_alt_mode[0]
    pitch_armed: laminar/B738/autopilot/pfd_alt_mode_arm[0]
    thrust: laminar/B738/autopilot/pfd_spd_mode[0]
    land: laminar/B738/autopilot/pfd_land23
    log:
      - laminar/B738/autopilot/autoland_status
      - laminar/B738/autopilot/no_autoland
      - laminar/B738/autoland/fail_flag
      - laminar/B738/autopilot/flare_status
      - laminar/B738/autopilot/rollout_status
      - laminar/B738/autopilot/single_ch_status
  codes:
    loc: [2]
    rollout: [4]
    gs: [5]
    flare: [6]
    toga: [11]
    flare_armed: [3]
    speed: [3]
    retard: [7]
    land: [1, 2]
  # Both receivers on the ILS for the dual channel.
  nav2: true
  # The A/T in SPEED on the MCP window (the window's knob is a hypothesis:
  # `windows.airspeed`); it retards at the flare (thrust 7).
  autothrottle: true
  # A 737 arms FLARE at 1,500 ft radio with both channels in.
  dual_by_agl_ft: 1500.0
  land_by_agl_ft: 1000.0
  own_flare_below_agl_ft: 200.0
  disconnect_kts: 30.0
  rollout_xtk_limit_m: 10.0

parking_brake: true
# The Zibo owns its parking brake. Probed stopped 2026-10-06: a stock ratio
# write is undone at once, `park_brake_set` nudged the ratio to 0.54 and the
# script put it back to 0 (the reject said "parking brake set" and the
# aircraft rolled to 20 kt); `brakes_toggle_max` (rewritten by the Zibo) sets
# its own `parking_brake_pos` and the stock ratio follows it.
park_brake_toggle:
  command: sim/flight_controls/brakes_toggle_max
  position: laminar/B738/parking_brake_pos
# Two CFM56s spool for seconds after the lever is up: rejected as stagnant
# 6 s after the lever reached takeoff power at EGHL (2026-10-06).
takeoff_spool_s: 8.0
retractable_gear: true
# The stock gear commands are the Zibo's own (B738_Commands.txt "Rewrite
# default commands": up = UP, down = "off, down", so a down from UP takes two
# presses). Its own buttons go straight there: `push_button/gear_up` and
# `gear_down` (B738_Commands.txt, the same commands its sim_cockpit Lua
# fires). The lever is `controls/gear_handle_down`, 0 UP, 0.5 OFF, 1 DOWN
# (B738.zz.sim_cockpit.lua:736-751; probed parked 1.0 with the stock handle
# 1). `switches/landing_gear` is a cockpit builder's INPUT, not the lever (it
# reads 0 parked). The tool and every loop press these and read the handle
# back; the legs (deploy_ratio) are blackboxed `gear`. VERIFY in the air.
gear_by_command: true
gear_commands:
  up: laminar/B738/push_button/gear_up
  down: laminar/B738/push_button/gear_down
  handle: laminar/B738/controls/gear_handle_down
  handle_up: 0.0
  handle_down: 1.0
cabin_crew: true       # 189 seats and an interphone
pressurised: true
engines: 2

# ENGINE START: the Boeing shape (`boeing_start`, `jet_start::BoeingStart`).
# None of the older shapes fits: there is no scripted start here
# (`sim/operation/auto_start` is not replaced, so it would be X-Plane's
# generic start under the Zibo's systems), the MD-82 sequence is laminar/md82,
# and `airliner_start` is an Airbus ENG MODE knob plus a master ARRAY.
# The steps are the aircraft's own checklist's (clist.txt ENGINE START &
# PUSHBACK): ENGINE START SWITCH 2 GROUND (`starter2_pos` 0), START LEVER 2
# IDLE reaching 25 % N2 (`mixture_ratio2` 1), monitor EGT, STABLE when the
# starter is back at AUTO (`starter2_pos` 1, the knob springs back at about
# 56 % N2), then engine 1 the same. Starter positions 0 GRD 1 AUTO/OFF 2 CONT
# 3 FLT (B738_Datarefs.txt). Every name probed 2026-10-06 (parked, cold):
# the starters read 1, the levers 0, the duct pressures 0 (APU off), the
# Zibo's own N2 and EGT gauges 0 and 11 C. VERIFY the whole start on the
# ground: nothing here has been pressed.
turbine_start: false
auto_prep: false
scripted_auto_start: false
boeing_start:
  engines:
    - engine: 1
      starter_grd_command: laminar/B738/rotary/eng2_start_grd
      starter_off_command: laminar/B738/rotary/eng2_start_off
      starter_position: laminar/B738/engine/starter2_pos
      lever_idle_command: laminar/B738/engine/mixture2_idle
      lever_cutoff_command: laminar/B738/engine/mixture2_cutoff
      lever_position: laminar/B738/engine/mixture_ratio2
      n2: laminar/B738/engine/indicators/N2_percent_2
      egt: laminar/B738/engine/eng2_egt
    - engine: 0
      starter_grd_command: laminar/B738/rotary/eng1_start_grd
      starter_off_command: laminar/B738/rotary/eng1_start_off
      starter_position: laminar/B738/engine/starter1_pos
      lever_idle_command: laminar/B738/engine/mixture1_idle
      lever_cutoff_command: laminar/B738/engine/mixture1_cutoff
      lever_position: laminar/B738/engine/mixture_ratio1
      n2: laminar/B738/engine/indicators/N2_percent_1
      egt: laminar/B738/engine/eng1_egt
  # Start air from the APU bleed: the checklist only asks for the ducts to
  # be "working"; 25 psi is the type's minimum for a start. The APU and its
  # bleed are the pilot's (or the preflight flow's): this start refuses,
  # with the number, rather than turn a starter with no air.
  duct_pressure: [laminar/B738/indicators/duct_press_L, laminar/B738/indicators/duct_press_R]
  # The Zibo's APU bleed settles at 21 psi (39 only as it opens, probed
  # 2026-10-06); its clist asks only for pressure above 0.
  min_duct_psi: 15.0
  starter_grd: 0.0
  starter_released: 1.0
  lever_idle: 1.0
  lever_cutoff: 0.0
  fuel_on_n2: 25.0
  stable_n2: 55.0
  egt_start_limit_c: 725.0
  # Before the first starter: the beacon and the packs OFF (the checklist's
  # "ANTI COLLISION LIGHT ON", "LEFT & RIGHT AIR CONDITIONING PACKS OFF").
  # Packs are 0 OFF, 1 AUTO, 2 HIGH (B738_Datarefs.txt); `l_pack_up` is
  # taken to step toward OFF, as the stock 737's Lpack_up does
  # (B738.systems.lua:1393). VERIFY the direction: a wrong one reads back
  # and is named, never "Roger".
  # The APU from cold (probed by hand 2026-10-06, EGHL): battery ON is its
  # _dn; the left aft pump; the APU switch is a three-position knob
  # (`spring_toggle_switch/APU_start_pos` 0 OFF, 1 ON, 2 START, the clist's
  # name, NOT `switches/apu_start` which never moved), _dn one notch toward
  # START, START held 2 s and sprung back to ON. 21 % N1 a few seconds later,
  # 100 % in about 30 s. Its generators took only on a HELD press.
  apu_n1: sim/cockpit2/electrical/APU_N1_percent
  # The generators did NOT take 5 s after 100 % (LEMG 2026-10-07, both
  # NotTaken: no AC, so the yaw damper and nav lights failed after them);
  # a minute later they did. The blue APU GEN OFF BUS lamp is the crew's cue.
  apu_gen_ready: laminar/B738/annunciator/apu_gen_off_bus
  apu_steps:
    - { command: laminar/B738/switch/battery_dn, position: laminar/B738/electric/battery_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/fuel_pump_lft1, position: laminar/B738/fuel/fuel_tank_pos_lft1, want: 1 }
    - { command: laminar/B738/spring_toggle_switch/APU_start_pos_dn, down_command: laminar/B738/spring_toggle_switch/APU_start_pos_up, position: laminar/B738/spring_toggle_switch/APU_start_pos, want: 1 }
    - { command: laminar/B738/spring_toggle_switch/APU_start_pos_dn, held_secs: 2.0 }
  apu_power_steps:
    - { command: laminar/B738/toggle_switch/apu_gen1_dn, held_secs: 1.0, position: laminar/B738/electrical/apu_power_bus1, want: 1 }
    - { command: laminar/B738/toggle_switch/apu_gen2_dn, held_secs: 1.0, position: laminar/B738/electrical/apu_power_bus2, want: 1, say: "A.P.U. generators on." }
    - { command: laminar/B738/toggle_switch/bleed_air_apu, position: laminar/B738/toggle_switch/bleed_air_apu_pos, want: 1, say: "A.P.U. bleed on." }
  pre_start_steps:
    - { command: sim/lights/beacon_lights_on, position: sim/cockpit2/switches/beacon_on, want: 1 }
    - { command: laminar/B738/toggle_switch/l_pack_dn, down_command: laminar/B738/toggle_switch/l_pack_up, position: laminar/B738/air/l_pack_pos, want: 0 }
    - { command: laminar/B738/toggle_switch/r_pack_dn, down_command: laminar/B738/toggle_switch/r_pack_up, position: laminar/B738/air/r_pack_pos, want: 0, say: "Packs off." }
  # After both are stable (BEFORE TAXI): generators on, packs AUTO (right,
  # then left), the isolation valve back to AUTO from the preflight's OPEN,
  # APU bleed off, probe heat on (the Skymatix Zibomod checklist C-0030's
  # after-start order; its isolation CLOSE between the two engines is not
  # flown, this start has no step between engines). The APU itself is left
  # running for the pilot. Isolation valve probed 2026-10-07: 0 CLOSE,
  # 1 AUTO, 2 OPEN; `iso_valve_dn` steps UP (at 2 it does nothing),
  # `iso_valve_up` steps down. Probe heat `capt_probes_pos` / `fo_probes_pos`
  # are toggles under the same name as their position (0 to 1 probed).
  post_start_steps:
    - { command: laminar/B738/toggle_switch/gen1_dn, held_secs: 1.0, position: "sim/cockpit/electrical/generator_on[0]", want: 1 }
    - { command: laminar/B738/toggle_switch/gen2_dn, held_secs: 1.0, position: "sim/cockpit/electrical/generator_on[1]", want: 1, say: "Generators on." }
    - { command: laminar/B738/toggle_switch/r_pack_dn, down_command: laminar/B738/toggle_switch/r_pack_up, position: laminar/B738/air/r_pack_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/l_pack_dn, down_command: laminar/B738/toggle_switch/l_pack_up, position: laminar/B738/air/l_pack_pos, want: 1, say: "Packs auto." }
    - { command: laminar/B738/toggle_switch/iso_valve_dn, down_command: laminar/B738/toggle_switch/iso_valve_up, position: laminar/B738/air/isolation_valve_pos, want: 1, max_presses: 2 }
    - { command: laminar/B738/toggle_switch/bleed_air_apu, position: laminar/B738/toggle_switch/bleed_air_apu_pos, want: 0, say: "A.P.U. bleed off." }
    - { command: laminar/B738/toggle_switch/capt_probes_pos, position: laminar/B738/toggle_switch/capt_probes_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/fo_probes_pos, position: laminar/B738/toggle_switch/fo_probes_pos, want: 1, say: "Probe heat on." }

# Cutoff: the start levers, moved by their OWN commands (`mixture1_cutoff`,
# `mixture2_cutoff`, B738_Commands.txt calc.lua block), the same ones the
# start's abort fires. A write to `mixture_ratio1/2` (writable on the API)
# is not trusted on this aircraft: its flap and speedbrake writes proved to
# be outputs. The shutdown watches the engines down either way, so a lever
# that did not go is said, never "Roger".
fuel_cutoff_levers:
  - laminar/B738/engine/mixture_ratio1
  - laminar/B738/engine/mixture_ratio2
fuel_cutoff_commands:
  - laminar/B738/engine/mixture1_cutoff
  - laminar/B738/engine/mixture2_cutoff

# Jet: none of the piston systems apply.
engine: false
magnetos: false
carb_heat: false
fuel_pump: false
directional_gyro: false
# The Zibo's tanks are its own (nine stock tanks, the pumps its
# `laminar/B738/fuel/fuel_tank_pos_*` switches): the stock load sheet write
# has never been read back here, and `fuel_tank_pumps_off_when_empty` is
# left out because the stock pump array is not known to be the switch.
load_sheet: unprobed
pitot_heat: false      # the probe heat is the Zibo's own pair, below under anti_ice

# Anti-ice on the Zibo's own TOGGLES, one per switch, each read first from
# its own position (B738_Datarefs.txt "ANTI ICE SWITCHES", read/write
# positions; B738_Commands.txt antiice.lua toggles; the pilot's cockpitdecks
# anti-ice page). One entry per switch so a toggle is never fired on another
# switch's reading. VERIFY: each name is both a command and, for the
# probes, a dataref of the same string.
anti_ice:
  systems:
    - kind: pitot
      on_commands: [laminar/B738/toggle_switch/capt_probes_pos]
      off_commands: [laminar/B738/toggle_switch/capt_probes_pos]
      readback: laminar/B738/toggle_switch/capt_probes_pos
    - kind: pitot
      on_commands: [laminar/B738/toggle_switch/fo_probes_pos]
      off_commands: [laminar/B738/toggle_switch/fo_probes_pos]
      readback: laminar/B738/toggle_switch/fo_probes_pos
    - kind: engine
      on_commands: [laminar/B738/toggle_switch/eng1_heat]
      off_commands: [laminar/B738/toggle_switch/eng1_heat]
      readback: laminar/B738/ice/eng1_heat_pos
    - kind: engine
      on_commands: [laminar/B738/toggle_switch/eng2_heat]
      off_commands: [laminar/B738/toggle_switch/eng2_heat]
      readback: laminar/B738/ice/eng2_heat_pos
    - kind: wing_bleed
      on_commands: [laminar/B738/toggle_switch/wing_heat]
      off_commands: [laminar/B738/toggle_switch/wing_heat]
      readback: laminar/B738/ice/wing_heat_pos

# Electrical on the Zibo's own switches. Probed parked: the stock
# `battery_on` reads 1 while the Zibo's `laminar/B738/electric/battery_pos`
# reads 0, so the stock battery is NOT this switch. The battery sits under
# guard cover 02 (`cover_position[2]` reads 1 throughout). Probed parked
# 2026-10-06: `battery_dn` is ON (`battery_pos` 0 to 1, stock `battery_on`
# 1,0,0 to 1,1,1) and `battery_up` is OFF; the cover never had to move.
# The generator switches are spring-loaded ON/OFF (gen1_up / gen1_dn); on the
# real panel OFF is up and ON is down. Read back on the stock generator_on,
# which reads 0 parked with the engines off. VERIFY both directions.
# No avionics master on a 737.
electrical:
  - key: battery
    spoken: battery
    on_commands:  [laminar/B738/switch/battery_dn]
    off_commands: [laminar/B738/switch/battery_up]
    readback:     [laminar/B738/electric/battery_pos]
    guards:
      - { command: laminar/B738/button_switch_cover02, dataref: "laminar/B738/button_switch/cover_position[2]" }
  - key: generators
    spoken: generators
    on_commands:  [laminar/B738/toggle_switch/gen1_dn, laminar/B738/toggle_switch/gen2_dn]
    off_commands: [laminar/B738/toggle_switch/gen1_up, laminar/B738/toggle_switch/gen2_up]
    readback:     ["sim/cockpit/electrical/generator_on[0]", "sim/cockpit/electrical/generator_on[1]"]

# ---- PREFLIGHT (full auto, 2026-10-07) -------------------------------------
# The crew's preflight from a live battery to ready for the start
# (`preflight:`, `src/preflight.rs`), run by full auto between "Battery's on"
# and the ramp items. The order is the aircraft's own checklist's (clist.txt
# v9.0 PRELIMINARY FLIGHTDECK (1/3) to (3/3), PREFLIGHT PREPARATION (1/7) to
# (7/7)), cross-checked against the Skymatix Zibomod checklist C-0030. Every
# step is read before it is fired and read back; a switch already set is
# passed over. Directions probed by hand 2026-10-07 at EGHL, parked, brake
# set, battery only, each switch restored:
#   - IRS L `irs_L_right` steps `toggle_switch/irs_left` UP (0 OFF, 1 ALIGN,
#     2 NAV, 3 ATT), `irs_L_left` down; the alignment's truth is
#     `irs/irs_mode` (2 = NAV, B738.LATLON.lua). The R knob's commands are
#     taken to mirror the L's (not pressed: the sim closed mid-probe).
#   - A first alignment ends flashing ALIGN until a present position is
#     entered (B738.LATLON.lua): written to `FMS/irs_pos_fmc_set` as
#     `N5111.1W00102.5` and handed over by `push_button/fmc_to_irs_pos`
#     (probed: `irs/irs_pos_set` took it, mode stayed 1 aligning, 473 s left
#     at real alignment time).
#   - Electric hydraulic pumps, fuel pumps, window heats, trim air, the FD
#     switches: toggles, 0 to 1 probed. Engine hydraulic pumps read 1 cold.
#   - AC meter knob `ac_power_up` steps up (0 to 1), `_dn` down; 3 is APU GEN.
#   - Autobrake `autobrake_dn` steps DOWN (1 OFF to 0 RTO), `_up` up.
#   - Yaw damper `yaw_dumper` did NOT hold on the battery alone (it needs
#     hydraulic B and AC): it comes after the pumps here, named if it fails.
#   - Every exterior LAMP dataref (nav, logo, landing, taxi) reads 0 on the
#     battery whatever its switch: the lamps are AC. Hence the APU first.
# Already right cold and so read and passed over: isolation valve OPEN (2),
# recirc fans AUTO, CAB/UTIL and IFE on, engine bleeds on, start switches
# AUTO, crossfeed closed. Left out (owed): pressurisation mode (AUTO cold,
# direction unprobed), emergency exit lights (under a guard), transponder
# STBY and bank angle (already set cold), the MCP (the autoflight block's).
preflight:
  apu_first: true
  steps:
    # IRS to NAV first: the alignment takes minutes (433 to 473 s at EGHL).
    - { command: laminar/B738/toggle_switch/irs_L_right, down_command: laminar/B738/toggle_switch/irs_L_left, position: laminar/B738/toggle_switch/irs_left, want: 2, max_presses: 3 }
    - { command: laminar/B738/toggle_switch/irs_R_right, down_command: laminar/B738/toggle_switch/irs_R_left, position: laminar/B738/toggle_switch/irs_right, want: 2, max_presses: 3, say: "I.R.S. aligning." }
    - { command: laminar/B738/knob/ac_power_up, down_command: laminar/B738/knob/ac_power_dn, position: laminar/B738/knob/ac_power, want: 3, max_presses: 6 }
    - { command: laminar/B738/toggle_switch/hydro_pumps1, position: laminar/B738/toggle_switch/hydro_pumps1_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/hydro_pumps2, position: laminar/B738/toggle_switch/hydro_pumps2_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/electric_hydro_pumps1, position: laminar/B738/toggle_switch/electric_hydro_pumps1_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/electric_hydro_pumps2, position: laminar/B738/toggle_switch/electric_hydro_pumps2_pos, want: 1, say: "Hydraulics on." }
    - { command: laminar/B738/autopilot/cab_util_toggle, position: laminar/B738/toggle_switch/cab_util_pos, want: 1 }
    - { command: laminar/B738/autopilot/ife_pass_seat_toggle, position: laminar/B738/toggle_switch/ife_pass_seat_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/fuel_pump_lft1, position: laminar/B738/fuel/fuel_tank_pos_lft1, want: 1 }
    - { command: laminar/B738/toggle_switch/fuel_pump_lft2, position: laminar/B738/fuel/fuel_tank_pos_lft2, want: 1 }
    - { command: laminar/B738/toggle_switch/fuel_pump_rgt1, position: laminar/B738/fuel/fuel_tank_pos_rgt1, want: 1 }
    - { command: laminar/B738/toggle_switch/fuel_pump_rgt2, position: laminar/B738/fuel/fuel_tank_pos_rgt2, want: 1, say: "Fuel pumps on." }
    # Centre pumps only above 453 kg in the centre tank (`m_fuel[1]`, read
    # 0 with both wings at 3,698 kg).
    - { command: laminar/B738/toggle_switch/fuel_pump_ctr1, position: laminar/B738/fuel/fuel_tank_pos_ctr1, want: 1, when_above: { dataref: "sim/flightmodel/weight/m_fuel[1]", value: 453 } }
    - { command: laminar/B738/toggle_switch/fuel_pump_ctr2, position: laminar/B738/fuel/fuel_tank_pos_ctr2, want: 1, when_above: { dataref: "sim/flightmodel/weight/m_fuel[1]", value: 453 }, say: "Centre pumps on." }
    - { command: laminar/B738/toggle_switch/window_heat_l_side, position: laminar/B738/ice/window_heat_l_side_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/window_heat_l_fwd, position: laminar/B738/ice/window_heat_l_fwd_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/window_heat_r_fwd, position: laminar/B738/ice/window_heat_r_fwd_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/window_heat_r_side, position: laminar/B738/ice/window_heat_r_side_pos, want: 1, say: "Window heat on." }
    - { command: laminar/B738/toggle_switch/trim_air, position: laminar/B738/air/trim_air_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/l_recirc_fan, position: laminar/B738/air/l_recirc_fan_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/r_recirc_fan, position: laminar/B738/air/r_recirc_fan_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/iso_valve_dn, down_command: laminar/B738/toggle_switch/iso_valve_up, position: laminar/B738/air/isolation_valve_pos, want: 2, max_presses: 2 }
    - { command: laminar/B738/toggle_switch/bleed_air_1, position: laminar/B738/toggle_switch/bleed_air_1_pos, want: 1 }
    - { command: laminar/B738/toggle_switch/bleed_air_2, position: laminar/B738/toggle_switch/bleed_air_2_pos, want: 1 }
    - { command: laminar/B738/autopilot/flight_director_toggle, position: laminar/B738/autopilot/flight_director_pos, want: 1 }
    - { command: laminar/B738/autopilot/flight_director_fo_toggle, position: laminar/B738/autopilot/flight_director_fo_pos, want: 1, say: "Flight directors on." }
    - { command: laminar/B738/knob/autobrake_up, down_command: laminar/B738/knob/autobrake_dn, position: laminar/B738/autobrake/autobrake_pos, want: 0, max_presses: 6, say: "Autobrake R.T.O." }
  # The yaw damper holds only on an aligned platform: pressed in the
  # preflight it dropped every time; with the IRS in NAV one press held
  # (LEMG, 2026-10-07).
  after_aligned:
    - { command: laminar/B738/toggle_switch/yaw_dumper, position: laminar/B738/toggle_switch/yaw_dumper_pos, want: 1, say: "Yaw damper on." }
  align:
    modes: [laminar/B738/irs/irs_mode, laminar/B738/irs/irs2_mode]
    want: 2
    remaining: laminar/B738/irs/alignment_left_remain
    # Real alignment time is 5 to 17 minutes by latitude (B738_irs_time);
    # begun at the preflight it has the whole start behind it.
    timeout_secs: 900
    position_entry:
      dataref: laminar/B738/FMS/irs_pos_fmc_set
      command: laminar/B738/push_button/fmc_to_irs_pos
    # A knob already at NAV begins nothing: a runway start left both there
    # with the IRS off and the preflight read them set (LEMG 2026-10-07).
    # OFF and back to NAV, probed, read mode 1 with 384 s left.
    restart:
      - { off: laminar/B738/toggle_switch/irs_L_left, on: laminar/B738/toggle_switch/irs_L_right, presses: 2 }
      - { off: laminar/B738/toggle_switch/irs_R_left, on: laminar/B738/toggle_switch/irs_R_right, presses: 2 }
# The panel's rheostats are the Zibo's own: the stock flood write
# (`panel_brightness_ratio`) did not stand (probed 2026-10-07) and there is
# no command for them, so full auto's ramp leaves the panel lighting out.
ramp_panel_lights: false
# ---- end PREFLIGHT ----------------------------------------------------------

# Exterior lights on the Zibo's own commands where it has them, read back on
# the stock switch datarefs it drives (the pilot's cockpitdecks pages read
# the same stock names as the lamps' truth).
# - nav and strobe are ONE switch on a 737 (STROBE & STEADY / OFF / STEADY,
#   `laminar/B738/toggle_switch/position_light_pos`, read-only): strobes off
#   is STEADY (nav stays on), nav off is OFF (the strobes go too).
# - landing: the stock on/off are the Zibo's own "all landing lights"
#   handlers (B738_Commands.txt rewrite block).
# - beacon: the stock commands (not named in zibomod; the pilot's deck
#   fires the stock toggle).
# - taxi: the Zibo's taxi switch (`taxi_light_brightness_on/off`).
# Probed 2026-10-07 on the battery alone: every LAMP dataref (nav, landing,
# taxi, generic_lights_switch) reads 0 whatever the switch, the lamps being
# AC. So landing, taxi, logo and wing read back on their SWITCH positions
# (landing_lights_on set `land_lights_left_pos` and `_right_pos` 0 to 1;
# taxi_light_brightness_on 0 to 2; logo and wing `toggle_switch/logo_light`,
# `wing_light` 0 to 1, each off command back to 0). Nav and strobe share
# one three-position switch (`position_light_pos` 1 STROBE & STEADY,
# 0 OFF, -1 STEADY), which no on/off reading can tell apart, so they stay
# on their lamps: full auto reaches them only after the preflight's APU
# power (`preflight:` above).
lights:
  - { key: nav,     spoken: navigation lights, dataref: sim/cockpit2/switches/navigation_lights_on, command_on: laminar/B738/toggle_switch/position_light_steady, command_off: laminar/B738/toggle_switch/position_light_off }
  - { key: beacon,  spoken: beacon,            dataref: sim/cockpit2/switches/beacon_on,            command_on: sim/lights/beacon_lights_on,  command_off: sim/lights/beacon_lights_off }
  - { key: strobe,  spoken: strobe lights,     dataref: sim/cockpit2/switches/strobe_lights_on,     command_on: laminar/B738/toggle_switch/position_light_strobe, command_off: laminar/B738/toggle_switch/position_light_steady }
  - { key: landing, spoken: landing lights,    dataref: laminar/B738/switch/land_lights_left_pos,   command_on: sim/lights/landing_lights_on, command_off: sim/lights/landing_lights_off }
  - { key: taxi,    spoken: taxi light,        dataref: laminar/B738/toggle_switch/taxi_light_brightness_pos, command_on: laminar/B738/toggle_switch/taxi_light_brightness_on, command_off: laminar/B738/toggle_switch/taxi_light_brightness_off }
  - { key: logo,    spoken: logo light,        dataref: laminar/B738/toggle_switch/logo_light,      command_on: laminar/B738/switch/logo_light_on, command_off: laminar/B738/switch/logo_light_off }
  - { key: wing,    spoken: wing lights,       dataref: laminar/B738/toggle_switch/wing_light,      command_on: laminar/B738/switch/wing_light_on, command_off: laminar/B738/switch/wing_light_off }

# The seat belt switch is the Zibo's: a read-only position stepped by its
# up/down commands (zibomod: "Seat Belt Switch Up" / "Down"). 0 OFF parked.
# Probed 2026-10-06: `seatbelt_sign_dn` steps the position UP (0 to 1), so
# it is our up_command; 2 is ON (the clist's FASTEN BELTS item).
seat_belt_signs:
  position: laminar/B738/toggle_switch/seatbelt_sign_pos
  on: 2
  off: 0
  up_command: laminar/B738/toggle_switch/seatbelt_sign_dn
  down_command: laminar/B738/toggle_switch/seatbelt_sign_up

# The transponder mode knob is the Zibo's: `laminar/B738/knob/transponder_pos`
# is read-only (probed), so it is STEPPED by `transponder_mode_up/dn`. Parked
# it reads 1 with the stock mode at 1 (standby). The 737 panel has no OFF:
# TEST / STBY / ALT RPTG OFF / XPNDR / TA ONLY / TA-RA, which zibomod's direct
# commands name stby, altoff, alton, ta, tara. Taken as 0..5 in that order.
# VERIFY the numbering and that TA-RA (5) puts the stock mode at ALT.
transponder_mode_knob:
  dataref: laminar/B738/knob/transponder_pos
  off: 1
  standby: 1
  on: 2
  altitude: 5
  up_command: laminar/B738/knob/transponder_mode_up
  down_command: laminar/B738/knob/transponder_mode_dn

# Vmo 340 KIAS (Mmo 0.82), the placard (the acf's 400 is not).
vne_kts: 340.0
# The type's clean stall at mid weight (the stock profile's 139, quoted at
# `reference.stall_ref_weight_kg`); the acf's 110 is a light-weight arc, not
# a floor to fly.
vs_clean_kts: 139.0
# Gear operating limit (retract 235; the acf's Vle 270 is the extended limit).
vlo_kts: 235.0

# Boeing practice (the stock 737's, the same airframe type): the speedbrake
# DOWN for takeoff, armed at the gear. Through `speedbrake_lever:` above:
# stepped by command, read back on `flt_ctrls/speedbrake_lever`. The autobrake, flight directors,
# A/T arm and V2 window are NOT declared: each is written on a stock name
# this aircraft has its own switch for (autobrake: `laminar/B738/knob/
# autobrake_rto` and `autobrake_pos`; FD: `autopilot/flight_director_toggle`
# and `switches/autopilot/fd_ca`; A/T: `autopilot/autothrottle_arm_toggle`
# and `switches/autopilot/at_arm`; the window: `mcp_speed_dial_kts_mach`).
takeoff_config:
  arm_spoilers: true
  takeoff_speedbrake_down: true
  # Thrust reduction at 1,000 ft, to the climb N1 (`takeoff_thrust:`). The
  # lever ratio is only the fallback when the takeoff has no N1 plan (its
  # weight, OAT or pressure altitude did not read): 0.8, the 2026-10-07
  # stopgap's.
  thrust_reduction_agl_ft: 1000.0
  climb_thrust_ratio: 0.8

# Takeoff trim, set as a crew sets it (`crate::takeoff_trim`): the 737-800
# FCOM table for flaps 1 and 5 at 26K, units by CG (% MAC, rows) and weight
# (t, columns), as the aircraft's own FMC computes it (B738.calc.lua
# `flaps_1_5`). The stabilizer is set on ITS switch (the stock trim command
# does nothing here; pitch_trim_down held 2 s took 5.02 units to 4.84 on the
# battery) and read back on its gauge. The generic neutral trim was 8.35
# units, near the 8.5 stop: the aircraft rotated itself at 112 kt and lifted
# off at 118 against Vr 145 (LEMG, 2026-10-07, #231). Its FMC's own figure
# (FMS/trim_calc) needs PERF INIT, whose fields are read-only to the API.
takeoff_trim:
  units: laminar/B738/flight_model/stab_trim_units
  cg_mac: laminar/B738/real_cg_mac
  nose_up: laminar/B738/flight_controls/pitch_trim_up
  nose_down: laminar/B738/flight_controls/pitch_trim_down
