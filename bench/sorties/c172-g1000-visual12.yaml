# Autonomy in layers: the G1000 C172 on a VISUAL final, LEMG 12 (no ILS; its
# PAPI shows 3.00, `nav::papi_for`, blackbox `autoland` `papi`). The path is
# ours at the PAPI's angle, the autopilot on HDG and VS, the power on total
# energy, then the attitude flare. The no-ILS case LXGB needs.
#   xfc sortie bench/sorties/c172-g1000-visual12.yaml --check
#   xfc sortie bench/sorties/c172-g1000-visual12.yaml
after: stop

cases:
  - name: C172 G1000 LEMG 12 visual, 5 nm final, the PAPI's path
    setup:
      aircraft: "Aircraft/Laminar Research/Cessna 172 SP/Cessna_172SP_G1000.acf"
      approach: { field: LEMG, runway: 12, final_nm: 5 }
    traffic: off
    deadline_min: 10
