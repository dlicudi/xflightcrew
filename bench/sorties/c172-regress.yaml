# The 172 regression after the pillars refactor (stages A to C, 2026-10-07/08: the
# copilot untied from the loops, the station behind the party line, the command loop
# and grammar split, per-flight strips and the computed runway book). Every change
# was offline; this is the first flight over them.
#   xvl sortie bench/sorties/c172-regress.yaml --check
#   xvl sortie bench/sorties/c172-regress.yaml
# Check: the tower's taxi clearance, line-up, takeoff and landing clearances and the
# vacate report (atc records), the readbacks going out once, and the verdict PASS.
after: stop

cases:
  # The whole towered circuit from a stand: taxi clearance, line-up, takeoff, the
  # pattern, the landing, the vacate and the taxi in (runway book, strips, seam).
  - name: 172 LEMG circuit from the ramp
    setup:
      aircraft: "Aircraft/Laminar Research/Cessna 172 SP/Cessna_172SP.acf"
      ramp: { field: LEMG }
    command: fly a circuit
    deadline_min: 35
    after: park
