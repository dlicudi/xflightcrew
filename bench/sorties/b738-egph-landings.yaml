# The hand-flown landing below minimums, the 737 at EGPH into the wind (#321: the
# centreline bank and the flare; #322: the rollout's yaw rate), then the
# G1000 172 on the same laws. Traffic off: a landing clearance withheld for
# traffic is no test of the laws.
#   xfc sortie bench/sorties/b738-egph24-landings.yaml --check
#   xfc sortie bench/sorties/b738-egph24-landings.yaml
after: stop

cases:
  - name: B738 EGPH into the wind, 5 nm final
    setup:
      aircraft: "Aircraft/Laminar Research/Boeing 737-800/b738.acf"
      approach: { field: EGPH, runway: wind, final_nm: 5 }
    traffic: off
    deadline_min: 8

  - name: B738 EGPH into the wind, 5 nm final (2)
    setup:
      approach: { field: EGPH, runway: wind, final_nm: 5 }
    traffic: off
    deadline_min: 8

  - name: B738 EGPH into the wind, 5 nm final (3)
    setup:
      approach: { field: EGPH, runway: wind, final_nm: 5 }
    traffic: off
    deadline_min: 8

  - name: C172 G1000 LEMG into the wind, 5 nm final
    setup:
      aircraft: "Aircraft/Laminar Research/Cessna 172 SP/Cessna_172SP_G1000.acf"
      approach: { field: LEMG, runway: wind, final_nm: 5 }
    traffic: off
    deadline_min: 8
