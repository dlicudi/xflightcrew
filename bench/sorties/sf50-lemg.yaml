# The Cirrus Vision SF50 on LEMG from a 5 nm final, on whatever laws its profile flies
# (the baseline before it crosses to `layers`, docs/tasks/autonomy-layers):
# the pitch plant on the tape (`autoland` theta, alpha, q, elev_total, tas)
# measures its elevator authority for the attitude flare.
#   xvl sortie bench/sorties/sf50-lemg.yaml
after: stop

cases:
  - name: SF50 LEMG into wind, 5 nm final
    setup:
      aircraft: "Aircraft/Laminar Research/Cirrus Vision SF50/CirrusSF50.acf"
      approach: { field: LEMG, runway: wind, final_nm: 5 }
    traffic: off
    deadline_min: 10
