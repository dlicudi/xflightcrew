# Sortie runner spec: `xvl sortie bench/sorties/lemg-737.yaml [--repeat N]`
# (src/sortie_runner.rs). Run it from the xvl checkout while xvl is running
# and X-Plane is live with the aircraft under test loaded (these cases: the
# Laminar 737-800). The runner never flies: it sets up each case, types the
# mission into the panel's typed line, and reads the verdict the app's live
# scorer writes to logs/blackbox.jsonl. One row per case, printed and written
# to logs/sorties/run-<stamp>.md; exit 1 if any case failed. Ctrl-C types
# "my controls" and writes the rows so far.
#
# The shape:
#   cases:
#     - name: free text, the row's name
#       setup: exactly one of
#         approach:      { field: ICAO, runway: "13", final_nm: 10 }
#             a new flight on the final, engines running; the app's own
#             setup_approach arms autoland on the result, so there is NO
#             command (a typed command would make the sortie "attended").
#         runway_start:  { field: ICAO, runway: "13", engines_running: true }
#             the loaded aircraft on the threshold, through the setup mailbox.
#         ramp:          { field: ICAO, stand: "optional stand name" }
#             the loaded aircraft at a stand, cold and dark (no stand: the
#             set-up tool's own pick for the type).
#       command: the typed mission, as a pilot says it ("fly a circuit",
#                "full auto", "fly the flight plan"); required except on an
#                approach.
#       deadline_min: minutes from the command to the verdict (default 20,
#                     scaled up for an airframe slower on the approach than
#                     the 737's 145 kt, at most 2.5 times).
#       sim_speed: X-Plane's time multiplier while the sortie flies (1 to 16,
#                  default 1; put back to 1 after the case). Unmeasured: the
#                  laws tick in wall time, so treat 2x as an experiment.
#       settle_s: seconds after a ramp or runway start is still before the
#                 command (default 10, for the profile detection).
#       after: park (default) or stop, what follows the verdict on the
#              ground. park waits for the taxi-in to finish by itself before
#              the next setup (up to 10 min); stop types "my controls" at
#              once (the crew brakes to a stop and parks). Use park only
#              where the case tests the vacate, the taxi in or the stand.
#              A spec-level `after:` is every case's default.
#
# A runway YAML would read as a number may be quoted or not: 13 and "13"
# are the same runway. `runway: wind` is the into-wind end, picked at the
# case's setup by the tower's own rule (best_runway_for_wind) from the
# field's METAR, else the sim's wind with the aircraft on the field; the row
# names the runway and the wind.

# Landings and circuits: none of them tests the taxi in.
after: stop

cases:
  - name: LEMG into the wind, 10 nm final
    setup:
      approach: { field: LEMG, runway: wind, final_nm: 10 }
    deadline_min: 10

  - name: LEMG into the wind, 5 nm final
    setup:
      approach: { field: LEMG, runway: wind, final_nm: 5 }
    deadline_min: 8

  # "Fly a circuit" is full auto's circuit: on the runway it skips the
  # start and the taxi, works the tower, and flies the pattern to a landing.
  # Its sortie ends at the taxi_in stage; the taxi in follows unscored, and
  # `after: stop` ends it there.
  - name: LEMG runway start into the wind, circuit
    setup:
      runway_start: { field: LEMG, runway: wind, engines_running: true }
    command: fly a circuit
    deadline_min: 20
