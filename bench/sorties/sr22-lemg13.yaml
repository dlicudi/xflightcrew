# The SR22 on LEMG 13 from a 5 nm final, on whatever laws its profile flies
# (the baseline before it crosses to `layers`, docs/tasks/autonomy-layers):
# the pitch plant on the tape (`autoland` theta, alpha, q, elev_total, tas)
# measures its elevator authority for the attitude flare.
#   xvl sortie bench/sorties/sr22-lemg13.yaml
after: stop

cases:
  - name: SR22 LEMG 13, 5 nm final, the baseline
    setup:
      aircraft: "Aircraft/Laminar Research/Cirrus SR22/Cirrus SR22.acf"
      approach: { field: LEMG, runway: 13, final_nm: 5 }
    traffic: off
    deadline_min: 10
