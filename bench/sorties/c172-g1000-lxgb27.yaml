# Autonomy in layers: the G1000 C172 on a VISUAL final to LXGB 27 from the
# east, over the Mediterranean: no ILS, no RNAV procedure, the PAPI's 3.00
# (`nav::papi_for`), the Rock beside the runway, a short strip. Path ours,
# autopilot on HDG and VS, power on total energy, the attitude flare.
#   xfc sortie bench/sorties/c172-g1000-lxgb27.yaml --check
#   xfc sortie bench/sorties/c172-g1000-lxgb27.yaml
after: stop

cases:
  - name: C172 G1000 LXGB 27 visual, 5 nm final, the PAPI's path
    setup:
      aircraft: "Aircraft/Laminar Research/Cessna 172 SP/Cessna_172SP_G1000.acf"
      approach: { field: LXGB, runway: 27, final_nm: 5 }
    traffic: off
    deadline_min: 10
