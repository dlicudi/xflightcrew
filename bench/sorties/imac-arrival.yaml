# The SimBrief EGKK-EGBB arrival and the resume on its final (iMac).
after: stop
cases:
  - name: "EGKK-EGBB arrival from 30 nm before the top of descent (#156 #161)"
    setup:
      aircraft: "Aircraft/Laminar Research/Boeing 737-800/b738.acf"
      enroute: { at: before_tod_nm, value: 30 }
    command: fly the flight plan
    deadline_min: 50

  # #67 resume near the destination: the pilot takes it on a final to the
  # plan's runway and hands the plan back; full auto's resume joins the
  # arrival (`resume_join` near the destination, ARRIVAL_REJOIN_NM, autoland
  # on the plan's runway) or refuses naming its number. #54 (`handover`
  # record for "my controls"). Attended by design.
  - name: "resume the plan on a final to its destination (#67)"
    setup:
      aircraft: "Aircraft/Laminar Research/Boeing 737-800/b738.acf"
      approach: { field: plan_destination, runway: plan, final_nm: 15 }
    steps:
      - { say: my controls, when: { after_s: 30 }, tool: autopilot_off }
      - { say: resume flight plan, when: { after_s: 20 }, tool: full_auto }
    deadline_min: 15

  # #118 the departure check-in on an Approach-only field: EGBB has
  # Birmingham Approach 131.005 and no departure frequency in apt.dat.
  # Read: atc keyed service approach, intent the check-in, outcome reply
  # containing "radar contact, climb", state TakeoffCleared>Parked. The
  # local plan replaces the SimBrief one on the shelf, so it runs last.
