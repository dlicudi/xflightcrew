# The stock 737-800 on LEMG from a 5 nm final, on the pilot controller:
# its autopilot above minimums, hand flown from minimums to the wheels.
#   xvl sortie bench/sorties/b738-lemg.yaml
after: stop

cases:
  - name: 737 LEMG into wind, 5 nm final
    setup:
      aircraft: "Aircraft/Laminar Research/Boeing 737-800/b738.acf"
      approach: { field: LEMG, runway: wind, final_nm: 5 }
    traffic: off
    deadline_min: 10
