# --- 2026-07-10 flight (Extremadura): greetings, flight following, garbles ----
# Initial hails: a greeting earns "pass your message", never "say again".
- {text: "Good evening, Merida.", intent: greeting, radio: false}
- {text: "hello, banahos.", intent: greeting, radio: false}
- {text: "Checking in, radio check.", intent: radio_check, radio: true}
# Flight following, straight and as whisper mangled it ("but a host tower" =
# Badajoz Tower). A service request, answered honestly — never a clearance.
- {text: "Request flight following.", intent: flight_following, radio: true}
- {text: "But a host tower requesting flight following.", intent: flight_following, radio: true}
# Real emergency phrasing (conf 0.66) — "requesting emergency landing" is a
# mayday; the pilot was airborne and the clearance was correct.
- {text: "Radio calls to the tower, requesting emergency landing.", intent: mayday, radio: true}
# "When request vectors" — whisper's "then/when" prefix garble.
- {text: "When request vectors for approach.", intent: request_vectors, radio: true}
- {text: "Tower requesting clearance.", intent: request_clearance, radio: true}

