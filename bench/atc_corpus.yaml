# "Established" is the ILS arrival's final report (earns the clearance from
# the tower, the handoff from approach). Whisper splits the acronym.
- {text: "established i l s runway zero niner", intent: report_final, radio: true}
- {text: "established on the localizer", intent: report_final, radio: true}
- {text: "localiser established, november one seven two", intent: report_final, radio: true}
# But asking ABOUT being established parses unknown — the question guard
# keeps it off the tower (unkeyed it falls to the copilot; keyed earns a
# "say again", never a clearance).
- {text: "how do we know when we're established", intent: unknown, radio: true}

