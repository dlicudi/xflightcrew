- {text: "takeoff checklist", intent: unknown, radio: false}
- {text: "after landing checklist", intent: unknown, radio: false}
- {text: "before takeoff checklist complete", intent: unknown, radio: false}
# These two still parse as intents (they ARE clearance words) — the unkeyed
# radio gate is what keeps them away from the tower. Keyed, they'd route:
# that's the documented cost of keying the transmit button.
- {text: "land the aircraft", intent: request_landing, radio: false}
- {text: "set flaps for takeoff", intent: request_takeoff, radio: false}
- {text: "anything else we need to do before takeoff", intent: request_takeoff, radio: false}

