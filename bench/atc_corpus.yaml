# --- Cockpit commands that contain radio words: must fall through -------------
- {text: "taxi light on", intent: unknown, radio: false}
- {text: "landing light on", intent: unknown, radio: false}
- {text: "landing gear down", intent: unknown, radio: false}
- {text: "gear down for landing", intent: unknown, radio: false}
- {text: "flaps set for landing", intent: unknown, radio: false}
- {text: "landing light off and taxi light on", intent: unknown, radio: false}
- {text: "release the taxi hold", intent: unknown, radio: false}
