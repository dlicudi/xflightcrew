# The readback: an echo, never a new request.
- {text: "Cleared to Edinburgh via the Gosa one Charlie departure, runway two four, climb five thousand feet, squawk four five two one, November one seven two Sierra Papa.", intent: unknown, readback: true}
- {text: "cleared to edinburgh, climb 5,000 feet, squawk 4521", intent: unknown, readback: true}

# --- Start-up requests (NOT the zone clearance) -------------------------------
