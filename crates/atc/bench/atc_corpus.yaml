# The ATC battle-test corpus: what pilots actually said, what whisper actually
# wrote, and the near-misses that must never earn a clearance.
#
# Sources: real transmissions mined from logs/xvoicelayer.log.* (2026-06/07
# flights, kept verbatim including whisper's mangling), plus hand-written
# paraphrases and corruptions in whisper's real failure modes (homophones,
# dropped words, merged words). Run by `transcript_corpus_parses_safely` in
# src/station.rs on every `cargo test`.
#
# Fields per case:
#   text      what whisper handed the router (case-insensitive)
#   intent    expected tower::parse_intent, by label (see tower::intent_from_label)
#   radio     expected station::is_radio_call for UNKEYED routing (optional).
#             false means the utterance falls through to the copilot untouched;
#             it can still reach the tower when the radio PTT is keyed.
#   readback  expected tower::is_readback (optional)
#
# The safety property throughout: a mishear may degrade to "say again"
# (intent: unknown), but must never degrade INTO a clearance-earning intent.

# --- Taxi requests: real calls -----------------------------------------------
- {text: "Gibraltar Tower, November 172SP, request taxi", intent: request_taxi, radio: true}
- {text: "Request clearance for taxi.", intent: request_taxi, radio: true}
- {text: "Requesting clearance for taxi.", intent: request_taxi, radio: true}
- {text: "You request clearance for taxi.", intent: request_taxi, radio: true}
- {text: "Am I clear to taxi?", intent: request_taxi, radio: false}
- {text: "I am now taxiing.", intent: request_taxi, radio: false}

