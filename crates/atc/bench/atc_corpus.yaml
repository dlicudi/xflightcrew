# --- Readbacks of the runway-critical clearances (added 2026-07-11) -----------
# The readback gate (tower::check_readback) verifies these against the
# awaited clearance; here the corpus only polices the parser layer: they
# must read as READBACKS (silence-worthy), never as fresh requests that
# could move the state a second time. "lining up" and "holding position"
# joined is_readback with the LUAW work.
- {text: "lining up runway zero niner, november one seven two sierra papa", intent: unknown, radio: false, readback: true}
- {text: "behind the landing traffic, lining up runway two seven behind", intent: unknown, radio: false, readback: true}
- {text: "holding position, november one seven two sierra papa", intent: unknown, radio: false, readback: true}
- {text: "holding position", intent: unknown, radio: false, readback: true}
- {text: "cleared for takeoff runway zero niner, november one seven two sierra papa", intent: unknown, readback: true}
- {text: "cleared to land runway zero niner, november one seven two sierra papa", intent: unknown, readback: true}
# Confirm-questions are NOT readbacks — the gate answers them by repeating
# the instruction, and the question guard keeps them off the state machine.
- {text: "confirm cleared for takeoff?", intent: unknown, radio: false, readback: false}
- {text: "say again the clearance", intent: unknown, radio: false, readback: false}

