# Gibraltar's route table, read by crates/traffic/src/routes.rs (embedded
# at build time, validated by its tests). A row names its carrier by the
# Rust constant in crates/traffic/src/airlines.rs; `number` is the INBOUND
# flight of the day's first rotation, its outbound the next number;
# `windows` are the local hours the arrivals fall in (absent: the carrier's
# lines of flying); `based: true` night-stops the first rotation; `types`
# are the route's own types by weight (absent: the carrier's). Row order is
# kept: the day's draws follow it.
#
# Source (read 2026-10-13): Wikipedia, "Gibraltar International Airport",
# Airlines and destinations (British Airways to Heathrow; easyJet to
# Birmingham, Bristol, Gatwick and Manchester) and its 2024 route table
# (Heathrow 193,714 passengers, Gatwick 130,689, Manchester 68,615, Bristol
# 31,038; 3,628 movements in the year, about ten a day). BA492 Heathrow to
# Gibraltar and BA493 back, off the blocks 15:10 local
# (flightradar24.com/data/flights/ba493, planemapper.com/flights/BA492).
#
# Gibraltar (2024 pattern): BA twice a day to Heathrow in summer, once in
# winter at its 14:20 slot; easyJet to Gatwick most days and Manchester,
# Bristol and Birmingham a few days a week, midday into the afternoon (the
# runway shares the frontier road, so nothing night-stops). Gibraltar's rows
# keep the published slots.
icao: LXGB
# Standard time's offset from UTC, hours (Gibraltar keeps Central European
# Time, with the EU's summer time on top).
utc_offset_h: 1.0
routes:
  - {carrier: BAW_EUROPE, number: 492, other: EGLL, city: "London Heathrow", summer: 7, winter: 7, windows: [[14.0, 14.5]]}
  - {carrier: BAW_EUROPE, number: 490, other: EGLL, city: "London Heathrow", summer: 7, winter: 4, windows: [[10.25, 10.75]]}
  - {carrier: EZY, number: 8901, other: EGKK, city: "London Gatwick", summer: 9, winter: 6, windows: [[11.5, 12.5], [17.5, 18.5]]}
  - {carrier: EZY, number: 1911, other: EGCC, city: "Manchester", summer: 5, winter: 3, windows: [[13.0, 13.5]]}
  - {carrier: EZY, number: 6191, other: EGGD, city: "Bristol", summer: 3, winter: 2, windows: [[15.5, 16.0]]}
  - {carrier: EZY, number: 2101, other: EGBB, city: "Birmingham", summer: 2, winter: 0, windows: [[16.5, 17.0]]}
