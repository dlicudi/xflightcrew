# Malaga's route table, read by crates/traffic/src/routes.rs (embedded at
# build time, validated by its tests). A row names its carrier by the Rust
# constant in crates/traffic/src/airlines.rs; `number` is the INBOUND flight
# of the day's first rotation, its outbound the next number; `windows` are
# the local hours the arrivals fall in (absent: the carrier's lines of
# flying); `based: true` night-stops the first rotation; `types` are the
# route's own types by weight (absent: the carrier's). Row order is kept:
# the day's draws follow it.
#
# Source (read 2026-10-13): Wikipedia, "Malaga Airport", Airlines and
# destinations and the 2025 route tables (Gatwick 1.24 M, Amsterdam 1.05 M,
# Barcelona 1.04 M, Dublin 853 k, ... down to San Sebastian 19 k); 186,990
# movements in 2025, about 512 a day, the summer near 600.
#
# Malaga (2025 pattern), its busiest routes first. Malaga's times are the
# carriers' LINES OF FLYING: each aircraft's day built from the route's
# block time and turnarounds (crates/traffic/src/rotation.rs).
icao: LEMG
# Standard time's offset from UTC, hours (Spain keeps Central European
# Time, with the EU's summer time on top).
utc_offset_h: 1.0
