name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch cancels the previous run for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The ATC brain (station/tower/nav/atis) plus the sim plumbing. These crates
  # are free of whisper/cpal/ort by design (`cargo tree -p atc` is the health
  # check), so they build and test on plain Linux in a minute or two — the fast
  # signal on every push. Covers the scripted-sortie dialogues, the adversarial
  # transcript corpus, the tower FSM, apt.dat routing, and the FakeXPlane layer.
  atc-brain:
    name: atc brain (linux, fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native deps
        # reqwest's default TLS backend links OpenSSL.
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the atc + sim crates
        run: cargo test --locked -p atc -p sim

  # The whole workspace, including the copilot binary crate. whisper-rs is built
  # with the `metal` feature (Apple GPU inference), so the full suite only builds
  # on macOS — which also matches the development machine and gives the crew-side
  # tests (the auto-takeoff sortie, the tool/control-loop tests over FakeXPlane,
  # the monitor and grammar suites) a real run. The `#[ignore]` tests that need a
  # live X-Plane, Ollama, or audio models do NOT run here.
  full:
    name: full workspace (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the whole workspace
        run: cargo test --locked --workspace

# Note: no rustfmt/clippy gate. The codebase is deliberately hand-formatted
# (packed match arms, dense comment blocks) and is not `cargo fmt`-clean, so a
# format gate would fail on existing code, not on new changes. Add one only
# after a deliberate repo-wide `cargo fmt` if the house style ever changes.
