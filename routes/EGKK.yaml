# Gatwick's route table, read by crates/traffic/src/routes.rs (embedded at
# build time, validated by its tests). A row names its carrier by the Rust
# constant in crates/traffic/src/airlines.rs; `number` is the INBOUND flight
# of the day's first rotation, its outbound the next number; `windows` are
# the local hours the arrivals fall in (absent: the carrier's lines of
# flying); `based: true` night-stops the first rotation; `types` are the
# route's own types by weight (absent: the carrier's). Row order is kept:
# the day's draws follow it.
#
# A route to another table field is written ONCE (2026-10-14): Malaga's six
# Gatwick routes (easyJet, BA, Vueling, Wizz, Jet2, TUI) are in LEMG.yaml
# and Gibraltar's easyJet in LXGB.yaml, and this table derives them, the
# same flights seen from here a block time away. They are not written
# below.
#
# Sources (read 2026-10-14): Wikipedia, "Gatwick Airport" (operating bases,
# Airlines and destinations, the busiest routes of 2025 international and
# 2024 domestic, annual traffic); UK CAA, UK airport data annual 2025
# (Table 12.1 international and 12.2 domestic route analysis, Table 03.1
# aircraft movements, Table 05 air transport movements: 263,113 movements
# in 2025, 261,529 of them air transport, 721 a day, a summer day 850 to
# 900); Emirates' media centre and AirInsight (three daily A380s and a
# fourth daily A350-900 since 9 February 2026); Travelradar (Turkish from
# 26 to 28 a week, summer 2025); Air Cargo Week (Qatar double daily on the
# 787); FlightAware logs (China Eastern's B77W, B773 and A332 to Pudong);
# Gatwick's media centre (Air China and China Eastern to Shanghai);
# airplanes.live (Norse Atlantic UK, Sky Express).
#
# The method, as Malaga's: a route's weekly rotations are its 2025
# passengers over a full narrowbody each way (150 seated, 85% full) and the
# 52 weeks, split between the carriers the article names on it (the split
# is judgement: no source publishes it); a year-round route flies 1.2 of
# that in the summer and 0.7 in the winter, a winter-sun or ski route the
# same all year, a summer-heavy one 1.5 in the summer, a summer-only one
# 1.68 in the summer and none in the winter. The rows are the 40 busiest
# international routes and the 9 busiest domestic ones, 60% of Gatwick's
# passengers.
#
# SCALED by 0.7 and rounded: Gatwick carries 163.5 passengers a movement,
# not the method's 127.5 (easyJet's A321neos, the widebodies), and Malaga's
# table flies about 0.62 of the method as written; at 0.7 the two tables
# agree. A route flown more than seven a day is two rows (Ryanair to
# Dublin, easyJet to Rome). Long haul and the Gulf keep their PUBLISHED
# frequencies (Emirates 28 a week, Turkish 28, Qatar 14) or an estimate
# from passengers over a widebody's seats (Shanghai, Orlando, Cancun, New
# York), in published-like windows. The rest of Gatwick's day (the long
# tail of routes below the cut) is the hour generator's TOP-UP
# (`top_up: true`, crates/traffic/src/midflow.rs `top_up`): it flies the
# field's own rate less what this table flies in the hour.
#
# Flight numbers are illustrative inside each carrier's own range (BA's
# Gatwick flights are its 2xxx ones), spaced so a day's rotations never
# collide. Wizz flies as WZZ, not Wizz Air UK's WUK, so the Malaga route
# keeps its one carrier.
icao: EGKK
city: "London Gatwick"
# Standard time's offset from UTC, hours (the United Kingdom keeps
# Greenwich Mean Time with British Summer Time on top, on the EU's dates:
# the last Sundays of March and October).
utc_offset_h: 0.0
top_up: true
