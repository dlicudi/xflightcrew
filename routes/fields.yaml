# Every field a route names (crates/traffic/src/routes.rs, places.rs):
# its name as a board shows it, its airport reference point (X-Plane 12's
# Global Airports apt.dat, `1302 datum_lat/lon`, else the first runway's
# middle, rounded to a hundredth of a degree), its standard time's offset
# from UTC, hours, and whether it keeps summer time (on the EU's dates; the
# United States' differ by a few weeks, near enough for a timetable).
# `top_up: true`: the field's routes cover only its busiest, and the hour
# generator flies the rest of its rate (crates/traffic/src/midflow.rs).
#
# The routes themselves are in carriers/<ICAO code>.yaml, one file per
# operator. A row's `at` is the field it was written for: `number` is the
# INBOUND flight at `at` of the day's first rotation, its outbound the next
# number; `windows` are the local hours at `at` the arrivals fall in
# (absent: the carrier's lines of flying); `based: true` night-stops the
# first rotation at `at`; `types` are the route's own types by weight
# (absent: the carrier's). A field that is some row's `at` has a timetable;
# a row whose `other` has one too is derived there, the same flights seen
# from the other end. A carrier writes a pair from one end only.
#
# The hand tables, converted 2026-10-15 from one file per field:
#
# Gibraltar (LXGB). Source (read 2026-10-13): Wikipedia, "Gibraltar
# International Airport", Airlines and destinations (British Airways to
# Heathrow; easyJet to Birmingham, Bristol, Gatwick and Manchester) and its
# 2024 route table (Heathrow 193,714 passengers, Gatwick 130,689,
# Manchester 68,615, Bristol 31,038; 3,628 movements in the year, about ten
# a day). BA492 Heathrow to Gibraltar and BA493 back, off the blocks 15:10
# local (flightradar24.com/data/flights/ba493, planemapper.com/flights/BA492).
# The 2024 pattern: BA twice a day to Heathrow in summer, once in winter at
# its 14:20 slot; easyJet to Gatwick most days and Manchester, Bristol and
# Birmingham a few days a week, midday into the afternoon (the runway shares
# the frontier road, so nothing night-stops). Its rows keep the published
# slots.
#
# Malaga (LEMG). Source (read 2026-10-13): Wikipedia, "Malaga Airport",
# Airlines and destinations and the 2025 route tables (Gatwick 1.24 M,
# Amsterdam 1.05 M, Barcelona 1.04 M, Dublin 853 k, ... down to San
# Sebastian 19 k); 186,990 movements in 2025, about 512 a day, the summer
# near 600. Its times are the carriers' LINES OF FLYING: each aircraft's
# day built from the route's block time and turnarounds
# (crates/traffic/src/rotation.rs).
#
# Gatwick (EGKK). Sources (read 2026-10-14): Wikipedia, "Gatwick
# Airport" (operating bases, Airlines and destinations, the busiest routes
# of 2025 international and 2024 domestic, annual traffic); UK CAA, UK
# airport data annual 2025 (Table 12.1 international and 12.2 domestic
# route analysis, Table 03.1 aircraft movements, Table 05 air transport
# movements: 263,113 movements in 2025, 261,529 of them air transport, 721
# a day, a summer day 850 to 900); Emirates' media centre and AirInsight
# (three daily A380s and a fourth daily A350-900 since 9 February 2026);
# Travelradar (Turkish from 26 to 28 a week, summer 2025); Air Cargo Week
# (Qatar double daily on the 787); FlightAware logs (China Eastern's B77W,
# B773 and A332 to Pudong); Gatwick's media centre (Air China and China
# Eastern to Shanghai); airplanes.live (Norse Atlantic UK, Sky Express).
#
# The method: a route's weekly rotations are its passengers over a full
# narrowbody each way (150 seated, 85% full) and the 52 weeks, split
# between the carriers the article names on it (the split is judgement: no
# source publishes it); a year-round route flies 1.2 of that in the summer
# and 0.7 in the winter, a winter-sun or ski route the same all year, a
# summer-heavy one 1.5 in the summer, a summer-only one 1.68 in the summer
# and none in the winter. Gatwick's rows are its 40 busiest international
# routes and 9 busiest domestic ones, 60% of its passengers, SCALED by 0.7
# (it carries 163.5 passengers a movement, not the method's 127.5); a route
# flown more than seven a day is two rows. Long haul and the Gulf keep
# their PUBLISHED frequencies (Emirates 28 a week, Turkish 28, Qatar 14) or
# an estimate from passengers over a widebody's seats, in published-like
# windows. Flight numbers are illustrative inside each carrier's own range
# (only BA's are the real ones), spaced so a day's rotations never collide.
